<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaomoji Picker</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    <div>
      <h1>Kaomoji Picker</h1>
      <p>Japanese emoticons · click to copy</p>
    </div>
  </header>

  <section class="glass panel" id="recentPanel">
    <h2>Recently used</h2>
    <div class="chip-grid" id="recentGrid"></div>
    <p class="hint" id="recentEmpty">Nothing yet — click a kaomoji to copy it and it lands here.</p>
  </section>

  <section class="glass panel">
    <h2>Browse</h2>
    <input id="search" class="search" type="search" placeholder="Search kaomoji…" aria-label="Search kaomoji">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="chip-grid" id="grid"></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <footer class="foot">All local · zero network · v1.0.0</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
