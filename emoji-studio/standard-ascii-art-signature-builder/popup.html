<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SigArt</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="brand">
  <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V7l8-4 8 4v10"/><path d="M9 21v-6h6v6"/><path d="M4 17h16"/></svg>
  <div>
    <h1>SigArt</h1>
    <p>ASCII art signature builder</p>
  </div>
</header>

<main>
  <section class="panel">
    <label class="field-label" for="textInput">Your text</label>
    <textarea id="textInput" rows="2" maxlength="60" placeholder="Type your signature…" spellcheck="false"></textarea>
    <div class="controls">
      <div class="control">
        <label for="fillChar">Fill character</label>
        <input type="text" id="fillChar" value="#" maxlength="2" spellcheck="false">
      </div>
      <div class="control grow">
        <label for="scale">Character width (scale): <span id="scaleVal">1×</span></label>
        <input type="range" id="scale" min="1" max="3" step="1" value="1">
      </div>
      <div class="control grow">
        <label for="spacing">Letter spacing: <span id="spacingVal">1</span></label>
        <input type="range" id="spacing" min="0" max="3" step="1" value="1">
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="preview-head">
      <h2>Preview</h2>
      <span class="stats" id="stats"></span>
    </div>
    <pre id="preview" aria-label="ASCII art preview"></pre>
    <div class="actions">
      <button class="btn primary" id="copyBtn">Copy</button>
      <button class="btn secondary" id="downloadBtn">Download .txt</button>
    </div>
    <p class="note" id="status">Rendered locally with the built-in 5×5 pixel font. No network.</p>
  </section>
</main>

<script src="popup.js"></script>
</body>
</html>
