<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColonPick — :shortcode: Emoji Picker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8"/><path d="M9 9.5h.01"/><path d="M15 9.5h.01"/></svg>
      </div>
      <div class="title-block">
        <h1>ColonPick</h1>
        <p class="subtitle">:shortcode: emoji picker</p>
      </div>
      <button class="mode-toggle" id="modeToggle" type="button" title="Toggle what gets copied">
        <span class="mode-label">Copy:</span>
        <span class="mode-value" id="modeValue">😀 emoji</span>
      </button>
    </header>

    <div class="notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span>Popup picker only — it does <strong>not</strong> inject autocomplete into web pages. Search, click, paste anywhere yourself.</span>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Type a shortcode…  e.g. :fire: or thumbs" autocomplete="off" spellcheck="false" />
      <button id="clearSearch" class="clear-btn hidden" type="button" aria-label="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <section class="panel hidden" id="recentPanel">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        Recent
      </div>
      <div class="grid" id="recentGrid"></div>
    </section>

    <section class="panel">
      <div class="panel-title row">
        <span id="resultsTitle">All emoji</span>
        <span class="count" id="resultCount">0</span>
      </div>
      <div class="grid" id="emojiGrid"></div>
      <p class="empty hidden" id="emptyState">No emoji match. Try another word.</p>
    </section>

    <div class="toast hidden" id="toast"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
