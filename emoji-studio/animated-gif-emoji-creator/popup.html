<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<title>FrameFX — Emoji Animation Studio</title>
</head>
<body>
<div class="app">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    <div>
      <h1>FrameFX</h1>
      <p class="sub">Emoji animation studio</p>
    </div>
  </header>

  <p class="honest-note">Honest scope: exports <strong>PNG frames</strong> only — no GIF encoding, nothing leaves your device.</p>

  <section class="panel">
    <label class="fld-label" for="emojiInput">Emoji</label>
    <div class="emoji-row">
      <input id="emojiInput" type="text" maxlength="12" value="🎉" aria-label="Emoji to animate">
      <div class="swatches" id="swatches" role="group" aria-label="Quick pick emoji"></div>
    </div>
  </section>

  <section class="panel">
    <label class="fld-label">Animation</label>
    <div class="anim-grid" id="animGrid" role="radiogroup" aria-label="Animation style">
      <button class="anim-btn active" data-anim="bounce" role="radio" aria-checked="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v10"/><path d="m7 9 5-6 5 6"/><circle cx="12" cy="18" r="3"/></svg>
        Bounce
      </button>
      <button class="anim-btn" data-anim="spin" role="radio" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        Spin
      </button>
      <button class="anim-btn" data-anim="pulse" role="radio" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" opacity="0.5"/></svg>
        Pulse
      </button>
      <button class="anim-btn" data-anim="shake" role="radio" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h4l2-6 4 12 2-6h4"/></svg>
        Shake
      </button>
    </div>
  </section>

  <section class="panel">
    <div class="stage-wrap">
      <canvas id="stage" width="160" height="160" aria-label="Animation preview"></canvas>
      <span class="badge">LIVE</span>
    </div>
  </section>

  <section class="panel sliders">
    <div class="sld-row">
      <label for="fpsRange">Frame rate <span id="fpsVal">12 fps</span></label>
      <input type="range" id="fpsRange" min="4" max="24" step="1" value="12">
    </div>
    <div class="sld-row">
      <label for="framesRange">Frames <span id="framesVal">12</span></label>
      <input type="range" id="framesRange" min="4" max="36" step="1" value="12">
    </div>
    <div class="sld-row">
      <label for="sizeRange">Emoji size <span id="sizeVal">96 px</span></label>
      <input type="range" id="sizeRange" min="48" max="128" step="4" value="96">
    </div>
  </section>

  <div class="actions">
    <button id="playBtn" class="btn ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 5v14l11-7z"/></svg>
      Replay
    </button>
    <button id="exportBtn" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
      Export PNG frames
    </button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
</div>
<script src="popup.js"></script>
</body>
</html>
