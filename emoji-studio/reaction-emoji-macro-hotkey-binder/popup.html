<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
    <div>
      <h1>MacroReact</h1>
      <p class="tagline">Hotkey → emoji, copied to clipboard</p>
    </div>
  </header>

  <section class="panel">
    <h2>Macro slots</h2>
    <div id="slots"></div>
    <p class="hint">
      Press a hotkey anywhere to copy that slot's emoji.
      Change hotkeys at <span class="kbd">chrome://extensions/shortcuts</span>.
      Hotkey-to-copy only — this extension never listens to keystrokes.
    </p>
  </section>

  <section class="panel">
    <h2>Emoji library</h2>
    <p class="hint">Click an emoji to load it into the selected slot.</p>
    <div id="library" class="emoji-grid"></div>
  </section>

  <div id="toast" class="toast" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
