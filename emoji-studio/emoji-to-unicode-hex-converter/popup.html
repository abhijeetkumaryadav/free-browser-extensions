<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<title>GlyphHex — Emoji Unicode Converter</title>
</head>
<body>
<div class="app">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 9-2 2 2 2"/><path d="m15 9 2 2-2 2"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
    <div>
      <h1>GlyphHex</h1>
      <p class="sub">Emoji ⇄ Unicode codepoints</p>
    </div>
  </header>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="encode" role="tab" aria-selected="true">Emoji → Code</button>
      <button class="tab" data-tab="decode" role="tab" aria-selected="false">Code → Emoji</button>
    </div>

    <div id="tabEncode" class="tabpane active" role="tabpanel">
      <label class="fld-label" for="emojiInput">Emoji or text</label>
      <textarea id="emojiInput" rows="2" placeholder="Paste emoji here… e.g. 👨‍👩‍👧‍👦">👨‍👩‍👧‍👦</textarea>
      <div class="swatches" id="swatches" role="group" aria-label="Quick pick emoji"></div>
      <div id="results" class="results" aria-live="polite"></div>
      <div class="actions">
        <button id="copyListBtn" class="btn ghost">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy U+ list
        </button>
        <button id="copyEscBtn" class="btn primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
          Copy \u{…} escapes
        </button>
      </div>
    </div>

    <div id="tabDecode" class="tabpane" role="tabpanel">
      <label class="fld-label" for="codeInput">Codepoints (space / comma / newline separated)</label>
      <textarea id="codeInput" rows="3" placeholder="U+1F600  U+1F44D  or  \u{1F600}  or  1F600"></textarea>
      <div class="actions">
        <button id="decodeBtn" class="btn primary full">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
          Convert to emoji
        </button>
      </div>
      <div id="decodeOut" class="decode-out" aria-live="polite"></div>
    </div>
  </section>

  <p class="note">ZWJ sequences, skin-tone modifiers and regional indicators are split into real grapheme clusters via <code>Intl.Segmenter</code>. Surrogate pairs handled correctly. All local, zero network.</p>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</div>
<script src="popup.js"></script>
</body>
</html>
