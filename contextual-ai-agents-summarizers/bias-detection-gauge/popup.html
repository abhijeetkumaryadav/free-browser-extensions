<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bias Detection Gauge</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="glass">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a7 7 0 1 1 7-7"/><polyline points="12 15 16 8"/><circle cx="12" cy="15" r="1.5" fill="currentColor"/></svg>
    <div><h1>Bias Gauge</h1><p>Heuristic writing aid · on-device</p></div>
  </header>
  <main>
    <section class="glass card">
      <textarea id="text" rows="5" placeholder="Paste text here to scan for loaded-language signals…"></textarea>
      <div class="btnrow">
        <button id="analyze" class="primary">Analyze</button>
        <button id="clear" class="ghost">Clear</button>
      </div>
    </section>
    <section id="result" class="glass card" hidden>
      <div class="gauge-wrap">
        <svg id="gauge" viewBox="0 0 200 115" class="gauge">
          <path d="M20 100 A 80 80 0 0 1 180 100" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14" stroke-linecap="round"/>
          <path id="arc" d="M20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
          <line id="needle" x1="100" y1="100" x2="100" y2="34" stroke="#f4f6fb" stroke-width="3" stroke-linecap="round"/>
          <circle cx="100" cy="100" r="7" fill="#f59e0b"/>
        </svg>
        <div class="score"><b id="scoreNum">0</b><span>/ 100 signal</span></div>
      </div>
      <div id="verdict" class="verdict">—</div>
      <div id="findings"></div>
    </section>
    <p class="note">This is a heuristic writing aid, not a verdict on truth. It flags word choices that <em>can</em> signal one-sided framing — context decides.</p>
  </main>
<script src="popup.js"></script>
</body>
</html>
