<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multilingual Video Dubber</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="glass">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="14" x="3" y="5" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg>
    <div><h1>Video Dubber</h1><p id="host">—</p></div>
    <button id="scan" class="primary">Scan page</button>
  </header>
  <main>
    <section id="tracksCard" class="glass card" hidden>
      <h2>Caption tracks</h2>
      <div id="tracks"></div>
      <p class="note">Caption extraction only — this tool reads existing subtitles. It does not generate AI dubbing audio.</p>
    </section>
    <section id="capsCard" class="glass card" hidden>
      <h2 id="capsTitle">Captions</h2>
      <div id="capsMeta" class="meta"></div>
      <div id="capsList" class="caps"></div>
      <div class="btnrow">
        <button id="srt" class="primary">Export .srt</button>
        <button id="copyTxt" class="ghost">Copy text</button>
      </div>
    </section>
    <section id="vocabCard" class="glass card" hidden>
      <h2>Vocabulary <span class="sub">top words · learners</span></h2>
      <div id="vocab"></div>
      <button id="copyVocab" class="ghost">Copy list</button>
    </section>
    <div id="empty" class="empty">Open a page with a <b>video</b>, hit <b>Scan page</b>, then extract any caption track.</div>
  </main>
<script src="popup.js"></script>
</body>
</html>
