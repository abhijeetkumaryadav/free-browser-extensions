<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Chapter Generator</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="glass">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="8" cy="6" r="1.4" fill="currentColor"/><circle cx="8" cy="12" r="1.4" fill="currentColor"/><circle cx="8" cy="18" r="1.4" fill="currentColor"/></svg>
    <div><h1>Chapter Generator</h1><p id="pageHost">—</p></div>
    <button id="importBtn" class="primary" hidden>Import</button>
  </header>
  <main>
    <div id="notYt" class="empty">Open a YouTube watch page, then open this popup to build its chapter list.</div>
    <div id="editor" hidden>
      <section class="glass card">
        <div class="video-title" id="videoTitle">—</div>
        <p class="note">Chapters are hand-made markers — this tool never auto-generates them. YouTube needs the first marker at <b>00:00</b> and at least <b>3 chapters</b>.</p>
        <div id="chapters"></div>
        <button id="addBtn" class="ghost">＋ Add chapter</button>
        <div id="errors" class="errors" hidden></div>
      </section>
      <section class="glass card">
        <h2>Preview — paste into description</h2>
        <pre id="preview" class="preview"></pre>
        <button id="copyBtn" class="primary wide">Copy chapter list</button>
      </section>
    </div>
  </main>
<script src="popup.js"></script>
</body>
</html>
