<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opinion Sentiment Aggregator</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="glass">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/><path d="M9 10h.01M12.5 10h.01M16 10h.01"/></svg>
    <div><h1>Sentiment Aggregator</h1><p>On-device lexicon analysis</p></div>
  </header>
  <main>
    <section class="glass card">
      <label class="fld">Opinions <span class="hint">— one per line, or blank line between them</span>
        <textarea id="input" rows="6" placeholder="Paste reviews or opinions here…"></textarea>
      </label>
      <div class="btnrow">
        <button id="analyze" class="primary">Analyze</button>
        <button id="clear" class="ghost">Clear</button>
      </div>
    </section>
    <section class="glass card" id="results" hidden>
      <h2>Aggregate</h2>
      <div class="agg">
        <svg id="gauge" viewBox="0 0 200 120" class="gauge"></svg>
        <div class="agg-side">
          <div class="verdict" id="verdict">—</div>
          <div class="counts">
            <span class="c-pos"><b id="cPos">0</b> positive</span>
            <span class="c-neu"><b id="cNeu">0</b> neutral</span>
            <span class="c-neg"><b id="cNeg">0</b> negative</span>
          </div>
        </div>
      </div>
      <div class="picks">
        <div class="pick"><span>Most positive</span><p id="pickPos">—</p></div>
        <div class="pick"><span>Most negative</span><p id="pickNeg">—</p></div>
      </div>
      <h2>Per-opinion scores</h2>
      <div id="items"></div>
      <h2>Top sentiment words</h2>
      <div id="words" class="chips"></div>
    </section>
    <section class="glass card" id="histCard" hidden>
      <h2>History</h2>
      <div id="history"></div>
    </section>
  </main>
<script src="popup.js"></script>
</body>
</html>
