<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <!-- Lucide-style picture-in-picture-2 stroke icon -->
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 11.5a3 3 0 0 1 3 3H21a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2Z"/>
      <path d="M13 11.5V14a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-1.5a1 1 0 0 0-1-1H13Z"/>
    </svg>
    <div>
      <h1>PiP Canvas</h1>
      <p class="subtitle">Pop any video out of the page</p>
    </div>
  </header>

  <section class="panel" id="scan-panel">
    <button class="btn primary" id="scan-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
      </svg>
      Scan this tab for videos
    </button>
    <div id="video-list" class="video-list hidden"></div>
    <p id="scan-hint" class="hint">Videos appear here — pick one to pop out.</p>
  </section>

  <section class="panel">
    <div class="row">
      <div class="row-text">
        <span class="row-title">Floating PiP button</span>
        <span class="row-desc">Show a small PiP button on every video</span>
      </div>
      <button class="switch" id="float-toggle" role="switch" aria-checked="false"
              aria-label="Toggle floating PiP button">
        <span class="knob"></span>
      </button>
    </div>
  </section>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="popup.js"></script>
</body>
</html>
