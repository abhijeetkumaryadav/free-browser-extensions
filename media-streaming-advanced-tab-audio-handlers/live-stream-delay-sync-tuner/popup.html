<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12h2"></path><path d="M6 8v8"></path><path d="M10 5v14"></path>
          <path d="M14 8v8"></path><path d="M18 10v4"></path><path d="M22 12h-2"></path>
        </svg>
      </div>
      <div class="title">
        <h1>Stream Delay Sync Tuner</h1>
        <p id="status-line">Lip-sync fixer for tab audio</p>
      </div>
      <div class="state-dot" id="state-dot" title="Engine status"></div>
    </header>

    <div class="panel">
      <div class="readout">
        <span class="ms" id="ms">120</span>
        <span class="unit">ms delay</span>
      </div>
      <input type="range" id="delay" min="0" max="500" step="5" value="120" aria-label="Audio delay in milliseconds">
      <div class="scale"><span>0</span><span>250</span><span>500</span></div>
      <button id="toggle" class="primary">Enable sync on this tab</button>
    </div>

    <div class="panel presets">
      <span class="field-label">Presets</span>
      <div class="preset-row">
        <button class="chip-btn" data-ms="0">0</button>
        <button class="chip-btn" data-ms="80">80</button>
        <button class="chip-btn" data-ms="150">150</button>
        <button class="chip-btn" data-ms="250">250</button>
        <button class="chip-btn" data-ms="400">400</button>
      </div>
    </div>

    <p class="note">Adds delay to this tab's audio only — it cannot change a stream's broadcast delay. While active the tab shows a muted icon; the delayed audio plays through the extension.</p>
    <p class="error" id="error" hidden></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
