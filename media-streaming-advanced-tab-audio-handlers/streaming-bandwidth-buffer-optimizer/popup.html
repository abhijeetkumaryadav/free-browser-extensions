<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <!-- Lucide-style activity stroke icon -->
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
    </svg>
    <div>
      <h1>Stream Health</h1>
      <p class="subtitle">Why is this video choppy?</p>
    </div>
  </header>

  <section class="panel">
    <button class="btn primary" id="analyze-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
      </svg>
      Analyze videos on this tab
    </button>
    <div id="results" class="results hidden"></div>
    <p id="hint" class="hint">Reads frame stats from each video — nothing is changed.</p>
  </section>

  <section class="panel hidden" id="tips-panel">
    <h2 class="panel-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
      </svg>
      What to try
    </h2>
    <ul id="tips-list" class="tips"></ul>
  </section>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="popup.js"></script>
</body>
</html>
