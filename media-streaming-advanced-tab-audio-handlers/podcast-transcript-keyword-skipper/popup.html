<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </div>
      <div class="title">
        <h1>Transcript Keyword Skipper</h1>
        <p>Find words in on-page transcripts</p>
      </div>
    </header>

    <div class="panel">
      <label class="field-label" for="keywords">Keywords (comma separated)</label>
      <div class="search-row">
        <input id="keywords" type="text" placeholder="e.g. revenue, churn, roadmap" autocomplete="off" spellcheck="false">
        <button id="find" class="primary">Find</button>
      </div>
      <div class="opts-row">
        <label class="check"><input type="checkbox" id="case"> <span>Match case</span></label>
        <label class="check"><input type="checkbox" id="whole"> <span>Whole words</span></label>
      </div>
    </div>

    <div class="panel results-panel" id="results" hidden>
      <div class="results-head">
        <span class="count" id="count">0 matches</span>
        <div class="nav">
          <button id="prev" class="icon-btn" title="Previous match" aria-label="Previous match">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <span class="pos" id="pos">–</span>
          <button id="next" class="icon-btn" title="Next match" aria-label="Next match">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <button id="clear" class="ghost" hidden>Clear highlights</button>
    <p class="note">Read-only highlighting — the page is never modified or saved.</p>
    <p class="error" id="error" hidden></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
