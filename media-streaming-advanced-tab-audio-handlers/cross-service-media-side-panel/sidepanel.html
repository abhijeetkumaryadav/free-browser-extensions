<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stagehand</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<div class="app">
  <header class="header">
    <span class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 4 13 8-13 8V4z"/></svg>
    </span>
    <div class="head-text">
      <h1>Stagehand</h1>
      <p class="subtitle">Media playing in your tabs</p>
    </div>
    <button id="refreshBtn" class="icon-btn" title="Refresh list">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
    </button>
  </header>
  <div id="mediaList" class="cards"></div>
  <footer class="footer">Controls act only on tabs you tap. Auto-refreshes every few seconds.</footer>
</div>
<script src="media.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
