<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stagehand</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <span class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 4 13 8-13 8V4z"/></svg>
    </span>
    <div>
      <h1>Stagehand</h1>
      <p class="subtitle">Cross-service media control</p>
    </div>
  </header>
  <p class="hint">Stagehand lives in the side panel — one place to play, pause,
  mute, seek and jump to any tab that's playing media.</p>
  <button id="openPanel" class="btn primary full">Open side panel</button>
  <p class="hint small">Tip: you can also pin the side panel from the toolbar.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
