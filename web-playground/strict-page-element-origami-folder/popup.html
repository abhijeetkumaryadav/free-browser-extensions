<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="panel header">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3 20 19H4Z"/><path d="M12 3v16M12 3 8 19"/>
    </svg>
    <div>
      <h1>OrigamiFold</h1>
      <p class="sub">Harmless page prank · fully reversible</p>
    </div>
  </header>

  <section class="panel">
    <button id="fold" class="cta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 20 19H4Z"/><path d="M12 3v16"/>
      </svg>
      Fold the page
    </button>
    <button id="unfold" class="ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
      </svg>
      Unfold everything
    </button>
    <p id="status" class="hint">Click “Fold the page” on any normal web page.</p>
  </section>

  <footer class="note">Just a joke — every fold is 100% reversible.<br>Nothing is modified, deleted, or sent anywhere.</footer>
  <script src="popup.js"></script>
</body>
</html>
