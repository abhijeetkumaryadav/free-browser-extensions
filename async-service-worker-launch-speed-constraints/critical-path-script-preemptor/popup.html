<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RenderLens</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      </div>
      <div>
        <h1>RenderLens</h1>
        <p class="subtitle">Render-blocking audit</p>
      </div>
      <span id="gradeBadge" class="grade-badge hidden">—</span>
    </header>

    <div id="emptyState" class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <p>Scan the current tab to find scripts and stylesheets that block first paint.</p>
      <button id="scanBtn" class="primary-btn">Scan this page</button>
    </div>

    <div id="results" class="hidden">
      <div class="summary-row">
        <div class="summary-stat"><span id="statBlocking" class="stat-num">0</span><span class="stat-label">blocking</span></div>
        <div class="summary-stat"><span id="statTotal" class="stat-num">0</span><span class="stat-label">resources</span></div>
        <div class="summary-stat"><span id="statHost" class="stat-host">—</span><span class="stat-label">page</span></div>
      </div>
      <div id="timingRow" class="timing-row hidden"></div>
      <div class="filter-row">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="blocking">Blocking</button>
        <button class="chip" data-filter="script">Scripts</button>
        <button class="chip" data-filter="stylesheet">Styles</button>
      </div>
      <div id="itemList" class="item-list"></div>
      <button id="rescanBtn" class="ghost-btn">Re-scan page</button>
    </div>

    <footer class="footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Read-only audit · nothing leaves your device</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
