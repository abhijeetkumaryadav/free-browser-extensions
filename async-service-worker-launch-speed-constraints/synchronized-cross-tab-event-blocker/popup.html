<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>
      </span>
      <div>
        <h1>FocusSync</h1>
        <p class="subtitle">Cross-tab focus mode</p>
      </div>
    </div>
    <label class="switch" title="Toggle focus mode">
      <input type="checkbox" id="focusToggle">
      <span class="slider"></span>
    </label>
  </header>

  <section class="panel status-panel">
    <div class="status-row">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Focus mode off</span>
    </div>
    <p class="hint" id="statusHint">Turn focus on to pause playing media in every tab.</p>
  </section>

  <section class="panel stats-panel">
    <div class="stat">
      <span class="stat-value" id="tabsAffected">0</span>
      <span class="stat-label">tabs affected</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-value" id="mediaPaused">0</span>
      <span class="stat-label">media paused</span>
    </div>
  </section>

  <section class="panel note-panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <p>Cooperative pausing only. Turning focus off resumes the media FocusSync paused — anything you paused yourself stays paused.</p>
  </section>

  <footer>
    <button id="clearBtn" class="ghost-btn">Reset session data</button>
  </footer>

<script src="popup.js"></script>
</body>
</html>
