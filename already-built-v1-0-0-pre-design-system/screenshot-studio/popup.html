<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenshot Studio</title>
<style>
  body { width: 260px; margin: 0; padding: 14px; background: #14101a; color: #f3ecf7;
         font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  h1 span { color: #6fc3e8; }
  button { width: 100%; padding: 11px; margin-bottom: 8px; border: 0; border-radius: 10px;
           cursor: pointer; font-size: 14px; font-weight: 600; background: #2c4a5e; color: #fff; }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .5; cursor: wait; }
  #status { font-size: 12px; color: #a89bb5; min-height: 18px; }
  p { font-size: 12px; color: #a89bb5; margin: 4px 0 0; }
</style>
</head>
<body>
  <h1><span>◈</span> Screenshot Studio</h1>
  <button id="capture">Capture visible area</button>
  <div id="status"></div>
  <p>Captures the current tab, then opens the editor: crop, blur, text, and export sized for Instagram.</p>
<script src="popup.js"></script>
</body>
</html>
