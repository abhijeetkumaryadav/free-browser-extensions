<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MnemoCheck — BIP39 Mnemonic Validator</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="head">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div class="titles">
      <h1>MnemoCheck</h1>
      <p>BIP39 mnemonic validator</p>
    </div>
  </header>

  <div class="danger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <span><strong>Never enter a real seed phrase that controls funds.</strong> For testing &amp; learning only.</span>
  </div>

  <label class="field-label" for="phrase">Mnemonic phrase</label>
  <textarea id="phrase" rows="3" spellcheck="false" autocomplete="off" placeholder="abandon abandon abandon … (12–24 words)"></textarea>

  <div class="btn-row">
    <button id="validate" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Validate
    </button>
    <button id="copy-report" class="btn ghost">Copy report</button>
    <button id="clear" class="btn ghost">Clear</button>
  </div>

  <section id="results" class="results" hidden></section>

  <p id="entropy-note" class="note" hidden>
    Checked locally against the BIP39 English wordlist (2048 words). Nothing is sent anywhere — this device only.
  </p>

  <footer class="foot">Offline · zero network · validation only</footer>
</div>
<script src="wordlist.js"></script>
<script src="popup.js"></script>
</body>
</html>
