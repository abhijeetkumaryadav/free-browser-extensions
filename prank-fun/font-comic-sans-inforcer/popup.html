<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComicSansify</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="popup">
  <header class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 20h16"/>
      <path d="M6 16v-4a4 4 0 0 1 8 0v1"/>
      <circle cx="15" cy="8" r="4"/>
      <path d="M15 4h.01"/>
    </svg>
    <div>
      <h1>ComicSansify</h1>
      <p class="tagline">A harmless font prank (joke)</p>
    </div>
  </header>

  <div class="page-card">
    <p class="page-label">Current page</p>
    <p class="page-url" id="pageUrl">…</p>
    <p class="page-state" id="pageState">Checking…</p>
  </div>

  <button class="primary" id="prankBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="13.5" cy="6.5" r="0.5" fill="currentColor"/>
      <circle cx="17.5" cy="10.5" r="0.5" fill="currentColor"/>
      <circle cx="8.5" cy="7.5" r="0.5" fill="currentColor"/>
      <circle cx="6.5" cy="12.5" r="0.5" fill="currentColor"/>
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10a2.5 2.5 0 0 0 2.5-2.5c0-.6-.24-1.2-.65-1.65a2.5 2.5 0 0 1-.1-3.54 2.5 2.5 0 0 1 3.54-.1c.45.41 1.05.65 1.71.65A2.5 2.5 0 0 0 21.5 12C21.5 6.5 17.5 2 12 2z"/>
    </svg>
    <span id="prankBtnText">Comic Sans-ify this page</span>
  </button>

  <button class="ghost" id="restoreBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="1 4 1 10 7 10"/>
      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
    </svg>
    Restore original fonts
  </button>

  <p class="hint">Runs only on the active tab when you click. Refreshing the page also restores everything.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
