<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="panel">
    <header>
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <div>
        <h1>Geocities Rewind</h1>
        <p class="tag">Harmless 1999 time-travel prank</p>
      </div>
    </header>

    <p class="desc">
      One click restyles the current page like a 1999 Geocities site —
      starry tiles, Times New Roman, rainbow dividers, blinking text and a
      visitor counter. Nothing is modified permanently.
    </p>

    <div class="actions">
      <button id="applyBtn" class="primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4L12 3z"/>
        </svg>
        Geo-fy this page
      </button>
      <button id="restoreBtn" class="ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
        </svg>
        Restore page
      </button>
    </div>

    <p id="status" class="status" role="status"></p>

    <footer>
      <span class="joke-badge">Joke extension — reversible, runs only when you click</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
