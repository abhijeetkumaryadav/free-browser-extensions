<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webflow Custom Code Formatter</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header glass">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
    </div>
    <div class="title-block">
      <h1>Code Formatter</h1>
      <p class="subtitle">Webflow custom code studio</p>
    </div>
    <span class="badge">local</span>
  </header>

  <!-- Mode tabs -->
  <div class="tabs glass" role="tablist" aria-label="Language">
    <button class="tab active" data-mode="html" role="tab" aria-selected="true">HTML</button>
    <button class="tab" data-mode="css" role="tab" aria-selected="false">CSS</button>
    <button class="tab" data-mode="js" role="tab" aria-selected="false">JS</button>
    <button class="tab auto" data-mode="auto" role="tab" aria-selected="false" title="Guess the language from the input">Auto</button>
  </div>

  <!-- Input -->
  <section class="panel glass">
    <div class="panel-head">
      <label for="input">Input</label>
      <button id="pasteBtn" class="ghost-btn" title="Paste from clipboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        Paste
      </button>
    </div>
    <textarea id="input" spellcheck="false" placeholder="Paste your HTML, CSS or JavaScript here…"></textarea>
  </section>

  <!-- Actions -->
  <div class="actions">
    <button id="formatBtn" class="primary-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Format
    </button>
    <button id="minifyBtn" class="secondary-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></svg>
      Minify
    </button>
    <button id="clearBtn" class="secondary-btn" title="Clear input and output">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Clear
    </button>
  </div>

  <!-- Validation -->
  <section class="panel glass" id="issuesPanel" hidden>
    <div class="panel-head">
      <label>Validation</label>
      <span id="issueCount" class="count-badge">0</span>
    </div>
    <ul id="issues" class="issues"></ul>
  </section>

  <!-- Output -->
  <section class="panel glass">
    <div class="panel-head">
      <label for="output">Output</label>
      <button id="copyBtn" class="ghost-btn" title="Copy output to clipboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
    </div>
    <textarea id="output" spellcheck="false" readonly placeholder="Formatted code appears here…"></textarea>
    <div class="stats"><span id="statChars">0 chars</span><span id="statLines">0 lines</span></div>
  </section>

  <footer class="footer">Never executes your code · 100% on-device</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
