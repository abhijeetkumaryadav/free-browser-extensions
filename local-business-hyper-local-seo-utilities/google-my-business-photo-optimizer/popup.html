<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      </span>
      <div>
        <h1>GBP Photo Optimizer</h1>
        <p class="subtitle">Business Profile photo prep · 100% on-device</p>
      </div>
    </div>
  </header>

  <main>
    <!-- Dropzone -->
    <section class="panel" id="dropPanel">
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Choose a photo to optimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
        <p><strong>Drop a photo here</strong> or click to browse</p>
        <p class="hint">JPG or PNG · processed locally, never uploaded</p>
        <input type="file" id="fileInput" accept="image/jpeg,image/png" hidden>
      </div>
    </section>

    <!-- Report -->
    <section class="panel hidden" id="reportPanel">
      <div class="report-head">
        <h2>Guideline check</h2>
        <button class="ghost-btn" id="newPhotoBtn">New photo</button>
      </div>
      <ul class="checks" id="checks"></ul>

      <div class="compare">
        <div class="compare-col">
          <p class="compare-label">Original</p>
          <div class="thumb"><img id="origImg" alt="Original photo"></div>
          <p class="meta" id="origMeta"></p>
        </div>
        <div class="compare-col">
          <p class="compare-label">Optimized</p>
          <div class="thumb"><img id="optImg" alt="Optimized photo"></div>
          <p class="meta" id="optMeta"></p>
        </div>
      </div>

      <div class="controls">
        <div class="field">
          <label for="profileSelect">Photo type</label>
          <select id="profileSelect">
            <option value="general">General photo (720×720+)</option>
            <option value="cover">Cover photo (1024×576, 16:9)</option>
            <option value="logo">Logo (720×720, 1:1)</option>
          </select>
        </div>
        <div class="field">
          <label for="qualityRange">JPEG quality · <span id="qualityVal">85</span>%</label>
          <input type="range" id="qualityRange" min="60" max="95" value="85">
        </div>
      </div>

      <button class="primary-btn" id="downloadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
        Download optimized photo
      </button>
      <p class="fine">File name: <span id="fileName">photo-optimized.jpg</span></p>
    </section>
  </main>

  <footer>
    <p>GBP guidelines: JPG/PNG, ≥720px on each side, 10 KB – 5 MB.</p>
  </footer>

<script src="popup.js"></script>
</body>
</html>
