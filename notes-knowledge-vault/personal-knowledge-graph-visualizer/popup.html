<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraphMind</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><path d="M8.5 7.5l3 8M15.5 7.5l-3 8M8.8 6h6.4"/></svg>
      <span>GraphMind</span>
    </div>
    <select id="graphSelect" title="Active graph"></select>
    <button id="newGraphBtn" class="icon-btn" title="New graph" aria-label="New graph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="canvas">Graph</button>
    <button class="tab" data-tab="nodes">Nodes</button>
    <button class="tab" data-tab="edges">Edges</button>
  </nav>

  <!-- Canvas view -->
  <section class="pane active" id="pane-canvas">
    <div class="canvas-wrap">
      <canvas id="graphCanvas" width="700" height="380"></canvas>
      <div class="canvas-hint">drag nodes · drag background to pan · wheel to zoom · click node for details</div>
      <div class="zoom-bar">
        <button id="zoomOut" class="icon-btn" title="Zoom out">−</button>
        <button id="zoomReset" class="icon-btn" title="Reset view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
        <button id="zoomIn" class="icon-btn" title="Zoom in">+</button>
      </div>
    </div>
    <div id="nodeCard" class="node-card hidden">
      <div class="node-card-head">
        <span class="dot" id="ncDot"></span>
        <strong id="ncTitle"></strong>
        <button id="ncClose" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <p id="ncNotes" class="node-card-notes"></p>
      <div class="node-card-sub">Connections</div>
      <ul id="ncNeighbors"></ul>
    </div>
  </section>

  <!-- Nodes view -->
  <section class="pane" id="pane-nodes">
    <form id="nodeForm" class="form">
      <input id="nodeLabel" type="text" placeholder="Node label (e.g. Photosynthesis)" maxlength="60" required>
      <div class="row">
        <input id="nodeColor" type="color" value="#10b981" title="Node color">
        <input id="nodeNotes" type="text" placeholder="Notes (optional)" maxlength="200">
      </div>
      <button type="submit" class="btn">Add node</button>
    </form>
    <ul id="nodeList" class="list"></ul>
  </section>

  <!-- Edges view -->
  <section class="pane" id="pane-edges">
    <form id="edgeForm" class="form">
      <div class="row">
        <select id="edgeFrom" required></select>
        <select id="edgeTo" required></select>
      </div>
      <div class="row">
        <select id="edgeType">
          <option value="relates to">relates to</option>
          <option value="is a">is a</option>
          <option value="part of">part of</option>
          <option value="depends on">depends on</option>
          <option value="causes">causes</option>
          <option value="opposite of">opposite of</option>
          <option value="example of">example of</option>
        </select>
        <button type="submit" class="btn">Add edge</button>
      </div>
    </form>
    <ul id="edgeList" class="list"></ul>
    <div class="io-bar">
      <button id="exportBtn" class="btn ghost">Export JSON</button>
      <button id="importBtn" class="btn ghost">Import JSON</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
  </section>

  <footer class="foot"><span id="stats"></span></footer>
</div>
<script src="popup.js"></script>
</body>
</html>
