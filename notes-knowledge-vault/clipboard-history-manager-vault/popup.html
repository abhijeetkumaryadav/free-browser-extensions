<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipVault</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
      </svg>
      <div>
        <h1>ClipVault</h1>
        <p class="sub">Clipboard history, on demand</p>
      </div>
    </div>
    <span class="count-badge" id="countBadge">0</span>
  </header>

  <div class="capture-row">
    <button id="captureBtn" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
      </svg>
      Capture clipboard
    </button>
    <button id="clearBtn" class="btn-ghost" title="Delete all entries">Clear</button>
  </div>
  <p class="privacy-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Only captured when you click. Stored in local browser storage — nothing leaves your device.
  </p>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="search" placeholder="Search entries…" autocomplete="off">
    </div>
    <label class="expire-wrap" title="Auto-delete entries older than this">
      <span>Expire</span>
      <select id="expireSelect">
        <option value="0">Never</option>
        <option value="1">1 day</option>
        <option value="7" selected>7 days</option>
        <option value="30">30 days</option>
      </select>
    </label>
  </div>

  <div id="list" class="list" role="list"></div>

  <div id="emptyState" class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
    </svg>
    <p>No entries yet.<br>Copy something, then hit <strong>Capture clipboard</strong>.</p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
