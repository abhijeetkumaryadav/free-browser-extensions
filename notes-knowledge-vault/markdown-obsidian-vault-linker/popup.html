<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaultLink</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <div>
        <h1>VaultLink</h1>
        <p class="subtitle">Obsidian-style notes vault</p>
      </div>
    </div>
    <button id="exportBtn" class="btn ghost small" title="Export all notes as Markdown files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
      Export
    </button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v6h6"/></svg>
      Notes
    </button>
    <button class="tab" data-tab="graph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7.5l3 8M16 7.5l-3 8M8.5 6h7"/></svg>
      Graph
    </button>
  </nav>

  <!-- NOTES TAB -->
  <section id="tab-notes" class="tab-page active">
    <div class="search-row">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search notes…" autocomplete="off">
      <button id="newBtn" class="btn primary small">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New
      </button>
    </div>
    <div id="notesList" class="notes-list"></div>
  </section>

  <!-- GRAPH TAB (lite list view of the link graph) -->
  <section id="tab-graph" class="tab-page">
    <div class="stats" id="graphStats"></div>
    <div id="graphList" class="notes-list"></div>
  </section>

  <!-- EDITOR VIEW -->
  <section id="editor" class="editor hidden">
    <div class="editor-bar">
      <button id="backBtn" class="icon-btn" title="Back to notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <input id="titleInput" type="text" placeholder="Note title" autocomplete="off">
      <button id="deleteBtn" class="icon-btn danger" title="Delete note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </button>
    </div>
    <div class="mode-toggle">
      <button id="editModeBtn" class="seg active">Edit</button>
      <button id="previewModeBtn" class="seg">Preview</button>
      <span class="save-state" id="saveState">Saved</span>
    </div>
    <textarea id="bodyInput" placeholder="Write markdown… Use [[Note title]] to link notes."></textarea>
    <div id="preview" class="preview hidden"></div>
    <div class="backlinks panel-lite">
      <h3>Backlinks <span id="backlinkCount" class="badge">0</span></h3>
      <div id="backlinksList" class="backlinks-list"><p class="empty">No notes link here yet.</p></div>
    </div>
  </section>

  <footer class="foot"><span>Everything stays in this browser — no accounts, no sync.</span></footer>

<script src="popup.js"></script>
</body>
</html>
