<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexiMatch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8.5" y1="11" x2="13.5" y2="11"></line>
        </svg>
        <div>
          <h1>LexiMatch</h1>
          <p class="subtitle">Keyword similarity search</p>
        </div>
      </div>
      <span class="honest-badge" title="Ranks by keyword overlap (TF-IDF). No embeddings model, no AI, nothing leaves your device.">keyword-based · no AI</span>
    </header>

    <!-- Search -->
    <section class="panel">
      <div class="search-row">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="searchInput" type="text" placeholder="Search your saved pages &amp; notes…" autocomplete="off">
        <button id="clearSearch" class="icon-btn hidden" title="Clear search" aria-label="Clear search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </section>

    <!-- Actions -->
    <section class="actions">
      <button id="savePageBtn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Save this page
      </button>
      <button id="addNoteBtn" class="btn btn-ghost">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add note
      </button>
    </section>

    <!-- Note form (hidden) -->
    <section id="noteForm" class="panel hidden">
      <input id="noteTitle" type="text" placeholder="Note title">
      <textarea id="noteText" rows="4" placeholder="Write or paste text to make it searchable…"></textarea>
      <div class="form-row">
        <button id="noteSave" class="btn btn-primary btn-sm">Save note</button>
        <button id="noteCancel" class="btn btn-ghost btn-sm">Cancel</button>
      </div>
    </section>

    <!-- Status line -->
    <p id="statusLine" class="status-line"></p>

    <!-- Results -->
    <section id="results" class="results"></section>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3a3a46" stroke-width="1.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <p>Nothing saved yet.<br>Save a page or add a note to start searching.</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
