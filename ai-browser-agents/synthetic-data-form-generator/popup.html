<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
    </div>
    <div>
      <h1>FakeForge</h1>
      <p class="tagline">Synthetic data for testing</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    <span>All data is <b>fake</b> — generated for testing forms and UIs. Never real people.</span>
  </div>

  <section class="card">
    <div class="section-head">
      <span class="field-label">Full profile</span>
      <button id="genProfile" class="btn btn-ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        New profile
      </button>
    </div>
    <div id="profileGrid" class="profile-grid"></div>
    <button id="copyJson" class="btn btn-ghost btn-block">Copy profile as JSON</button>
  </section>

  <section class="card">
    <div class="section-head">
      <span class="field-label">Individual fields</span>
    </div>
    <div id="fieldList"></div>
  </section>

  <button id="fillForm" class="btn btn-primary btn-block">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    Fill current page form
  </button>
  <p id="fillStatus" class="status hidden"></p>

  <section class="card">
    <div class="section-head">
      <span class="field-label">Recent</span>
      <button id="clearHistory" class="btn btn-ghost btn-sm">Clear</button>
    </div>
    <div id="historyList" class="history-list"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
