<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
<title>ToneShift</title>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        <path d="M8 9h8"/><path d="M8 12.5h5"/>
      </svg>
    </div>
    <div class="title-block">
      <h1>ToneShift</h1>
      <p class="subtitle">Sentiment read + tone rewrites</p>
    </div>
  </header>

  <!-- Honest-scope notice -->
  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
    </svg>
    <span>Rule-based word lists only — a rough heuristic, not AI. Nuance, sarcasm and context can fool it.</span>
  </div>

  <!-- Input -->
  <section class="panel">
    <label class="label" for="input">Your text</label>
    <textarea id="input" rows="5" placeholder="Paste or type text here…"></textarea>
    <div class="row">
      <button id="analyze" class="btn primary">Analyze sentiment</button>
      <button id="clear" class="btn ghost">Clear</button>
    </div>
  </section>

  <!-- Sentiment result -->
  <section class="panel hidden" id="sentimentPanel">
    <div class="label">Sentiment</div>
    <div class="verdict-row">
      <span id="verdict" class="verdict">—</span>
      <span id="score" class="score">0</span>
    </div>
    <div class="meter"><div id="meterFill" class="meter-fill"></div></div>
    <div class="counts">
      <span class="chip pos"><span class="dot pos"></span><b id="posCount">0</b> positive</span>
      <span class="chip neg"><span class="dot neg"></span><b id="negCount">0</b> negative</span>
      <span class="chip neu"><span class="dot neu"></span><b id="neuCount">0</b> neutral</span>
    </div>
    <div class="label" style="margin-top:10px">Highlighted words</div>
    <div id="highlighted" class="highlighted"></div>
  </section>

  <!-- Tone rewrites -->
  <section class="panel">
    <div class="label">Rewrite tone <span class="hint">(template swaps, editable)</span></div>
    <div class="tone-row">
      <button class="btn tone" data-tone="formal">Formal</button>
      <button class="btn tone" data-tone="casual">Casual</button>
      <button class="btn tone" data-tone="concise">Concise</button>
      <button class="btn tone" data-tone="warm">Warm</button>
    </div>
    <div class="label" style="margin-top:10px">Result <span class="hint">(edit freely)</span></div>
    <textarea id="output" rows="5" placeholder="Pick a tone above…"></textarea>
    <div class="row">
      <button id="copy" class="btn primary">Copy result</button>
      <button id="useAsInput" class="btn ghost">Use as input</button>
    </div>
    <div id="toast" class="toast hidden">Copied!</div>
  </section>

</div>
<script src="popup.js"></script>
</body>
</html>
