<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StormWatch</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-11.6-1.6A4.5 4.5 0 0 0 7.5 15H18a3.5 3.5 0 0 0 .5-6.97V8z"/>
        <path d="M12 12v4"/><path d="M12 19.5v.01"/>
      </svg>
    </div>
    <div class="title-block">
      <h1>StormWatch</h1>
      <p class="subtitle">Custom weather alert notifier</p>
    </div>
    <label class="switch" title="Enable alert checks">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <!-- Scope banner -->
  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
    </svg>
    <span><strong>Your thresholds only.</strong> Not official weather warnings.</span>
  </div>

  <!-- City search -->
  <section class="panel">
    <h2>City</h2>
    <div class="city-row">
      <input type="text" id="cityInput" placeholder="Type a city, e.g. Mumbai" autocomplete="off">
      <button id="searchBtn" class="btn primary">Search</button>
    </div>
    <div id="cityResults" class="city-results"></div>
    <p class="current-city" id="currentCity">No city selected</p>
  </section>

  <!-- Thresholds -->
  <section class="panel">
    <h2>Alert thresholds</h2>
    <p class="hint">Alert fires when the <em>current</em> reading crosses your value.</p>

    <div class="threshold-row">
      <label class="check"><input type="checkbox" id="tTempLow"><span>Temp below</span></label>
      <div class="input-unit"><input type="number" id="vTempLow" value="5" step="1"><span>°C</span></div>
    </div>
    <div class="threshold-row">
      <label class="check"><input type="checkbox" id="tTempHigh"><span>Temp above</span></label>
      <div class="input-unit"><input type="number" id="vTempHigh" value="38" step="1"><span>°C</span></div>
    </div>
    <div class="threshold-row">
      <label class="check"><input type="checkbox" id="tWind"><span>Wind above</span></label>
      <div class="input-unit"><input type="number" id="vWind" value="60" step="1"><span>km/h</span></div>
    </div>
    <div class="threshold-row">
      <label class="check"><input type="checkbox" id="tPrecip"><span>Rain chance above</span></label>
      <div class="input-unit"><input type="number" id="vPrecip" value="70" min="0" max="100" step="1"><span>%</span></div>
    </div>

    <button id="saveBtn" class="btn primary full">Save settings</button>
    <button id="checkNowBtn" class="btn ghost full">Check now</button>
    <p class="status" id="status"></p>
  </section>

  <!-- Last check -->
  <section class="panel">
    <h2>Last check</h2>
    <div class="readings">
      <div class="reading"><span class="r-label">Temp</span><span class="r-value" id="lastTemp">—</span></div>
      <div class="reading"><span class="r-label">Wind</span><span class="r-value" id="lastWind">—</span></div>
      <div class="reading"><span class="r-label">Rain %</span><span class="r-value" id="lastPrecip">—</span></div>
    </div>
    <p class="timestamp" id="lastTime">Never checked</p>
  </section>

  <footer class="footer">Data: Open-Meteo (free, no key)</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
