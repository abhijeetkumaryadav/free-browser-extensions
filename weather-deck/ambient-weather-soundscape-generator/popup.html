<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambience</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#14b8a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.6 5.4a9 9 0 0 1 0 13.2"/></svg>
    <div class="header-text">
      <h1>Ambience</h1>
      <p>Synthesized weather soundscapes</p>
    </div>
    <button id="stop-all" class="icon-btn" title="Stop all sounds" aria-label="Stop all">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
  </header>

  <main class="sounds">
    <!-- Rain -->
    <section class="sound-card" data-sound="rain">
      <div class="sound-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 15a4.5 4.5 0 0 0 .4-8.98A6 6 0 0 0 6.2 4.6 4.8 4.8 0 0 0 6.5 15h11z"/><path d="M8 18v2M12 17v3M16 18v2"/></svg>
        <div class="sound-info"><h2>Rain</h2><p>Filtered white noise</p></div>
        <button class="toggle" data-toggle="rain" aria-label="Toggle rain"><span class="knob"></span></button>
      </div>
      <input type="range" min="0" max="100" value="60" data-vol="rain" aria-label="Rain volume">
    </section>

    <!-- Thunder -->
    <section class="sound-card" data-sound="thunder">
      <div class="sound-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5L13 2z"/></svg>
        <div class="sound-info"><h2>Thunder</h2><p>Distant low rumble</p></div>
        <button class="toggle" data-toggle="thunder" aria-label="Toggle thunder"><span class="knob"></span></button>
      </div>
      <input type="range" min="0" max="100" value="60" data-vol="thunder" aria-label="Thunder volume">
    </section>

    <!-- Wind -->
    <section class="sound-card" data-sound="wind">
      <div class="sound-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2M17.7 7.7A2.5 2.5 0 1 1 19.5 12H2"/></svg>
        <div class="sound-info"><h2>Wind</h2><p>Modulated air flow</p></div>
        <button class="toggle" data-toggle="wind" aria-label="Toggle wind"><span class="knob"></span></button>
      </div>
      <input type="range" min="0" max="100" value="60" data-vol="wind" aria-label="Wind volume">
    </section>

    <!-- Fireplace -->
    <section class="sound-card" data-sound="fire">
      <div class="sound-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4.4 0 7.5-3 7.5-7 0-3-2-5.5-3.5-7C14.5 6.5 13 5 13 2c-3 2-5 4.5-5.5 7-2-.5-3-1.5-3.5-3C2.7 7.5 4.5 15 12 22z" transform="translate(0 -1) scale(0.92) translate(1 1)"/><path d="M12 22c-2.2 0-4-1.8-4-4 0-1.6 1-3 2-4 1.5 1 4 2.5 4 4 0 2.2-1.8 4-4 4z" transform="translate(1 0)"/></svg>
        <div class="sound-info"><h2>Fireplace</h2><p>Random crackle pops</p></div>
        <button class="toggle" data-toggle="fire" aria-label="Toggle fireplace"><span class="knob"></span></button>
      </div>
      <input type="range" min="0" max="100" value="60" data-vol="fire" aria-label="Fireplace volume">
    </section>
  </main>

  <div id="hint" class="hint">Mix sounds together — each plays its own layer.</div>

  <footer class="footer">
    <span>100% WebAudio-synthesized · no audio files · no network</span>
  </footer>
</div>
<script src="engine.js"></script>
<script src="popup.js"></script>
</body>
</html>
