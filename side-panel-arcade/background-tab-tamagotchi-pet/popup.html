<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PixelPal — Virtual Pet</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="glass header">
    <div class="title-row">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-4.7-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2.5 4.3-9 9-9 9z"/></svg>
      <div>
        <h1 id="pet-name">PixelPal</h1>
        <p class="subtitle" id="pet-age">Age 0 days</p>
      </div>
      <button id="rename-btn" class="icon-btn" title="Rename pet" aria-label="Rename pet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
      </button>
    </div>
  </header>

  <section class="glass stage">
    <canvas id="pet-canvas" width="280" height="180" aria-label="Your virtual pet"></canvas>
    <div id="mood-pill" class="mood-pill">Happy</div>
  </section>

  <section class="glass stats">
    <div class="stat"><span class="stat-label">Hunger</span><div class="bar"><div id="bar-hunger" class="bar-fill"></div></div></div>
    <div class="stat"><span class="stat-label">Happiness</span><div class="bar"><div id="bar-happiness" class="bar-fill"></div></div></div>
    <div class="stat"><span class="stat-label">Health</span><div class="bar"><div id="bar-health" class="bar-fill"></div></div></div>
    <div class="stat"><span class="stat-label">Energy</span><div class="bar"><div id="bar-energy" class="bar-fill"></div></div></div>
  </section>

  <section class="actions">
    <button id="btn-feed" class="act-btn glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V7a7 7 0 0 1 14 0v4"/><path d="M4 11l1.5 9h13L20 11"/></svg>
      Feed
    </button>
    <button id="btn-play" class="act-btn glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/></svg>
      Play
    </button>
    <button id="btn-clean" class="act-btn glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5V6a1.5 1.5 0 0 1 3 0v5.5l3.2 5.3a2 2 0 0 1-3.4 2L9 14.5"/><path d="M4 21c2 0 3-1 3-3"/></svg>
      Clean
    </button>
    <button id="btn-sleep" class="act-btn glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      Rest
    </button>
  </section>

  <footer class="footer">
    <p>Just a game — stats decay while your browser is open. No tracking.</p>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
