<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelRun</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="popup">
  <header>
    <div class="logo">▶</div>
    <div>
      <h1>PixelRun</h1>
      <p class="sub">micro platformer</p>
    </div>
  </header>

  <button id="playBtn" class="play">Play from Level 1</button>

  <h2>Level select</h2>
  <div id="levels" class="levels"></div>

  <div class="hint">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"/></svg>
    <span>← → move · Space / ↑ jump · P pause · R restart</span>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
