<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBoxGrab</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
    <div>
      <h1>BBoxGrab</h1>
      <p class="tagline">Bounding box → GeoJSON · manual input only</p>
    </div>
  </header>

  <!-- Mode tabs -->
  <div class="tabs" role="tablist">
    <button id="tabDraw" class="tab active" role="tab" aria-selected="true">Draw</button>
    <button id="tabType" class="tab" role="tab" aria-selected="false">Type coords</button>
  </div>

  <!-- Draw mode -->
  <div id="paneDraw">
    <canvas id="bboxCanvas" width="656" height="340"></canvas>
    <p class="hint">Drag on the grid to draw a box. Grid = equirectangular world map frame (−180…180, −90…90). Not a real map — manual input only.</p>
  </div>

  <!-- Type mode -->
  <div id="paneType" class="hidden">
    <div class="grid2">
      <label>West (min lon)<input id="inWest" type="number" step="any" placeholder="-180 … 180" value="-10"></label>
      <label>South (min lat)<input id="inSouth" type="number" step="any" placeholder="-90 … 90" value="35"></label>
      <label>East (max lon)<input id="inEast" type="number" step="any" placeholder="-180 … 180" value="30"></label>
      <label>North (max lat)<input id="inNorth" type="number" step="any" placeholder="-90 … 90" value="60"></label>
    </div>
    <button id="btnApply" class="btn primary full">Apply values</button>
  </div>

  <!-- Result -->
  <div id="result" class="result hidden">
    <div class="result-head">
      <span id="bboxLabel">—</span>
      <span id="areaLabel" class="area">—</span>
    </div>
    <pre id="geojsonOut"></pre>
    <div class="actions">
      <button id="btnCopy" class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy GeoJSON
      </button>
      <button id="btnDownload" class="btn ghost">Download .geojson</button>
    </div>
  </div>

  <p id="status" class="status" role="status"></p>
  <p class="footnote">Manual input only — no geocoding, no map tiles, no network.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
