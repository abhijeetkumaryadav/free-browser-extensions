<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoodBoard — Cosplay Reference Extractor</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.5-3.5a1.5 1.5 0 0 0-2 0L6 21"/></svg>
      <div>
        <h1>MoodBoard</h1>
        <p class="sub">Cosplay reference extractor</p>
      </div>
    </div>
    <button id="scan-btn" class="btn primary sm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      Scan tab
    </button>
  </header>

  <!-- Board picker + notes -->
  <section class="card">
    <div class="row">
      <select id="board-select" aria-label="Active board"></select>
      <button id="new-board-btn" class="btn icon" title="New board" aria-label="New board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="delete-board-btn" class="btn icon danger" title="Delete board" aria-label="Delete board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </button>
    </div>
    <div class="field">
      <label for="notes-input">Board notes</label>
      <textarea id="notes-input" rows="2" maxlength="2000" placeholder="Fabric ideas, wig color, armor notes…"></textarea>
    </div>
  </section>

  <!-- Scanned images -->
  <section class="card">
    <div class="section-title">
      <span>Scanned images</span>
      <span class="pill" id="scan-pill">not scanned</span>
    </div>
    <div id="scan-grid" class="grid"></div>
  </section>

  <!-- Board contents -->
  <section class="card">
    <div class="section-title">
      <span>Board references</span>
      <span class="pill" id="board-pill">0 pinned</span>
    </div>
    <div id="board-grid" class="grid"></div>
    <button id="download-btn" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      Download board images
    </button>
  </section>

  <footer class="footer">
    <p>Read-only listing of images the page already loads. Only images you explicitly download are saved — nothing is bypassed or fetched in the background.</p>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
