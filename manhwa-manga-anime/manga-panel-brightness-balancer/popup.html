<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PanelGlow</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </span>
    <div>
      <h1>PanelGlow</h1>
      <p class="site" id="siteLabel">this site</p>
    </div>
    <label class="switch" title="Enable tuning on this site">
      <input type="checkbox" id="enabledToggle" checked>
      <span class="track"><span class="thumb"></span></span>
    </label>
  </header>

  <section class="presets" aria-label="Presets">
    <button class="preset" data-preset="day">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Day</span>
    </button>
    <button class="preset" data-preset="night">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span>Night</span>
    </button>
    <button class="preset" data-preset="paper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6s1.5-2 5-2 5 2 8 2 5-2 5-2v14s-1.5 2-5 2-5-2-8-2-5 2-5 2z"/><path d="M2 6v14"/></svg>
      <span>Paper</span>
    </button>
  </section>

  <section class="sliders" aria-label="Display adjustments">
    <div class="slider-row">
      <label for="brightness">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Brightness <span class="val" id="brightnessVal">100%</span>
      </label>
      <input type="range" id="brightness" min="20" max="200" value="100">
    </div>
    <div class="slider-row">
      <label for="contrast">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" opacity="0.35"/></svg>
        Contrast <span class="val" id="contrastVal">100%</span>
      </label>
      <input type="range" id="contrast" min="20" max="200" value="100">
    </div>
    <div class="slider-row">
      <label for="grayscale">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>
        Grayscale <span class="val" id="grayscaleVal">0%</span>
      </label>
      <input type="range" id="grayscale" min="0" max="100" value="0">
    </div>
    <div class="slider-row">
      <label for="invert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><circle cx="12" cy="12" r="9"/></svg>
        Invert <span class="val" id="invertVal">0%</span>
      </label>
      <input type="range" id="invert" min="0" max="100" value="0">
    </div>
  </section>

  <footer class="actions">
    <button id="resetBtn" class="ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Reset
    </button>
    <p class="hint">Settings are remembered per site.</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
