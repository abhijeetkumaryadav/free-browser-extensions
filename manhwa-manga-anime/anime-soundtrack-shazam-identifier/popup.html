<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TrackTag</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </span>
    <div>
      <h1>TrackTag</h1>
      <p class="subtitle">Manual song log — not auto-identification</p>
    </div>
  </header>

  <section class="capture panel">
    <p class="now-playing" id="nowPlaying">Loading current tab…</p>
    <textarea id="noteInput" rows="2" maxlength="280" placeholder="Note (e.g. opening theme, 12:40 mark)…"></textarea>
    <button id="logBtn" class="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Log this track
    </button>
  </section>

  <section class="history panel">
    <div class="history-head">
      <h2>Logged tracks <span class="count" id="countBadge">0</span></h2>
      <button id="clearBtn" class="ghost" title="Delete all logged tracks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        Clear
      </button>
    </div>
    <ul id="trackList" class="track-list"></ul>
    <p class="empty" id="emptyMsg">No tracks logged yet.<br>Hear a song? Hit <strong>Log this track</strong>.</p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
