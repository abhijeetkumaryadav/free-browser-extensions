<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
<title>FlatSheet</title>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header glass">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="M9 9h1v1H9z"/><path d="M14 9h1v1h-1z"/><path d="M9 14h1v1H9z"/><path d="M14 14h1v1h-1z"/></svg>
    </div>
    <div>
      <h1>FlatSheet</h1>
      <p class="subtitle">JSON → flattened Excel sheet</p>
    </div>
  </header>

  <!-- Step 1: paste JSON -->
  <section class="panel glass">
    <div class="panel-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg>
      <h2>1 · Paste JSON</h2>
      <span class="meta" id="json-meta"></span>
    </div>
    <textarea id="json-input" placeholder='Paste JSON: an object, an array of objects, or nested data&#10;[{"name":"Ava","address":{"city":"Mumbai"}},{"name":"Raj","tags":["a","b"]}]'></textarea>
    <div class="row-actions">
      <button class="btn secondary" id="load-sample">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        Sample JSON
      </button>
      <button class="btn primary" id="flatten-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M2 12h20"/></svg>
        Flatten
      </button>
    </div>
    <div class="error hidden" id="json-error"></div>
  </section>

  <!-- Step 2: options + result -->
  <section class="panel glass hidden" id="result-panel">
    <div class="panel-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>
      <h2>2 · Flattened preview</h2>
      <span class="meta" id="table-meta"></span>
    </div>
    <div class="options">
      <label class="check">
        <input type="checkbox" id="opt-arrays" checked>
        <span>Expand arrays by index <code>tags.0</code></span>
      </label>
      <label class="check">
        <input type="checkbox" id="opt-nulls">
        <span>Keep nulls as <code>null</code> (else blank)</span>
      </label>
    </div>
    <div class="table-wrap">
      <table id="flat-table"></table>
    </div>
    <div class="row-actions">
      <button class="btn primary" id="download-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        Download CSV
      </button>
      <button class="btn secondary" id="copy-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy TSV
      </button>
    </div>
    <p class="hint">Best-effort flattening: nested objects → <code>a.b.c</code>, arrays → <code>a.0</code>. Deeply ragged data may produce many columns.</p>
  </section>

  <footer class="footer">100% on-device · nothing is uploaded</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
