<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="3" y1="15" x2="21" y2="15"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
        <line x1="15" y1="3" x2="15" y2="21"/>
      </svg>
    </div>
    <div>
      <h1>CSV Doctor</h1>
      <p class="subtitle">Delimiter detective &amp; fixer</p>
    </div>
  </header>

  <section class="panel">
    <label class="field-label" for="input">Paste CSV text or drop a file</label>
    <textarea id="input" rows="5" placeholder="name;city;score&#10;Ada;Lovelace;95&#10;Grace;Hopper;98" spellcheck="false"></textarea>
    <div class="row">
      <button id="browse" class="btn ghost" title="Load a .csv / .txt file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Load file
      </button>
      <button id="sample" class="btn ghost" title="Load a messy sample">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Sample
      </button>
      <button id="clear" class="btn ghost" title="Clear everything">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Clear
      </button>
      <input type="file" id="file" accept=".csv,.tsv,.txt,text/csv,text/plain" hidden>
    </div>
  </section>

  <section class="panel hidden" id="analysisPanel">
    <div class="detect-row">
      <div class="detect-info">
        <span class="field-label">Detected delimiter</span>
        <span id="detected" class="detect-badge">—</span>
        <span id="detectNote" class="detect-note"></span>
      </div>
      <label class="field-label" for="override">Override</label>
      <select id="override">
        <option value="">Auto</option>
        <option value=",">Comma ,</option>
        <option value=";">Semicolon ;</option>
        <option value="&#9;">Tab</option>
        <option value="|">Pipe |</option>
      </select>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-num" id="statRows">0</span><span class="stat-lab">rows</span></div>
      <div class="stat"><span class="stat-num" id="statCols">0</span><span class="stat-lab">columns</span></div>
      <div class="stat"><span class="stat-num warn-num" id="statRagged">0</span><span class="stat-lab">ragged</span></div>
    </div>

    <div id="warnings" class="warnings hidden"></div>

    <label class="field-label">Preview <span class="muted">(first 8 rows)</span></label>
    <div class="table-wrap"><table id="preview"></table></div>

    <div class="row output-row">
      <label class="field-label" for="outDelim">Export as</label>
      <select id="outDelim">
        <option value=",">Comma ,</option>
        <option value=";">Semicolon ;</option>
        <option value="&#9;">Tab (TSV)</option>
        <option value="|">Pipe |</option>
      </select>
      <button id="download" class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download CSV
      </button>
      <button id="copy" class="btn ghost" title="Copy cleaned CSV to clipboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
    </div>
    <p class="footnote">Fields containing the delimiter, quotes or line breaks are quoted per RFC&nbsp;4180. Everything stays on your device.</p>
  </section>

  <section class="panel empty-state" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <p>Paste or load CSV text above and the Doctor will detect its delimiter automatically.</p>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
