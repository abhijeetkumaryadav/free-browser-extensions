<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
<title>PivotLens</title>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header glass">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
    </div>
    <div>
      <h1>PivotLens</h1>
      <p class="subtitle">CSV pivot table previewer</p>
    </div>
  </header>

  <!-- Step 1: paste data -->
  <section class="panel glass" id="data-panel">
    <div class="panel-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15l3 3 3-3"/></svg>
      <h2>1 · Paste CSV data</h2>
      <span class="meta" id="row-count"></span>
    </div>
    <textarea id="csv-input" placeholder="Paste CSV here, first row = headers&#10;Region,Product,Sales&#10;North,Apples,120&#10;South,Apples,95&#10;North,Pears,60"></textarea>
    <div class="row-actions">
      <button class="btn secondary" id="load-sample">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        Sample data
      </button>
      <button class="btn primary" id="parse-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        Parse fields
      </button>
    </div>
    <div class="error hidden" id="parse-error"></div>
  </section>

  <!-- Step 2: configure pivot -->
  <section class="panel glass hidden" id="config-panel">
    <div class="panel-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg>
      <h2>2 · Configure pivot</h2>
    </div>
    <div class="field-grid">
      <label>Row field
        <select id="row-field"></select>
      </label>
      <label>Column field
        <select id="col-field"></select>
      </label>
      <label>Value field
        <select id="val-field"></select>
      </label>
      <label>Aggregation
        <select id="agg">
          <option value="sum">Sum</option>
          <option value="count">Count</option>
          <option value="avg">Average</option>
          <option value="min">Min</option>
          <option value="max">Max</option>
        </select>
      </label>
    </div>
    <div class="row-actions">
      <button class="btn primary" id="build-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        Build pivot
      </button>
      <button class="btn secondary" id="export-btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        Export CSV
      </button>
    </div>
  </section>

  <!-- Step 3: result -->
  <section class="panel glass hidden" id="result-panel">
    <div class="panel-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/></svg>
      <h2>3 · Pivot result</h2>
      <span class="meta" id="pivot-meta"></span>
    </div>
    <div class="table-wrap" id="table-wrap">
      <table id="pivot-table"></table>
    </div>
    <p class="hint">Tip: choose “(none)” as the column field for a single-column summary.</p>
  </section>

  <footer class="footer">100% on-device · nothing is uploaded</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
