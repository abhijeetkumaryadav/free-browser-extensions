<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablix</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
      <div>
        <h1>Tablix</h1>
        <p class="sub">Markdown table → CSV</p>
      </div>
    </div>
    <span class="pill" id="tableCount">0 tables</span>
  </header>

  <section class="card">
    <div class="card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
      <span>Paste Markdown</span>
    </div>
    <textarea id="mdInput" rows="6" placeholder="Paste Markdown with one or more tables&#10;&#10;| Name | Role |&#10;| --- | --- |&#10;| Ada | Engineer |"></textarea>
    <div class="row">
      <button class="btn primary" id="btnConvert">Detect tables</button>
      <button class="btn ghost" id="btnSample">Load sample</button>
      <button class="btn ghost" id="btnClear">Clear</button>
    </div>
    <p class="hint">Alignment rows (<code>| --- |</code>), escaped pipes (<code>\|</code>), and inline code are handled.</p>
  </section>

  <section class="card hidden" id="resultsCard">
    <div class="card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      <span>Detected tables</span>
    </div>
    <div class="slider-row">
      <label class="lbl" for="delimiter">Delimiter · <span id="delimName">Comma</span></label>
      <select id="delimiter">
        <option value=",">Comma (,)</option>
        <option value=";">Semicolon (;)</option>
        <option value="&#9;">Tab</option>
        <option value="|">Pipe (|)</option>
      </select>
    </div>
    <div id="tables"></div>
  </section>

  <footer class="footer">100% on-device · nothing is uploaded</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
