<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Validation Badge</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="glass">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
    <div><h1>Validation Badge</h1><p id="pageHost">—</p></div>
    <button id="scan" class="primary">Validate</button>
  </header>
  <main>
    <section class="glass card" id="results" hidden>
      <div class="score-wrap">
        <svg class="ring" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" class="track"/>
          <circle cx="60" cy="60" r="52" class="prog" id="ringProg"/>
          <text x="60" y="68" class="score" id="scoreNum">0</text>
        </svg>
        <div class="verdict" id="verdict">—</div>
      </div>
      <div class="stats">
        <div class="err"><span>Errors</span><b id="cErr">0</b></div>
        <div class="wrn"><span>Warnings</span><b id="cWrn">0</b></div>
        <div class="inf"><span>Notices</span><b id="cInf">0</b></div>
      </div>
      <div id="groups"></div>
      <p class="note">Best-effort on-device checks against the serialized DOM. Not a substitute for the W3C validator.</p>
    </section>
    <section class="glass card" id="recentCard" hidden>
      <h2>Recent pages</h2>
      <div id="recent"></div>
    </section>
    <div id="empty" class="empty">Hit <b>Validate</b> to check this page's HTML on-device.</div>
  </main>
<script src="popup.js"></script>
</body>
</html>
