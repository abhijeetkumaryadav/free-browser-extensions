<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReactPop</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8"/><path d="M9 9.5h.01M15 9.5h.01"/></svg>
  </div>
  <div>
    <h1>ReactPop</h1>
    <p class="sub">Original mini GIFs · 100% local</p>
  </div>
</header>

<main>
  <section class="grid" id="grid" aria-label="Reaction picker"></section>

  <section class="preview" id="preview" hidden>
    <img id="previewImg" alt="Selected reaction preview">
    <div class="preview-body">
      <p class="preview-name" id="previewName">happy</p>
      <div class="actions">
        <button id="popBtn" class="btn primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M7 21h13a1 1 0 0 0 1-1V8"/></svg>
          Pop out
        </button>
        <button id="copyBtn" class="btn ghost">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
      </div>
    </div>
  </section>

  <p class="toast" id="toast" role="status" hidden></p>

  <footer class="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>All reactions are original placeholder art drawn for this extension. No copyrighted GIFs.</span>
  </footer>
</main>

<script src="popup.js"></script>
</body>
</html>
