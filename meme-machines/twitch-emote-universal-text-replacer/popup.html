<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmoteSwap</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="head">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><circle cx="9" cy="11" r="0.6" fill="currentColor"/><circle cx="15" cy="11" r="0.6" fill="currentColor"/><path d="M9.5 14.5c1 1 4 1 5 0"/></svg>
    </div>
    <div>
      <h1>EmoteSwap</h1>
      <p class="sub">Fun emote text replacer</p>
    </div>
    <span class="badge" id="stateBadge">idle</span>
  </header>

  <section class="panel">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="0.8" fill="currentColor"/><circle cx="15" cy="10" r="0.8" fill="currentColor"/><path d="M8.5 14.5c2 2 5 2 7 0"/></svg>
      <span>Emote style</span>
    </div>
    <div class="segmented" id="modeSeg">
      <button data-mode="icon" class="on">Icons</button>
      <button data-mode="badge">Badges</button>
    </div>
    <p class="hint">Icons swap codes for little emote pictures. Badges render codes as purple pills.</p>
  </section>

  <section class="panel">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Supported codes</span>
    </div>
    <div class="emotes" id="emoteGrid"></div>
  </section>

  <div class="actions">
    <button class="btn primary" id="applyBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      Emote-ify this page
    </button>
    <button class="btn ghost" id="restoreBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Restore original
    </button>
  </div>

  <p class="foot">Just for fun. Changes are reversible and stay on your device. Nothing is uploaded.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
