<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuoteVault</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 7-1 3-8-1.5-2.5-4-4-4-4"/><path d="M11 21c3 0 7-1 3-8-1.5-2.5-4-4-4-4"/><path d="M14 7h7M21 7v7"/></svg>
  </div>
  <div>
    <h1>QuoteVault</h1>
    <p class="sub">Cinematic lines &amp; public-domain classics</p>
  </div>
</header>

<main>
  <div class="searchbar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Search quotes or authors…" autocomplete="off">
  </div>

  <div class="chips" role="tablist" aria-label="Quote categories">
    <button class="chip active" data-cat="all" type="button">All</button>
    <button class="chip" data-cat="original" type="button">Original lines</button>
    <button class="chip" data-cat="classic" type="button">Public domain</button>
    <button class="chip" data-cat="favorites" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3.4 1-4.5 2.5C10.9 4 9.3 3 7.5 3A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg>
      Starred
    </button>
  </div>

  <section class="list" id="list" aria-label="Quotes"></section>
  <p class="empty" id="empty" hidden>No quotes match. Try another search.</p>
  <p class="toast" id="toast" role="status" hidden></p>

  <footer class="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>“Original lines” are written for this extension in a classic movie style — they are <strong>not</strong> actual film quotes. Classics are genuine public-domain works (e.g. Shakespeare).</span>
  </footer>
</main>

<script src="popup.js"></script>
</body>
</html>
