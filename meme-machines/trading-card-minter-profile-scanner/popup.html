<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CardForge — Trading Card Minter</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <!-- Lucide-style layers icon -->
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      <div>
        <h1>CardForge</h1>
        <p class="subtitle">trading card minter</p>
      </div>
    </div>
    <button id="diceBtn" class="icon-btn" title="Randomize stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>

  <!-- Card preview -->
  <section class="card">
    <canvas id="cardCanvas" width="600" height="840"></canvas>
    <button id="downloadBtn" class="download-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download PNG
    </button>
  </section>

  <!-- Editor -->
  <section class="card editor">
    <div class="row">
      <div class="field grow">
        <label class="field-label" for="nameInput">Card name</label>
        <input id="nameInput" class="text-input" type="text" maxlength="28" placeholder="e.g. Night Owl Dev">
      </div>
      <button id="tabBtn" class="tab-btn" title="Use the current tab's title as the card name">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        From tab
      </button>
    </div>

    <div class="field">
      <label class="field-label" for="titleInput">Title / epithet</label>
      <input id="titleInput" class="text-input" type="text" maxlength="40" placeholder="e.g. Keeper of the Deadline">
    </div>

    <div class="field">
      <label class="field-label" for="flavorInput">Flavor text</label>
      <input id="flavorInput" class="text-input" type="text" maxlength="80" placeholder="A short legendary quote…">
    </div>

    <div class="row stats-row">
      <div class="field">
        <label class="field-label" for="hpInput">HP</label>
        <input id="hpInput" class="num-input" type="number" min="0" max="999" value="80">
      </div>
      <div class="field">
        <label class="field-label" for="atkInput">ATK</label>
        <input id="atkInput" class="num-input" type="number" min="0" max="999" value="60">
      </div>
      <div class="field">
        <label class="field-label" for="defInput">DEF</label>
        <input id="defInput" class="num-input" type="number" min="0" max="999" value="55">
      </div>
    </div>

    <div class="field">
      <label class="field-label">Art style</label>
      <div class="art-row" id="artRow"></div>
    </div>

    <div class="field">
      <label class="field-label">Rarity</label>
      <div class="rarity-row" id="rarityRow"></div>
    </div>
  </section>

  <footer class="foot">
    <span>Just for fun — all art is original, generated for this card.</span>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
