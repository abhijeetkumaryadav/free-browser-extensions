<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Scarcity Check</title><link rel="stylesheet" href="popup.css"></head>
<body>
<div class="shell">
  <header class="app-header">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </span>
    <div><h1>Scarcity Check</h1><p class="sub">Flash-sale pressure verifier</p></div>
  </header>

  <div class="honesty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    <p>Heuristic pressure detection only. Flags <strong>suspicious patterns</strong> — it <strong>cannot</strong> verify real inventory levels.</p>
  </div>

  <button id="scanBtn" class="primary">Scan this sale page</button>

  <section id="results" class="hidden">
    <div class="ring-wrap">
      <div class="ring" id="ring"><span id="scoreNum">–</span></div>
      <div class="ring-meta"><div id="verdict">–</div><p id="scanNote">–</p></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <h2>Pressure signals</h2>
    <div id="findings" class="findings"></div>
    <button id="clearBtn" class="ghost">Clear results</button>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
