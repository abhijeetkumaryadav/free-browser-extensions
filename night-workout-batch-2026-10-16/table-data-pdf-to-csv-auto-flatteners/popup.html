<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Flattener</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <line x1="3" y1="10" x2="21" y2="10"></line>
        <line x1="3" y1="15" x2="21" y2="15"></line>
        <line x1="9" y1="4" x2="9" y2="20"></line>
        <line x1="15" y1="4" x2="15" y2="20"></line>
      </svg>
    </div>
    <div class="titles">
      <h1>Table Flattener</h1>
      <p class="subtitle">Tabular text &rarr; clean CSV</p>
    </div>
  </header>

  <!-- Honest-scope banner -->
  <div class="banner" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="16" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </svg>
    <span><strong>Text-only.</strong> Does not parse PDF files — paste or load text/CSV only.</span>
  </div>

  <!-- Input -->
  <section class="card">
    <div class="card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
      </svg>
      <span>1 · Source text</span>
    </div>
    <textarea id="input" rows="6" placeholder="Paste tabular text here — comma, tab, semicolon or pipe separated&#10;&#10;Name,Age,City&#10;Asha,29,Mumbai&#10;Ravi,34,Delhi"></textarea>
    <div class="row">
      <label class="file-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Load .csv / .txt
        <input type="file" id="fileInput" accept=".csv,.txt,.tsv" hidden>
      </label>
      <select id="delimiter" aria-label="Delimiter">
        <option value="auto" selected>Auto-detect</option>
        <option value=",">Comma (,)</option>
        <option value="&#9;">Tab</option>
        <option value=";">Semicolon (;)</option>
        <option value="|">Pipe (|)</option>
      </select>
    </div>
    <div class="row">
      <button id="processBtn" class="primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Flatten &amp; preview
      </button>
      <button id="clearBtn" class="ghost">Clear</button>
    </div>
  </section>

  <!-- Result -->
  <section class="card" id="resultCard" hidden>
    <div class="card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 11 12 14 22 4"></polyline>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
      </svg>
      <span>2 · Clean table</span>
      <span class="stats" id="stats"></span>
    </div>
    <p class="delim-note" id="delimNote"></p>
    <div class="table-wrap">
      <table id="previewTable"></table>
    </div>
    <div class="row">
      <button id="downloadBtn" class="primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download CSV
      </button>
      <button id="copyBtn" class="ghost">Copy CSV</button>
    </div>
  </section>

  <footer class="footer">All processing happens locally in your browser.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
