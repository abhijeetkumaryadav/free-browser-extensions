<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliché Detector</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
    </div>
    <div>
      <h1>Cliché Detector</h1>
      <p class="sub">Scan text against a bundled cliché list</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>Bundled phrase list only — not AI. Review every match yourself.</span>
  </div>

  <section class="controls">
    <button id="scanActive" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Scan active field
    </button>
    <button id="clearMarks" class="btn ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Clear marks
    </button>
  </section>

  <section class="paste">
    <label for="pasteText">…or paste text here</label>
    <textarea id="pasteText" rows="4" placeholder="Paste text to scan locally…"></textarea>
    <button id="scanPaste" class="btn primary full">Scan pasted text</button>
  </section>

  <section class="results hidden" id="results">
    <h2>Matches <span class="count" id="matchCount">0</span></h2>
    <ul id="matchList"></ul>
  </section>

  <footer>
    <span id="status">Ready.</span>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
