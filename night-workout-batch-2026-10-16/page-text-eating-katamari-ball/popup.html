<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M7 12a5 5 0 0 1 10 0"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
    <div>
      <h1>Katamari Text Muncher</h1>
      <p class="sub">Silly page game · 100% local</p>
    </div>
  </header>

  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>A ball rolls over the page and munches words — visually only. The page itself is never changed. One click restores everything.</span>
  </div>

  <div class="field">
    <label>Ball size</label>
    <input type="range" id="size" min="20" max="90" value="44">
  </div>
  <div class="field">
    <label>Ball color</label>
    <div class="palette" id="palette"></div>
  </div>

  <div class="actions">
    <button id="start" class="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      Roll the ball
    </button>
    <button id="clear" class="ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Reset page
    </button>
  </div>
  <p class="hint">Move your mouse to roll. Press <kbd>Esc</kbd> to stop.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
