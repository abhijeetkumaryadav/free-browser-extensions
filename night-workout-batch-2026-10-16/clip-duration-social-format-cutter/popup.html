<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Format Cutter</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="head">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M17 4v16M3 8h4M3 12h4M3 16h4M17 8h4M17 12h4M17 16h4M7 12h10"/></svg>
    </div>
    <div>
      <h1>Social Format Cutter</h1>
      <p class="sub">Trim clips to social lengths. <strong>Trims to length — does not reframe content.</strong></p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Local only — your video never leaves this machine. Re-encodes via MediaRecorder; quality depends on browser codecs.</span>
  </div>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="video/*" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    <span id="dropLabel">Drop a video or click to choose</span>
  </label>

  <div id="editor" class="hidden">
    <video id="preview" muted playsinline></video>
    <div class="time-row"><span id="tStart">0:00</span><span id="tDur" class="dur">0:00 clip</span><span id="tEnd">0:00</span></div>

    <label class="field"><span>Start (s)</span><input type="range" id="start" min="0" max="100" step="0.1" value="0"></label>
    <label class="field"><span>End (s)</span><input type="range" id="end" min="0" max="100" step="0.1" value="100"></label>

    <div class="presets">
      <span class="plabel">Target length:</span>
      <div class="pbtns">
        <button class="pbtn" data-sec="15">15s</button>
        <button class="pbtn" data-sec="30">30s</button>
        <button class="pbtn" data-sec="60">60s</button>
        <button class="pbtn" data-sec="90">90s</button>
      </div>
    </div>

    <div class="row">
      <button id="playClip" class="btn secondary">Preview clip</button>
      <button id="export" class="btn">Cut &amp; export</button>
    </div>
    <div id="progress" class="progress hidden"><div class="bar" id="bar"></div></div>
    <a id="download" class="btn hidden" download="clip.webm">Download clip</a>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
