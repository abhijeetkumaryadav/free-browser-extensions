<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="topbar">
  <svg class="brand-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4-3 7-7 7-12a7 7 0 1 0-14 0c0 5 3 9 7 12z"/><path d="M12 22v-8"/><path d="M12 14c-2 0-4-1.5-5-4 2.5 0 4.5 1 5 4z"/></svg>
  <div>
    <h1>Seed Timeline</h1>
    <p class="sub">Sow → germinate → harvest</p>
  </div>
</header>

<main>
  <section class="card">
    <label class="field-label" for="seed">Seed variety</label>
    <select id="seed"></select>
    <label class="field-label" for="sowDate">Sowing date</label>
    <input type="date" id="sowDate">
    <div class="row">
      <button id="addBtn" class="btn primary">Add to plan</button>
      <button id="clearBtn" class="btn ghost">Clear plan</button>
    </div>
  </section>

  <section class="card" id="detailCard" hidden>
    <h2 id="detailName">—</h2>
    <div class="facts" id="facts"></div>
    <div class="timeline" id="timeline"></div>
  </section>

  <section class="card">
    <div class="plan-head">
      <h2>My plan <span id="planCount" class="count">0</span></h2>
      <button id="icsBtn" class="btn primary small" disabled>Download .ics</button>
    </div>
    <ul id="planList" class="plan-list"></ul>
    <p id="emptyMsg" class="muted">No seeds planned yet. Add one above.</p>
  </section>

  <p class="disclaimer">
    Figures are typical published ranges — actual results vary by cultivar,
    soil, weather and seed age. Everything runs locally; nothing leaves your device.
  </p>
</main>

<script src="seeds.js"></script>
<script src="popup.js"></script>
</body>
</html>
