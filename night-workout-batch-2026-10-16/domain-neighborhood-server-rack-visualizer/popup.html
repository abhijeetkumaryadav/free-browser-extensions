<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Server Rack Visualizer</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="head">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><circle cx="7" cy="7.5" r="1" fill="currentColor" stroke="none"/><circle cx="7" cy="16.5" r="1" fill="currentColor" stroke="none"/><path d="M11 7.5h7M11 16.5h7"/></svg>
    </span>
    <div>
      <h1>Rack Visualizer</h1>
      <p class="sub">Your sites as a server rack</p>
    </div>
  </header>

  <p class="banner">Cosmetic doodle only — nothing here measures servers or domains. You add every site yourself.</p>

  <section class="card">
    <canvas id="rack" width="324" height="300" aria-label="Server rack visualization"></canvas>
    <p class="hint">Click a rack unit to open its site.</p>
  </section>

  <section class="card">
    <h2>Add a site</h2>
    <div class="row2">
      <label>Name <input id="inName" maxlength="40" placeholder="My blog"></label>
      <label>URL <input id="inUrl" placeholder="https://example.com"></label>
    </div>
    <button id="add" class="btn">Add to rack</button>
    <p class="err" id="addErr" hidden></p>
  </section>

  <section class="card">
    <h2>My sites</h2>
    <ul id="siteList" class="list"></ul>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
