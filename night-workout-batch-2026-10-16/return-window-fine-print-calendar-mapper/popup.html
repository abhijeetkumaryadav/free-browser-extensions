<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Return Window Mapper</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="M12 14v4"/><path d="M10 16h4"/></svg>
    <div>
      <h1>Return Window Mapper</h1>
      <p class="sub">Never miss a return deadline</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>Deadlines come from <strong>policies you enter</strong>. Always verify with the seller's actual terms.</span>
  </div>

  <div id="alerts" class="alerts"></div>

  <section class="card form-card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      Log a purchase
    </h2>
    <div class="grid2">
      <label>Item<input id="f-item" type="text" placeholder="e.g. Headphones"></label>
      <label>Store<input id="f-store" type="text" placeholder="e.g. Amazon"></label>
      <label>Purchase date<input id="f-date" type="date"></label>
      <label>Return window (days)<input id="f-days" type="number" min="1" max="365" value="30"></label>
    </div>
    <label class="full">Fine-print notes<textarea id="f-notes" rows="2" placeholder="e.g. must be unopened, original receipt…"></textarea></label>
    <button id="btn-add" class="primary">Add purchase</button>
  </section>

  <section class="card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>
      Deadlines <span id="count" class="pill">0</span>
    </h2>
    <div class="stats" id="stats"></div>
    <div id="list" class="list"><p class="empty">No purchases logged yet.</p></div>
    <button id="btn-clear" class="ghost">Clear all purchases</button>
  </section>

  <footer>Reminder aid only — 100% local, nothing leaves your browser.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
