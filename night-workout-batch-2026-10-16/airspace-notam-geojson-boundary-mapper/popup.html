<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airspace Notes</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>
    </svg>
    <div>
      <h1>Airspace Notes</h1>
      <p class="sub">Class guide &amp; boundary log</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Educational only — not live NOTAMs. Classes are general ICAO-style summaries; always check official charts.</span>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="guide">Class Guide</button>
    <button class="tab" data-tab="notes">My Notes</button>
  </nav>

  <section class="card" id="tab-guide">
    <div id="classList"></div>
  </section>

  <section class="card" id="tab-notes" hidden>
    <div class="form">
      <label>Boundary / area name<input id="nName" type="text" placeholder="e.g. Riverside Class D"></label>
      <label>Airspace class
        <select id="nClass">
          <option value="">—</option><option>A</option><option>B</option><option>C</option>
          <option>D</option><option>E</option><option>F</option><option>G</option>
        </select>
      </label>
      <div class="grid2">
        <label>Floor<input id="nFloor" type="text" placeholder="SFC"></label>
        <label>Ceiling<input id="nCeil" type="text" placeholder="2,500"></label>
      </div>
      <label>Notes<textarea id="nText" rows="2" placeholder="Entry requirements, frequencies, reminders…"></textarea></label>
      <button class="btn" id="addNote">Add note</button>
    </div>
    <div class="search-row">
      <input id="search" type="text" placeholder="Search notes…">
      <span class="count" id="count">0 notes</span>
    </div>
    <div id="noteList" class="note-list"></div>
  </section>

  <footer>Educational only — not live NOTAM data.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
