<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="app-header">
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20c4-1 5-6 8-9s5-4 6-7"/><circle cx="3" cy="20" r="1.6"/><circle cx="11" cy="11" r="1.6"/><circle cx="21" cy="4" r="1.6"/></svg>
  <div>
    <h1>ArcSmith</h1>
    <p class="tagline">Narrative arc graph builder</p>
  </div>
</header>

<div class="scope-banner">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
  <span>Creative planning tool — <b>you</b> define every beat and tension level. It only draws what you describe.</span>
</div>

<section class="card">
  <h2>Projects</h2>
  <div class="row">
    <input id="projectName" class="text-input grow" placeholder="New project name…" maxlength="60">
    <button id="addProjectBtn" class="btn primary slim">Add</button>
  </div>
  <ul id="projectList" class="proj-list"></ul>
</section>

<section class="card" id="editorCard" style="display:none">
  <h2 id="editorTitle">Project</h2>
  <div class="row">
    <input id="beatTitle" class="text-input grow" placeholder="Beat / scene title…" maxlength="60">
  </div>
  <div class="row">
    <select id="beatPhase" class="text-input grow">
      <option value="setup">Setup</option>
      <option value="rising">Rising action</option>
      <option value="climax">Climax</option>
      <option value="falling">Falling action</option>
      <option value="resolution">Resolution</option>
    </select>
    <div class="tension-wrap">
      <label class="field-label" for="beatTension">Tension <b id="tensionVal">5</b>/10</label>
      <input id="beatTension" type="range" min="0" max="10" value="5" step="1">
    </div>
  </div>
  <div class="btn-row">
    <button id="addBeatBtn" class="btn primary">Add beat</button>
  </div>
  <ul id="beatList" class="beat-list"></ul>
</section>

<section class="card" id="graphCard" style="display:none">
  <h2>Arc graph</h2>
  <div id="arcGraph" class="graph"></div>
  <div id="arcStats" class="stats"></div>
  <h2 class="mt">Compare projects <span class="hint-inline">(pick up to 3)</span></h2>
  <div id="compareList" class="compare-list"></div>
  <div id="compareGraph" class="graph"></div>
  <div class="btn-row">
    <button id="exportBtn" class="btn ghost">Export JSON</button>
    <button id="deleteProjectBtn" class="btn ghost danger">Delete project</button>
  </div>
</section>

<script src="popup.js"></script>
</body>
</html>
