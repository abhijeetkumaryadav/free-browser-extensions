<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farmers Market Price Log</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    <div>
      <h1>Market Price Log</h1>
      <p class="sub">Manual produce price aggregator</p>
    </div>
  </header>

  <div class="scope-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Your logged prices only — <strong>not live market data</strong>. You type every price by hand.</span>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="log">Log price</button>
    <button class="tab" data-tab="compare">Compare</button>
    <button class="tab" data-tab="entries">Entries</button>
  </nav>

  <!-- LOG TAB -->
  <section id="tab-log" class="pane active">
    <div class="field">
      <label for="item">Produce item</label>
      <input id="item" type="text" placeholder="e.g. Heirloom tomatoes" autocomplete="off">
    </div>
    <div class="row">
      <div class="field">
        <label for="price">Price (per unit)</label>
        <input id="price" type="number" min="0" step="0.01" placeholder="4.50">
      </div>
      <div class="field">
        <label for="unit">Unit</label>
        <select id="unit">
          <option value="lb">/ lb</option>
          <option value="kg">/ kg</option>
          <option value="each">each</option>
          <option value="bunch">/ bunch</option>
          <option value="dozen">/ dozen</option>
          <option value="pint">/ pint</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="market">Market</label>
        <input id="market" type="text" placeholder="e.g. Saturday Greenmarket" autocomplete="off">
      </div>
      <div class="field">
        <label for="stall">Stall / vendor</label>
        <input id="stall" type="text" placeholder="optional" autocomplete="off">
      </div>
    </div>
    <div class="field">
      <label for="date">Date</label>
      <input id="date" type="date">
    </div>
    <button id="add-btn" class="primary">Log price</button>
    <p id="log-msg" class="msg"></p>
  </section>

  <!-- COMPARE TAB -->
  <section id="tab-compare" class="pane">
    <div class="stat-row">
      <div class="stat"><span class="stat-num" id="stat-items">0</span><span class="stat-label">items</span></div>
      <div class="stat"><span class="stat-num" id="stat-entries">0</span><span class="stat-label">entries</span></div>
      <div class="stat"><span class="stat-num" id="stat-markets">0</span><span class="stat-label">markets</span></div>
    </div>
    <div class="field">
      <label for="item-select">Pick an item to compare</label>
      <select id="item-select"><option value="">— select —</option></select>
    </div>
    <div id="compare-results"></div>
    <div id="trend-box" class="hidden">
      <h3>Price trend (avg per visit)</h3>
      <div id="trend-bars"></div>
    </div>
  </section>

  <!-- ENTRIES TAB -->
  <section id="tab-entries" class="pane">
    <div class="field">
      <label for="search">Search entries</label>
      <input id="search" type="text" placeholder="item, market, or stall…" autocomplete="off">
    </div>
    <div id="entry-list"></div>
    <button id="clear-btn" class="danger">Clear all entries</button>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
