<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clickbait Signal Scanner</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>
    <div>
      <h1>Clickbait Signal Scanner</h1>
      <p class="sub">Heuristic signals — your rewrite</p>
    </div>
  </header>

  <label class="field-label" for="headline">Paste a headline</label>
  <textarea id="headline" rows="3" placeholder="e.g. You won't believe what happened next..."></textarea>

  <div class="row">
    <button id="scanBtn" class="primary">Scan signals</button>
    <button id="clearBtn" class="ghost">Clear</button>
  </div>

  <section id="results" class="hidden">
    <div class="score-row">
      <div class="score-ring"><span id="scoreNum">0</span></div>
      <div class="score-info">
        <div id="verdict" class="verdict">—</div>
        <div id="scoreHint" class="hint">0 = calm, 100 = maximum clickbait signals</div>
      </div>
    </div>
    <ul id="signals"></ul>
  </section>

  <label class="field-label" for="rewrite">Your rewrite (what's actually being said?)</label>
  <textarea id="rewrite" rows="2" placeholder="Write the honest version..."></textarea>

  <div class="banner">
    Heuristic signals only — no AI, no network. Your rewrite is saved locally.
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
