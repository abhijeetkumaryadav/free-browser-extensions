<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Box Breathing Pacer</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-head">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
    </span>
    <div>
      <h1>Box Breathing Pacer</h1>
      <p class="sub">Pranayama bubble</p>
    </div>
  </header>

  <section class="card stage-card">
    <div class="stage" aria-hidden="true">
      <div id="bubble" class="bubble idle"></div>
      <div id="phaseLabel" class="phase-label">Ready</div>
      <div id="countLabel" class="count-label">&nbsp;</div>
    </div>
    <div class="session-row">
      <span id="timer" class="timer">00:00</span>
      <div class="controls">
        <button id="startBtn" class="btn">Start</button>
        <button id="stopBtn" class="btn ghost" disabled>Stop</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="grid">
      <label>Inhale (s)<input type="number" id="inhale" min="2" max="12" value="4"></label>
      <label>Hold (s)<input type="number" id="hold1" min="0" max="12" value="4"></label>
      <label>Exhale (s)<input type="number" id="exhale" min="2" max="12" value="4"></label>
      <label>Hold (s)<input type="number" id="hold2" min="0" max="12" value="4"></label>
      <label>Session (min)<input type="number" id="minutes" min="1" max="30" value="5"></label>
      <label class="check"><input type="checkbox" id="chime" checked> Chime on phase change</label>
    </div>
  </section>

  <p class="disclaimer">Pacing aid only — not medical advice. Breathe comfortably; stop if dizzy.</p>
  <script src="popup.js"></script>
</body>
</html>
