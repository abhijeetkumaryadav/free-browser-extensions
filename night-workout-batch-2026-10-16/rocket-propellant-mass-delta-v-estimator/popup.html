<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delta-V Estimator</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c3.5 2.5 5 6 5 10l3 3-3.5.5c-.8 2.4-2.6 4-4.5 4.5-1.9-.5-3.7-2.1-4.5-4.5L4 15l3-3c0-4 1.5-7.5 5-10z"/><circle cx="12" cy="9" r="1.6"/></svg>
  <div>
    <h1>Delta-V Estimator</h1>
    <p class="sub">Tsiolkovsky equation — textbook physics, estimates.</p>
  </div>
</header>

<section class="card">
  <div class="card-title">Rocket</div>
  <div class="row">
    <label>Dry mass (kg)<input id="dry" type="number" min="0" step="any" placeholder="1000"></label>
    <label>Propellant (kg)<input id="prop" type="number" min="0" step="any" placeholder="8000"></label>
  </div>
  <div class="row">
    <label>Isp (s)<input id="isp" type="number" min="0" step="any" placeholder="311"></label>
    <label>g₀ (m/s²)<input id="g0" type="number" min="0" step="any" value="9.80665"></label>
  </div>
  <button id="calc" class="btn primary">Calculate</button>
  <div id="result" class="result" hidden>
    <div class="dv"><span id="dvVal">—</span><small>m/s</small></div>
    <div class="meta" id="dvMeta"></div>
  </div>
</section>

<section class="card">
  <div class="card-title">Multi-stage (each stage's dry + prop + Isp)</div>
  <div id="stages"></div>
  <button id="addStage" class="btn ghost">+ Add stage</button>
  <button id="calcStages" class="btn primary" style="margin-top:8px">Calculate all stages</button>
  <div id="stageResult" class="stage-list"></div>
</section>

<footer class="notice">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
  <span>Ideal rocket equation (no drag, no gravity losses, instant burns). Educational estimate.</span>
</footer>
<script src="popup.js"></script>
</body>
</html>
