<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="7" y1="10" x2="17" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
    <div>
      <h1>Line Focus</h1>
      <p class="sub">Scrolling mask overlay</p>
    </div>
  </header>

  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>Reversible overlay. Click off to restore the page untouched.</span>
  </div>

  <button id="toggle" class="btn">Enable on this tab</button>

  <div class="group">
    <label for="bandH">Band height (px)</label>
    <input id="bandH" type="range" min="24" max="120" step="4" value="56">
    <span id="bandHVal" class="val">56px</span>
  </div>
  <div class="group">
    <label for="dim">Dim strength</label>
    <input id="dim" type="range" min="20" max="85" step="5" value="55">
    <span id="dimVal" class="val">55%</span>
  </div>
  <div class="group">
    <label class="check"><input id="follow" type="checkbox" checked> <span>Band follows scroll</span></label>
    <p class="hint">When off, the band stays at the mouse Y position.</p>
  </div>

  <p id="status" class="status"></p>
</div>
<script src="popup.js"></script>
</body>
</html>
