<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Readability Scorer</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    </div>
    <div>
      <h1>Readability Scorer</h1>
      <p class="tagline">Flesch-Kincaid scores + heuristic suggestions</p>
    </div>
  </header>

  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>Formula-based score — <strong>not AI optimization</strong>. Syllables estimated by rule. 100% local.</span>
  </div>

  <label class="field">
    <span>Paste your copy</span>
    <textarea id="input" rows="5" placeholder="Paste text here…"></textarea>
  </label>
  <button id="score" class="btn primary">Score readability</button>

  <div id="scores" class="scores hidden"></div>
  <div id="suggestions" class="suggestions"></div>
  <div id="sentences" class="results"></div>

  <footer class="footer">
    <span>Flesch Reading Ease: 60–70 ≈ plain English · higher is easier.</span>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
