<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingredient Allergen Highlighter</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <div class="brand-text">
      <h1>Allergen Highlighter</h1>
      <p>Highlight allergens in ingredient lists</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span><strong>Heuristic only.</strong> Matches your keywords in ingredient-like text. Always read the label yourself — <strong>not medical advice</strong>.</span>
  </div>

  <div class="actions">
    <button id="scanBtn" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Scan this page
    </button>
    <button id="clearBtn" class="btn ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Clear
    </button>
  </div>

  <div id="status" class="status" role="status"></div>

  <section class="panel">
    <div class="panel-head">
      <h2>Watched allergens</h2>
      <span id="countLabel" class="count"></span>
    </div>
    <div id="allergenList" class="chips"></div>
    <div class="add-row">
      <input id="customInput" type="text" placeholder="Add custom allergen…" maxlength="40" autocomplete="off">
      <button id="addBtn" class="btn small">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add
      </button>
    </div>
  </section>

  <footer>100% local &middot; page untouched on clear &middot; zero network</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
