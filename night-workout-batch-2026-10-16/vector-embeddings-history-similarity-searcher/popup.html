<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History Similarity Search</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <div>
      <h1>Similarity Search</h1>
      <p class="sub">Fuzzy trigram search over your local history</p>
    </div>
  </header>

  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span><strong>Honest scope:</strong> typo-tolerant text similarity only — <em>not</em> vector embeddings, <em>not</em> semantic AI. Everything stays on this device.</span>
  </div>

  <div class="search-row">
    <input id="q" type="text" placeholder="Search similar titles or URLs…" autocomplete="off" spellcheck="false">
    <button id="clear" class="icon-btn" title="Clear query" aria-label="Clear query">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="filters">
    <select id="range" aria-label="Date range">
      <option value="all">All time</option>
      <option value="86400000">Last 24 hours</option>
      <option value="604800000">Last 7 days</option>
      <option value="2592000000">Last 30 days</option>
    </select>
    <select id="sort" aria-label="Sort order">
      <option value="relevance">Sort: relevance</option>
      <option value="recent">Sort: most recent</option>
      <option value="visited">Sort: most visited</option>
    </select>
  </div>

  <p id="status" class="status">Indexing history…</p>
  <ul id="results" class="results"></ul>
</div>
<script src="popup.js"></script>
</body>
</html>
