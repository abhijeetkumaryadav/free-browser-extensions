<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frost Alert — Weather Ticker</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M4.9 4.9l14.2 14.2"/><path d="M2 12h20"/><path d="M4.9 19.1L19.1 4.9"/><path d="M12 6l-2-2m2 2l2-2"/><path d="M12 18l-2 2m2-2l2 2"/></svg>
    <div>
      <h1>Frost Alert</h1>
      <p class="sub" id="locLabel">No location set</p>
    </div>
    <button class="icon-btn" id="refreshBtn" title="Refresh forecast">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="loc-row">
    <input type="text" id="locInput" placeholder="Search city or place…">
    <button class="btn primary" id="searchBtn">Set</button>
  </div>
  <div class="geo-results" id="geoResults"></div>

  <div class="status-line" id="statusLine">Enter a location to load the frost forecast.</div>

  <div class="ticker" id="ticker"></div>

  <div class="legend">
    <div class="legend-item"><span class="dot sev"></span>Severe frost (&lt; −2°C)</div>
    <div class="legend-item"><span class="dot warn"></span>Frost likely (−2…0°C)</div>
    <div class="legend-item"><span class="dot watch"></span>Watch (0…2°C)</div>
    <div class="legend-item"><span class="dot ok"></span>No frost (&gt; 2°C)</div>
  </div>

  <footer class="foot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Forecasts from Open-Meteo (free, no key). Heuristic frost guidance — protect sensitive plants when in doubt.</span>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
