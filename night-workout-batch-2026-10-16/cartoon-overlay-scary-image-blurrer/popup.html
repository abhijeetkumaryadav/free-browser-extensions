<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <span class="app-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e879f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
        <line x1="2" x2="22" y1="2" y2="22"/>
      </svg>
    </span>
    <div class="app-titles">
      <h1>BlurBuddy</h1>
      <p>Kid-comfort image blur</p>
    </div>
  </header>

  <div class="honest-note">
    Blurs only what <strong>you</strong> choose — it does not detect scary images.
  </div>

  <div class="controls">
    <label class="toggle-row">
      <span class="toggle-label">Click-to-blur mode
        <small>Click any image to blur it</small>
      </span>
      <span class="switch"><input type="checkbox" id="clickMode"><span class="slider"></span></span>
    </label>

    <label class="slider-row">
      <span class="slider-label">Blur strength <span id="intensityVal">12px</span></span>
      <input type="range" id="intensity" min="4" max="24" step="1" value="12">
    </label>

    <div class="btn-row">
      <button id="blurAllBtn" class="action-btn" type="button">Blur all images</button>
      <button id="unblurAllBtn" class="action-btn ghost" type="button">Unblur all</button>
    </div>
  </div>

  <div id="status" class="status" role="status"></div>

  <footer class="app-footer">
    Tip: click a blurred image to reveal it. Everything stays on this device.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
