<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page Number Styler</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="head">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="m9 16 3 3 3-3"/><rect x="4" y="3" width="16" height="18" rx="2" opacity="0"/></svg>
    <div>
      <h1>Page Number Styler</h1>
      <p class="sub">Stamp &middot; reorder &middot; download</p>
    </div>
  </header>

  <div class="banner" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Images only — not PDF pages. Load image files, stamp page numbers, download the numbered set.</span>
  </div>

  <div class="card">
    <label class="filebtn">Add images
      <input type="file" id="files" accept="image/*" multiple hidden>
    </label>
    <div id="list" class="list"><p class="meta empty">No images yet. Add image files to begin.</p></div>
  </div>

  <div class="card">
    <div class="row between">
      <span class="lbl">Numbering</span>
      <label class="switch"><input type="checkbox" id="enabled" checked><span class="knob"></span></label>
    </div>
    <div class="grid">
      <label>Start at <input type="number" id="startnum" min="0" max="9999" value="1"></label>
      <label>Position
        <select id="position">
          <option value="bottom-right">Bottom right</option>
          <option value="bottom-left">Bottom left</option>
          <option value="top-right">Top right</option>
          <option value="top-left">Top left</option>
          <option value="bottom-center">Bottom center</option>
          <option value="top-center">Top center</option>
        </select>
      </label>
    </div>
    <div class="grid">
      <label>Size <span id="sizeval">5%</span>
        <input type="range" id="fontsize" min="2" max="12" step="0.5" value="5">
      </label>
      <label>Margin <span id="marginval">4%</span>
        <input type="range" id="margin" min="0" max="12" step="1" value="4">
      </label>
    </div>
    <div class="grid">
      <label>Number color <input type="color" id="fg" value="#ffffff"></label>
      <label>Pill color <input type="color" id="bg" value="#000000"></label>
    </div>
    <label class="check"><input type="checkbox" id="pill" checked> Dark pill behind number</label>
    <label>Format
      <select id="format">
        <option value="plain">1, 2, 3…</option>
        <option value="dash">– 1 –</option>
        <option value="page">Page 1</option>
        <option value="pagenof">Page 1 of 8</option>
      </select>
    </label>
  </div>

  <div class="card">
    <div class="previewwrap"><canvas id="preview" width="348" height="200"></canvas></div>
    <div class="row between">
      <span id="pageinfo" class="meta">—</span>
      <span id="pagelabel" class="meta"></span>
    </div>
    <button id="download" class="primary" disabled>Download numbered set</button>
    <button id="clearall" class="ghost" disabled>Remove all</button>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
