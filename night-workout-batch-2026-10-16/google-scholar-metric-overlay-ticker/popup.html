<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scholar Metric Log</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 8h7M9 12h5"/></svg>
    <div class="titles"><h1>Scholar Metric Log</h1><p class="sub">Your paper log — not live metrics</p></div>
  </header>
  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Manual log. No live Google Scholar scraping — counts are whatever you enter.</span>
  </div>
  <div class="stats" id="stats"></div>
  <form id="addForm" class="card">
    <h2>Add paper</h2>
    <input id="fTitle" type="text" maxlength="300" placeholder="Paper title *" required>
    <input id="fAuthors" type="text" maxlength="300" placeholder="Authors (optional)">
    <div class="row">
      <input id="fYear" type="number" min="1800" max="2100" placeholder="Year">
      <input id="fCites" type="number" min="0" max="1000000" placeholder="Citations">
    </div>
    <textarea id="fNotes" rows="2" maxlength="2000" placeholder="Your notes (h-index context, where cited, etc.)"></textarea>
    <button type="submit" class="btn-primary">Save paper</button>
  </form>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search title, authors, notes…">
  </div>
  <div id="list" class="list"></div>
  <footer class="foot"><span id="count"></span><button id="exportBtn" class="link">Export JSON</button></footer>
</div>
<script src="popup.js"></script>
</body>
</html>
