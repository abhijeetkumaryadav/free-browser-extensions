<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>C2PA Concepts</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="hdr">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
    </span>
    <div>
      <h1>C2PA Concepts</h1>
      <p class="sub">Provenance explainer &amp; your notes</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <span>Educational only — not authentication. Nothing here verifies a real signature.</span>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="learn">Learn</button>
    <button class="tab" data-tab="notes">My notes <span id="noteBadge" class="badge">0</span></button>
  </nav>

  <section id="tab-learn" class="tabpage active">
    <div id="conceptList" class="concepts"></div>
  </section>

  <section id="tab-notes" class="tabpage">
    <div class="addform">
      <input type="text" id="noteTitle" maxlength="80" placeholder="Note title (e.g. photo I checked)">
      <textarea id="noteBody" rows="2" maxlength="1000" placeholder="Your verification notes…"></textarea>
      <button id="addNote" class="primary">Add note</button>
    </div>
    <input type="search" id="searchBox" class="search" placeholder="Search notes…">
    <div id="noteList" class="notes"></div>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
