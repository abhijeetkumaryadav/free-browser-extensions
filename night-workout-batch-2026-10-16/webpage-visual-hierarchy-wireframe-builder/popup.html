<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="18" height="7" rx="1"/></svg>
    <div><h1>Wireframe Builder</h1><p>Visual hierarchy overlay</p></div>
  </header>

  <p class="notice">Structural wireframe — shows the page's block layout as labeled boxes. Sizes approximate; page content is never modified.</p>

  <button id="toggle" class="btn primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    <span id="toggleLabel">Build wireframe</span>
  </button>

  <div class="row">
    <label class="check"><input type="checkbox" id="optLabels" checked> Tag labels</label>
    <label class="check"><input type="checkbox" id="optText" checked> Text blocks</label>
  </div>
  <label class="slider">Max boxes <input type="range" id="optMax" min="50" max="600" value="300" step="50"><span id="maxVal">300</span></label>

  <div class="legend">
    <span><i class="sw struct"></i>Layout</span>
    <span><i class="sw head"></i>Headings</span>
    <span><i class="sw media"></i>Media</span>
    <span><i class="sw ctrl"></i>Controls</span>
  </div>

  <p class="status" id="status">Ready — click on any normal web page.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
