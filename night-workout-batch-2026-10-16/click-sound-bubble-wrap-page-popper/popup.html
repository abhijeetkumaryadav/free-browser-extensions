<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bubble Wrap Popper</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="5"/><circle cx="16.5" cy="7.5" r="5.5"/><circle cx="9" cy="16.5" r="5.5"/><circle cx="17" cy="16" r="5"/></svg>
      <h1>Bubble Wrap Popper</h1>
    </div>
    <span class="badge">toy</span>
  </header>

  <p class="notice">
    <svg class="icon sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    Harmless toy. Pops bubbles on a removable overlay — the page itself is never modified.
  </p>

  <label class="toggle">
    <input type="checkbox" id="soundToggle" checked>
    <span class="slider"></span>
    <span class="toggle-label">Pop sounds</span>
  </label>

  <label class="field">
    <span>Bubble size</span>
    <input type="range" id="sizeRange" min="36" max="90" value="56">
  </label>

  <div class="row">
    <button id="startBtn" class="btn primary">
      <svg class="icon sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Pop on this tab
    </button>
    <button id="stopBtn" class="btn">
      <svg class="icon sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Remove
    </button>
  </div>

  <div class="pops">
    <svg class="icon sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    <span>Bubbles popped: <strong id="popCount">0</strong></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
