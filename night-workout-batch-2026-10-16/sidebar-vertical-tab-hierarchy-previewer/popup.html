<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="6" x2="20" y2="6"/><circle cx="12" cy="6" r="1.6" fill="currentColor" stroke="none"/>
        <line x1="6" y1="12" x2="18" y2="12"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
        <line x1="8" y1="18" x2="16" y2="18"/><circle cx="12" cy="18" r="1.6" fill="currentColor" stroke="none"/>
      </svg>
      <div>
        <h1>TabTree</h1>
        <p>Sidebar tab hierarchy previewer</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span id="tabCount">–</span><label>tabs open</label></div>
      <div class="stat"><span id="winCount">–</span><label>windows</label></div>
    </div>
    <button id="openBtn" class="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/>
      </svg>
      Open sidebar
    </button>
    <p class="hint">The sidebar shows every tab grouped by window, then domain — with search, one-click switch and close.</p>
  </div>
<script src="popup.js"></script>
</body>
</html>
