<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Protein &amp; Macro Tracker</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="app-head">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M7 6h10"/><path d="M5 6a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/><path d="M15 6a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/><path d="M7 6v4a5 5 0 0 0 10 0V6"/></svg>
    </div>
    <div class="head-text">
      <h1>Macro Tracker</h1>
      <p class="sub">Log meals, hit your targets</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>You enter the numbers — not medical advice.</span>
  </div>

  <!-- Targets -->
  <section class="card">
    <div class="card-head">
      <h2>Daily targets (g)</h2>
      <button id="toggle-targets" class="link-btn" aria-label="Edit targets">Edit</button>
    </div>
    <div id="targets-view" class="targets-view">
      <div class="t-row"><span>Protein</span><b id="tv-protein">—</b></div>
      <div class="t-row"><span>Carbs</span><b id="tv-carbs">—</b></div>
      <div class="t-row"><span>Fat</span><b id="tv-fat">—</b></div>
    </div>
    <div id="targets-edit" class="targets-edit hidden">
      <label>Protein <input id="in-t-protein" type="number" min="0" max="1000" inputmode="decimal"></label>
      <label>Carbs <input id="in-t-carbs" type="number" min="0" max="1000" inputmode="decimal"></label>
      <label>Fat <input id="in-t-fat" type="number" min="0" max="1000" inputmode="decimal"></label>
      <button id="save-targets" class="primary">Save targets</button>
    </div>
  </section>

  <!-- Progress -->
  <section class="card">
    <div class="card-head">
      <h2>Today</h2>
      <span id="cal-est" class="cal-est">≈ 0 kcal</span>
    </div>
    <div id="bars"></div>
  </section>

  <!-- Log a meal -->
  <section class="card">
    <h2>Log a meal</h2>
    <input id="meal-name" type="text" placeholder="Meal name (e.g. chicken bowl)" maxlength="60">
    <div class="grams">
      <label>P <input id="g-protein" type="number" min="0" max="500" step="0.5" inputmode="decimal" placeholder="0"></label>
      <label>C <input id="g-carbs" type="number" min="0" max="500" step="0.5" inputmode="decimal" placeholder="0"></label>
      <label>F <input id="g-fat" type="number" min="0" max="500" step="0.5" inputmode="decimal" placeholder="0"></label>
    </div>
    <button id="add-meal" class="primary">Add meal</button>
  </section>

  <!-- Meals -->
  <section class="card">
    <div class="card-head">
      <h2>Meals today</h2>
      <button id="clear-day" class="link-btn danger" aria-label="Clear today's meals">Clear</button>
    </div>
    <ul id="meal-list" class="meal-list"></ul>
    <p id="meal-empty" class="empty">No meals logged yet.</p>
  </section>

  <!-- History -->
  <section class="card">
    <div class="card-head">
      <h2>History</h2>
      <button id="clear-history" class="link-btn danger" aria-label="Clear history">Clear</button>
    </div>
    <ul id="hist-list" class="hist-list"></ul>
    <p id="hist-empty" class="empty">Past days will appear here.</p>
  </section>

  <footer class="foot">100% local — nothing leaves your browser.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
