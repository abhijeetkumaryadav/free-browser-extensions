<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Search Launcher</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="brand">
    <span class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4cc9f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18M3 12h18"/></svg>
    </span>
    <div class="title-block">
      <h1>Multi-Search</h1>
      <p class="subtitle">One query, many engines</p>
    </div>
  </header>

  <div class="notice">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
    <span><strong>Launcher only.</strong> This opens search pages in tabs — it does <strong>not</strong> aggregate or scrape results.</span>
  </div>

  <div class="query-wrap">
    <input type="text" id="query" placeholder="Type your search query…" autocomplete="off">
    <button id="launchBtn" class="btn primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 2v6M14 2v6M12 8v13M5 21h14"/></svg>
      Launch <span id="engineCount">0</span>
    </button>
  </div>

  <div class="engines-head">
    <h2>Engines <span id="pickCount" class="badge">0 picked</span></h2>
    <div class="head-links">
      <button id="allBtn" class="link">All</button>
      <button id="noneBtn" class="link">None</button>
    </div>
  </div>
  <div id="engineList" class="engine-list"></div>

  <p class="foot">Engines open as background tabs (no tab stealing). Your engine picks and history stay local.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
