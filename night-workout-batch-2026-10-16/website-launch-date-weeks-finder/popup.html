<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Age Tracker</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="appbar">
  <span class="appicon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
  </span>
  <div>
    <h1>Site Age Tracker</h1>
    <p class="sub">Record launch dates, see ages in weeks &amp; days</p>
  </div>
</header>

<p class="notice">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
  <span><strong>YOUR dates only.</strong> This extension cannot discover real launch dates — every entry is one you recorded yourself.</span>
</p>

<section class="card">
  <h2>Add a site</h2>
  <div class="row">
    <input id="domain" type="text" placeholder="example.com" autocomplete="off" spellcheck="false">
    <input id="launchDate" type="date" aria-label="Launch date">
    <button id="addBtn" class="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add
    </button>
  </div>
  <p id="formErr" class="err" hidden></p>
</section>

<section class="card">
  <div class="listhead">
    <h2>Tracked sites <span id="count" class="count"></span></h2>
    <input id="search" type="search" placeholder="Search domains…" autocomplete="off">
  </div>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty">No sites yet. Add your first launch date above.</p>
</section>

<script src="popup.js"></script>
</body>
</html>
