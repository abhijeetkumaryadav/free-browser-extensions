<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>
    </span>
    <div>
      <h1>Lorem Forge</h1>
      <p class="sub">Placeholder text filler generator</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>Generates filler copy locally — nothing leaves your machine.</span>
  </div>

  <section class="card">
    <div class="field-row">
      <div class="field">
        <label for="mode">Unit</label>
        <select id="mode">
          <option value="paragraphs" selected>Paragraphs</option>
          <option value="sentences">Sentences</option>
          <option value="words">Words</option>
        </select>
      </div>
      <div class="field">
        <label for="count">Count</label>
        <input id="count" type="number" min="1" max="100" value="3" />
      </div>
      <div class="field">
        <label for="flavor">Flavor</label>
        <select id="flavor">
          <option value="classic" selected>Classic lorem</option>
          <option value="startup">Startup ipsum</option>
        </select>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="startClassic" checked /> Start with classic "Lorem ipsum…" opener</label>
    <div class="actions">
      <button id="genBtn" class="primary">Generate</button>
      <button id="copyBtn" class="ghost">Copy</button>
    </div>
  </section>

  <section class="card">
    <p class="label">Preview <span id="stats" class="muted"></span></p>
    <p id="preview" class="preview muted">Press Generate.</p>
  </section>

  <p id="status" class="status" role="status"></p>

  <script src="popup.js"></script>
</body>
</html>
