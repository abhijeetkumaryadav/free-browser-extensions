<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citation Notes Graph</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M10.3 6.9 6.7 16.8M13.7 6.9l3.6 9.9M7.5 19h9"/></svg>
    <div>
      <h1>Citation Notes Graph</h1>
      <p class="sub">My paper network — manual</p>
    </div>
  </header>

  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Your notes — not a live graph. You add every paper and every link yourself.</span>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="graph" role="tab">Graph</button>
    <button class="tab" data-tab="papers" role="tab">Papers</button>
    <button class="tab" data-tab="add" role="tab">+ Add</button>
  </div>

  <!-- Graph tab -->
  <section id="tab-graph" class="panel active">
    <canvas id="graphCanvas" width="348" height="240" aria-label="Your paper network sketch"></canvas>
    <p class="hint">Auto-arranged sketch of the papers you saved and the cite-links you drew. Drag nodes to rearrange.</p>
    <div class="graph-stats">
      <span><strong id="statPapers">0</strong> papers</span>
      <span><strong id="statLinks">0</strong> cite-links</span>
    </div>
  </section>

  <!-- Papers tab -->
  <section id="tab-papers" class="panel">
    <input id="search" type="search" placeholder="Search title, authors, notes…" autocomplete="off">
    <div id="paperList" class="list"></div>
    <div class="row gap">
      <button id="exportBtn" class="btn ghost">Export JSON</button>
      <button id="importBtn" class="btn ghost">Import JSON</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
    <div class="row gap">
      <button id="clearBtn" class="btn danger-ghost">Clear all</button>
    </div>
  </section>

  <!-- Add tab -->
  <section id="tab-add" class="panel">
    <label>Title *
      <input id="fTitle" type="text" maxlength="200" placeholder="Paper title">
    </label>
    <label>Authors
      <input id="fAuthors" type="text" maxlength="200" placeholder="e.g. Smith, J.; Doe, A.">
    </label>
    <div class="row2">
      <label>Year
        <input id="fYear" type="number" min="1800" max="2100" placeholder="2024">
      </label>
      <label>DOI
        <input id="fDoi" type="text" maxlength="100" placeholder="10.1000/xyz">
      </label>
    </div>
    <label>Your note
      <textarea id="fNote" rows="2" maxlength="500" placeholder="Why it matters…"></textarea>
    </label>
    <label>Cites (pick saved papers this one cites)
      <div id="citesBox" class="cites"></div>
    </label>
    <button id="saveBtn" class="btn primary">Save paper</button>
    <p id="formMsg" class="msg" role="status"></p>
  </section>

  <footer>
    <span id="count">0 papers</span>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
