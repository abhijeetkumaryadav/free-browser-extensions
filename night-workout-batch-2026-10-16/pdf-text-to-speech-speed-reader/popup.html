<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text to Speech — Speed Reader</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="head">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.4 9.4 0 0 1 0 13"/></svg>
    <div>
      <h1>Text to Speech</h1>
      <p class="sub">Speed reader &middot; browser TTS</p>
    </div>
  </header>

  <div class="banner" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Browser TTS — text only. No PDF parsing. Voice quality depends on your browser's installed voices.</span>
  </div>

  <div class="card">
    <label class="lbl" for="text">Text to read</label>
    <textarea id="text" rows="6" placeholder="Paste text here, or load a .txt file below…"></textarea>
    <div class="row">
      <label class="filebtn">Load .txt file
        <input type="file" id="file" accept=".txt,text/plain" hidden>
      </label>
      <button id="clear" class="ghost">Clear</button>
      <span id="wordcount" class="meta">0 words</span>
    </div>
  </div>

  <div class="card">
    <div class="row between">
      <label class="lbl" for="voice">Voice</label>
      <span id="voices-note" class="meta"></span>
    </div>
    <select id="voice"><option value="">Default voice</option></select>
  </div>

  <div class="card">
    <div class="row between">
      <label class="lbl" for="rate">Speed: <span id="rateval">1.0&times;</span></label>
      <span id="time" class="meta"></span>
    </div>
    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" aria-label="Speech rate">
    <div class="controls">
      <button id="play" class="primary" aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="pause" class="iconbtn" aria-label="Pause" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button id="resume" class="iconbtn" aria-label="Resume" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button id="stop" class="iconbtn" aria-label="Stop" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
      </button>
    </div>
    <div class="progress">
      <div id="bar" class="bar"></div>
    </div>
    <div class="row between">
      <span id="status" class="meta">Idle</span>
      <span id="progress" class="meta">0 / 0 words</span>
    </div>
    <div id="spoken" class="spoken" aria-live="off"></div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
