<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ping Pong Arcade</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
      </svg>
      <div>
        <h1>Ping Pong Arcade</h1>
        <p class="sub">A tiny toy game on this tab</p>
      </div>
    </div>

    <div class="notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      <span>User-triggered game overlay. The page itself is never modified — close the panel and it is gone.</span>
    </div>

    <label class="field">
      <span class="label">Difficulty</span>
      <div class="seg" id="difficultySeg">
        <button data-diff="easy">Easy</button>
        <button data-diff="medium" class="active">Medium</button>
        <button data-diff="hard">Hard</button>
      </div>
    </label>

    <label class="field">
      <span class="label">Points to win</span>
      <div class="seg" id="pointsSeg">
        <button data-points="3">3</button>
        <button data-points="5" class="active">5</button>
        <button data-points="11">11</button>
      </div>
    </label>

    <button id="toggleBtn" class="primary">Play on this tab</button>
    <div class="stat-row">
      <div class="stat"><span class="stat-label">Best score</span><span class="stat-value" id="bestScore">0</span></div>
      <div class="stat"><span class="stat-label">Wins</span><span class="stat-value" id="wins">0</span></div>
    </div>
    <p class="hint">Move: mouse or &#8592; &#8594;. Space: pause.</p>
  </div>
<script src="popup.js"></script>
</body>
</html>
