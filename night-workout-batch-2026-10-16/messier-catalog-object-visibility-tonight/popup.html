<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messier Visibility Tonight</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="card">
  <header>
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/><circle cx="12" cy="12" r="2.5"/></svg>
      Messier Tonight
    </h1>
    <p class="sub">Visible deep-sky targets for your sky, tonight.</p>
  </header>

  <!-- Location / time settings -->
  <section class="settings">
    <div class="row">
      <label>Lat° <input id="lat" type="number" step="0.01" min="-90" max="90" placeholder="51.5"></label>
      <label>Lon° <input id="lon" type="number" step="0.01" min="-180" max="180" placeholder="-0.1"></label>
    </div>
    <div class="row">
      <label>Night <input id="date" type="date"></label>
      <button id="nowBtn" class="ghost" type="button">Now</button>
    </div>
    <button id="calcBtn" class="primary" type="button">Compute visibility</button>
  </section>

  <!-- Results -->
  <section class="results">
    <div class="summary" id="summary">Set your location, then compute.</div>
    <ul id="objList"></ul>
  </section>

  <footer class="note">Bundled catalog + spherical-astronomy math. Approximate geometry — not weather-aware. Fully local, no network.</footer>
</main>
<script src="popup.js"></script>
</body>
</html>
