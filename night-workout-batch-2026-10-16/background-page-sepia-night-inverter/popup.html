<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <div>
      <h1>Page Tint</h1>
      <p class="sub">Sepia &amp; night inverter</p>
    </div>
  </header>

  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>User-triggered, reversible. Turning off removes every change.</span>
  </div>

  <div class="modes">
    <button class="mode" data-mode="sepia">Sepia</button>
    <button class="mode" data-mode="night">Night</button>
    <button class="mode" data-mode="invert">Invert</button>
  </div>

  <div class="group">
    <label for="strength">Strength</label>
    <input id="strength" type="range" min="20" max="100" step="5" value="80">
    <span id="strengthVal" class="val">80%</span>
  </div>

  <button id="off" class="btn ghost">Turn off</button>
  <p id="status" class="status"></p>
</div>
<script src="popup.js"></script>
</body>
</html>
