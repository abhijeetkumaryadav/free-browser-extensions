<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail Contrast Booster</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="brand">
    <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2.5"/><circle cx="7" cy="16" r="2.5"/></svg></span>
    <div>
      <h1>Thumbnail Booster</h1>
      <p class="tagline">Manual sliders — no AI enhancement</p>
    </div>
  </header>

  <div class="notice">
    You adjust every slider by hand. There is <strong>no automatic "AI enhance"</strong> — just honest local canvas filters.
  </div>

  <section class="card">
    <h2>1 · Image</h2>
    <label class="file-row">Upload thumbnail <input type="file" id="imgFile" accept="image/*"></label>
    <div class="hint" id="imgHint">No image loaded yet.</div>
  </section>

  <section class="card">
    <h2>2 · Adjust</h2>
    <div id="sliders"></div>
    <div class="btnrow">
      <button id="resetBtn" class="ghost">Reset</button>
    </div>
  </section>

  <section class="card">
    <h2>3 · Compare &amp; download</h2>
    <div class="preview-wrap">
      <canvas id="preview"></canvas>
      <div class="compare-bar">
        <button id="showOrig">Hold: original</button>
      </div>
    </div>
    <div class="row">
      <label>Format <select id="format">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp">WebP</option>
      </select></label>
      <label class="q" id="qWrap">Quality <input type="range" id="quality" min="50" max="100" value="92"><span id="qualityVal">92</span></label>
    </div>
    <button id="downloadBtn" class="primary" disabled>Download thumbnail</button>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
