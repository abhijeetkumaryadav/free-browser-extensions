<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="panel">
  <header class="head">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-7-7 18-2.5-7.5L3 11z"/></svg>
    </div>
    <div>
      <h1>Clickbait &amp; Bias Meter</h1>
      <p class="sub">Heuristic headline signals · 100% local</p>
    </div>
  </header>

  <button id="scanBtn" class="primary">Scan this page</button>

  <div id="summary" class="summary hidden">
    <div class="score-wrap">
      <div class="score-ring"><span id="avgScore">–</span></div>
      <div>
        <div id="verdict" class="verdict">–</div>
        <div id="countLine" class="muted">–</div>
      </div>
    </div>
  </div>

  <div id="results" class="results"></div>

  <div id="empty" class="empty muted">Click <b>Scan this page</b> to analyse the headlines on the active tab.</div>

  <footer class="foot">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8b8b93" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Heuristic media-literacy aid only — <b>not a truth verdict</b>. Signals can miss and misfire.</span>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
