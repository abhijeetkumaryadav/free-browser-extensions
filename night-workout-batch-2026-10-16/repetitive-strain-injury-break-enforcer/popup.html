<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break Enforcer</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="card">
  <header class="head">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>
      </svg>
    </div>
    <div>
      <h1>Break Enforcer</h1>
      <p class="sub">Work / break cycle timer</p>
    </div>
  </header>

  <!-- Live status -->
  <section class="status" aria-live="polite">
    <div class="ringwrap" id="ringWrap"></div>
    <div class="phase" id="phaseLabel">Idle</div>
    <div class="clock" id="clock">--:--</div>
    <div class="cycles" id="cycles">0 breaks taken</div>
  </section>

  <!-- Controls -->
  <section class="controls">
    <button id="startBtn" class="btn primary">Start focus cycle</button>
    <button id="stopBtn" class="btn">Stop</button>
  </section>

  <!-- Settings -->
  <section class="settings">
    <label class="row">
      <span>Work block</span>
      <span class="ctl"><input type="number" id="workMinutes" min="5" max="120" step="5" value="25"><span class="unit">min</span></span>
    </label>
    <label class="row">
      <span>Break length</span>
      <span class="ctl"><input type="number" id="breakMinutes" min="1" max="60" step="1" value="5"><span class="unit">min</span></span>
    </label>
    <label class="row check">
      <span>Enforce mode <em>dims page during breaks</em></span>
      <input type="checkbox" id="enforceMode">
    </label>
  </section>

  <p class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    Reminders only — not medical advice.
  </p>
</main>
<script src="popup.js"></script>
</body>
</html>
