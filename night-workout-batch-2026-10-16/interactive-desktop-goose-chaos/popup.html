<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16c2-4 6-6 10-6h3l3-2 1 3-2 2c1 3-1 6-4 6H9c-3 0-5-1-5-3z"/>
        <circle cx="19.5" cy="9.5" r="0.6" fill="currentColor"/>
        <path d="M8 16v3M12 16v3"/>
      </svg>
    </div>
    <div>
      <h1>Goose Chaos</h1>
      <div class="sub">Harmless prank goose · 100% reversible</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="summonBtn">Summon Goose</button>
    <button class="btn ghost" id="dismissBtn">Dismiss</button>
  </div>

  <div class="group">
    <div class="label">Mischief level</div>
    <div class="row">
      <input type="range" id="mischief" min="1" max="3" step="1" value="2" aria-label="Mischief level">
      <span class="val" id="mischiefVal">2</span>
    </div>
    <div class="hint" id="mischiefHint">1 = wander &amp; honk · 2 = + nudges page elements · 3 = + chases your cursor</div>
  </div>

  <div class="group">
    <label class="check"><input type="checkbox" id="honkToggle" checked><span class="box"></span>Honk popups</label>
    <label class="check"><input type="checkbox" id="chaseToggle" checked><span class="box"></span>Cursor chasing (level 3)</label>
  </div>

  <button class="btn ghost wide" id="honkNowBtn">Honk now (sound)</button>

  <div class="footer">Sound plays only when you click Honk — never autoplays.<br>Dismiss removes the goose and restores everything.</div>
</div>
<script src="popup.js"></script>
</body>
</html>
