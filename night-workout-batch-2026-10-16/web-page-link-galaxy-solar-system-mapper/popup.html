<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Galaxy</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <svg class="hicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/>
  </svg>
  <div>
    <h1>Link Galaxy</h1>
    <p class="sub">Your saved links as a solar system</p>
  </div>
</header>

<div class="banner">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>
  </svg>
  <span>Your links only — nothing here extracts links from web pages.</span>
</div>

<canvas id="galaxy" width="348" height="220" aria-label="Galaxy canvas: your links orbit a star"></canvas>
<p class="hint">Click a planet to open its page.</p>

<section class="add">
  <h2>Add a link</h2>
  <input id="titleIn" type="text" placeholder="Title" maxlength="80">
  <input id="urlIn" type="url" placeholder="https://example.com">
  <button id="addBtn">Add to galaxy</button>
  <p id="err" class="err" hidden></p>
</section>

<section class="list">
  <h2>Your planets <span id="count" class="pill">0</span></h2>
  <input id="searchIn" type="search" placeholder="Search titles…">
  <ul id="linkList"></ul>
</section>

<script src="popup.js"></script>
</body>
</html>
