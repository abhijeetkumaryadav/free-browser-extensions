<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Side Panel Demo</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
    <h1>Side Panel Demo</h1>
  </header>
  <p class="notice">Uses the <strong>stable</strong> <code>chrome.sidePanel</code> API — not an experimental API. Opens a persistent panel with your notes &amp; bookmarks.</p>
  <button id="openBtn" class="btn primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
    Open side panel
  </button>
  <div id="status" class="status" aria-live="polite"></div>
<script src="popup.js"></script>
</body>
</html>
