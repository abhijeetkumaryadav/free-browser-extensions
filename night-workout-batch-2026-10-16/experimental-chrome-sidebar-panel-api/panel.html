<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Side Panel — Notes &amp; Bookmarks</title>
<link rel="stylesheet" href="popup.css">
</head>
<body class="panel">
  <header class="bar">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
    <h1>My Side Panel</h1>
  </header>
  <p class="notice">Stable <strong>chrome.sidePanel</strong> demo — not experimental. Everything here is stored locally.</p>

  <div class="tabs">
    <button class="tab active" data-tab="notes">Notes</button>
    <button class="tab" data-tab="bookmarks">Bookmarks</button>
  </div>

  <section id="notesPane">
    <h2>Quick notes</h2>
    <div class="note-form">
      <input type="text" id="noteTitle" maxlength="80" placeholder="Note title">
      <textarea id="noteBody" placeholder="Write a note…"></textarea>
      <button id="addNoteBtn" class="btn small">Add note</button>
    </div>
    <div style="height:8px"></div>
    <div id="notesList" class="list"></div>
  </section>

  <section id="bookmarksPane" hidden>
    <h2>Bookmarks</h2>
    <div class="note-form">
      <input type="text" id="bmTitle" maxlength="80" placeholder="Bookmark title">
      <input type="text" id="bmUrl" placeholder="https://example.com">
      <button id="addBmBtn" class="btn small">Save current tab</button>
      <button id="addBmManualBtn" class="btn small ghost">Save typed URL</button>
    </div>
    <div style="height:8px"></div>
    <div id="bmList" class="list"></div>
  </section>

<script src="panel.js"></script>
</body>
</html>
