<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prop Swap</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c4-1 5-6 9-6s5 5 9 4"/><path d="M4 17c1 2 3 3 6 3h10"/></svg>
    <div>
      <h1>Prop Swap</h1>
      <p class="tag">household substitutes for yoga props</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Reference list only — not coaching. Test substitutes for stability before use.</span>
  </div>

  <div class="search-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Search props or substitutes…" autocomplete="off">
  </div>

  <div id="list" class="list"></div>
  <p id="empty" class="empty hidden">No matches — try "strap", "block" or "blanket".</p>
</div>
<script src="popup.js"></script>
</body>
</html>
