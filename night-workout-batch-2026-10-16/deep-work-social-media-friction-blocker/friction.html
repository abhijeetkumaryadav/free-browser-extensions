<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Take a breath — Deep Work</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d0d12;
    color: #f1f1f4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .panel {
    background: rgba(20, 20, 26, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 40px;
    max-width: 460px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
    background: rgba(167, 139, 250, 0.15);
    display: flex; align-items: center; justify-content: center;
  }
  .icon svg { width: 32px; height: 32px; color: #a78bfa; }
  h1 { font-size: 22px; margin-bottom: 10px; }
  p { font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 8px; }
  .target { font-size: 13px; color: #a78bfa; word-break: break-all; margin-bottom: 24px; }
  .countdown { font-size: 48px; font-weight: 700; color: #a78bfa; margin: 16px 0 24px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  button {
    padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #proceed {
    background: #a78bfa; color: #14141a; border: none;
  }
  #proceed:disabled { opacity: 0.35; cursor: not-allowed; }
  #goBack {
    background: rgba(255,255,255,0.06); color: #f1f1f4; border: 1px solid rgba(255,255,255,0.1);
  }
  .note { font-size: 11px; color: #71717a; margin-top: 16px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2"/><path d="M17.73 7.73A2.5 2.5 0 1 1 19.5 12H2"/><path d="M12.59 19.41A2 2 0 1 0 14 16H2"/></svg>
    </div>
    <h1>Breathe. Do you really want this?</h1>
    <p>You're in a focus session. This is a 10-second pause — not a lock. Sit with the urge for a moment.</p>
    <div class="target" id="targetLabel"></div>
    <div class="countdown" id="countdown">10</div>
    <div class="actions">
      <button id="proceed" disabled>Wait for the pause to end…</button>
      <button id="goBack">Take me back to work</button>
    </div>
    <p class="note">This pause is controlled entirely by you — end the focus session anytime from the extension popup.</p>
  </div>
  <script src="friction.js"></script>
</body>
</html>
