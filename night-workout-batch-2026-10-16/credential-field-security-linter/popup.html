<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CredLint</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="head">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    </span>
    <div>
      <h1>CredLint</h1>
      <p class="sub">Credential field security audit</p>
    </div>
  </header>

  <div class="privacy-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>Read-only audit. It never reads, stores, or transmits anything you type into these fields.</span>
  </div>

  <button id="scanBtn" class="primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    Scan this page
  </button>

  <div id="status" class="status hidden"></div>

  <div id="summary" class="summary hidden">
    <div class="chip err"><span id="errCount">0</span><label>errors</label></div>
    <div class="chip warn"><span id="warnCount">0</span><label>warnings</label></div>
    <div class="chip note"><span id="noteCount">0</span><label>notices</label></div>
  </div>

  <div class="filters hidden" id="filters">
    <button data-f="all" class="active">All</button>
    <button data-f="error">Errors</button>
    <button data-f="warning">Warnings</button>
    <button data-f="notice">Notices</button>
  </div>

  <ul id="issues" class="issues"></ul>

  <div class="actions hidden" id="actions">
    <button id="copyBtn" class="ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy report
    </button>
    <button id="clearBtn" class="ghost">Clear</button>
  </div>

  <footer class="foot">Defensive tool · analyzes page structure only · no credentials leave the page</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
