<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Diaphragmatic Breath Metronome</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="hdr">
      <!-- Lucide-style wind/lungs icon (outline stroke) -->
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.59 4.59A2 2 0 1 1 11 8H2"/><path d="M12.59 19.41A2 2 0 1 0 14 16H2"/><path d="M17.73 7.73A2.5 2.5 0 1 1 19.5 12H2"/>
      </svg>
      <div>
        <h1>Breath Metronome</h1>
        <p class="sub">Diaphragmatic pacing aid</p>
      </div>
    </header>

    <div class="notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span>Pacing aid only — not medical advice. Breathe comfortably; stop if dizzy.</span>
    </div>

    <!-- Phase display -->
    <section class="stage">
      <div id="phaseLabel" class="phase-label idle">Ready</div>
      <div id="phaseCount" class="phase-count">–</div>
      <div class="ball-wrap">
        <div id="ball" class="ball"></div>
      </div>
    </section>

    <!-- Session timer -->
    <section class="row stats">
      <div class="stat"><span class="stat-label">Session</span><span id="sessionTime" class="stat-val">0:00</span></div>
      <div class="stat"><span class="stat-label">Breaths</span><span id="breathCount" class="stat-val">0</span></div>
    </section>

    <!-- Controls -->
    <section class="controls">
      <label class="ctl">
        <span>Breaths / min <b id="bpmVal">6</b></span>
        <input id="bpm" type="range" min="3" max="20" value="6" aria-label="Breaths per minute">
      </label>
      <label class="ctl">
        <span>Session length <b id="durVal">5 min</b></span>
        <input id="duration" type="range" min="1" max="30" value="5" aria-label="Session length in minutes">
      </label>
      <label class="ctl">
        <span>Inhale share <b id="inhaleVal">40%</b></span>
        <input id="inhaleShare" type="range" min="20" max="80" value="40" aria-label="Inhale share of breath cycle">
      </label>
      <label class="ctl check">
        <input id="tickEnabled" type="checkbox" checked>
        <span>Tick on each phase change</span>
      </label>
    </section>

    <div class="actions">
      <button id="startBtn" class="primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        Start
      </button>
      <button id="stopBtn" class="ghost" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        Stop
      </button>
    </div>
  </div>
<script src="popup.js"></script>
</body>
</html>
