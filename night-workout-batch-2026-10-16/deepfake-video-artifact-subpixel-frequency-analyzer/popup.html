<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deepfake Red-Flag Guide</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
    <div>
      <h1>Deepfake Red-Flag Guide</h1>
      <p class="sub">video-forgery red flags + your notes</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <span><strong>Educational only — not detection.</strong> No video is analyzed. These are the red flags researchers describe; you decide.</span>
  </div>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Red flags to check</h2>
    <div id="flags" class="flags"></div>
  </section>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Your verification notes</h2>
    <div class="form">
      <input id="noteTitle" type="text" maxlength="120" placeholder="Video / claim you checked…">
      <textarea id="noteBody" rows="2" maxlength="2000" placeholder="What you checked, which flags you saw, your conclusion…"></textarea>
      <button id="addNote" class="btn">Save note</button>
    </div>
    <input id="search" type="text" placeholder="Search your notes…">
    <ul id="notes" class="notes"></ul>
    <div class="row">
      <button id="clearAll" class="btn ghost">Clear all</button>
    </div>
  </section>

  <footer class="foot">Nothing leaves your browser. No analysis happens here.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
