<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Context Chunker</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header class="header">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="9" y1="13" x2="15" y2="13"/>
      <line x1="9" y1="17" x2="13" y2="17"/>
    </svg>
    <div>
      <h1>Context Chunker</h1>
      <p class="subtitle">Split long text for AI prompts</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>Prepares text for AI — not an AI tool. Token counts are 4-char heuristic estimates.</span>
  </div>

  <label class="field-label" for="input">Text to chunk</label>
  <textarea id="input" rows="6" placeholder="Paste your long text here…"></textarea>

  <div class="controls">
    <div class="control">
      <label for="chunkSize">Chunk size <span id="chunkSizeVal">1500</span> chars</label>
      <input type="range" id="chunkSize" min="200" max="8000" step="100" value="1500">
    </div>
    <div class="control">
      <label for="overlap">Overlap <span id="overlapVal">150</span> chars</label>
      <input type="range" id="overlap" min="0" max="2000" step="50" value="150">
    </div>
    <div class="control row">
      <input type="checkbox" id="breakWords">
      <label for="breakWords" class="inline">Allow mid-word splits</label>
    </div>
  </div>

  <button id="chunkBtn" class="primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
    Split into chunks
  </button>

  <div id="summary" class="summary hidden"></div>
  <div id="chunks"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
