<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
<title>Medication Schedule</title>
</head>
<body>
<h1>
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="9" width="18" height="7" rx="3.5"/><line x1="12" y1="9" x2="12" y2="16"/></svg>
  Medication Schedule
</h1>

<div class="banner">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
  <span><strong>Not medical advice — follow your doctor's prescription.</strong> This extension only reminds you of schedules <em>you</em> enter. It never suggests doses or schedules.</span>
</div>

<div class="card">
  <h2>Add medication</h2>
  <div class="row">
    <input id="med-name" type="text" placeholder="Medication name" maxlength="60">
  </div>
  <div class="row">
    <input id="med-dose" type="text" placeholder="Dose (e.g. 500 mg)" maxlength="30">
    <select id="med-freq" title="Times per day">
      <option value="1">1× / day</option>
      <option value="2" selected>2× / day</option>
      <option value="3">3× / day</option>
      <option value="4">4× / day</option>
    </select>
  </div>
  <div class="row">
    <input id="med-times" type="text" placeholder="Times, e.g. 08:00, 20:00" maxlength="60">
  </div>
  <button id="add-btn">Add medication</button>
</div>

<div class="card">
  <h2>Today's doses</h2>
  <div id="today-list"></div>
</div>

<div class="stats">
  <div class="stat"><div class="n" id="stat-taken">0</div><div class="l">taken today</div></div>
  <div class="stat"><div class="n" id="stat-streak">0</div><div class="l">day streak</div></div>
  <div class="stat"><div class="n" id="stat-total">0</div><div class="l">total check-offs</div></div>
</div>

<script src="popup.js"></script>
</body>
</html>
