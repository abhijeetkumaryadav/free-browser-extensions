<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Latency Tester</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></div>
    <div>
      <h1>Page Latency Tester</h1>
      <p class="sub">Fetch round-trip timing, measured locally</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Measures <strong>load latency</strong> — not DNS propagation. Browsers don't expose DNS timing to extensions.</span>
  </div>

  <div class="row">
    <input id="urlInput" type="text" placeholder="https://example.com" aria-label="URL to test" spellcheck="false">
    <button id="testBtn" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      Test
    </button>
  </div>

  <div class="result" id="resultBox" hidden>
    <div class="big" id="bigMs">—</div>
    <div class="big-label" id="bigLabel">last round-trip</div>
    <dl class="breakdown">
      <div><dt>Total round-trip</dt><dd id="rTotal">—</dd></div>
      <div><dt>Status</dt><dd id="rStatus">—</dd></div>
      <div><dt>Resource timing detail</dt><dd id="rDetail">—</dd></div>
    </dl>
  </div>

  <h2>History</h2>
  <div class="chart" id="chart" aria-label="Latency history chart"></div>
  <div class="foot-row">
    <span class="foot" id="histLabel">No tests yet.</span>
    <button id="clearBtn" class="link">Clear</button>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
