<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rest Timer</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header class="head">
    <!-- Lucide-style timer outline icon -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>
    <div>
      <h1>Rest Timer</h1>
      <p class="sub">Timer only — no coaching, no advice.</p>
    </div>
  </header>

  <div class="ring-wrap">
    <svg viewBox="0 0 160 160" class="ring">
      <circle cx="80" cy="80" r="70" class="track"/>
      <circle cx="80" cy="80" r="70" class="prog" id="prog"/>
    </svg>
    <div class="time" id="time">1:30</div>
  </div>

  <div class="presets" id="presets">
    <button data-sec="60">60s</button>
    <button data-sec="90" class="active">90s</button>
    <button data-sec="120">120s</button>
    <button data-sec="180">180s</button>
  </div>

  <div class="custom">
    <input type="number" id="customSec" min="1" max="3600" value="90" aria-label="Custom seconds">
    <span>s</span>
  </div>

  <div class="row">
    <button id="startStop" class="primary">Start</button>
    <button id="reset" class="ghost">Reset</button>
  </div>

  <p class="note">Chime plays when the timer ends. Countdown keeps running if you close this popup.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
