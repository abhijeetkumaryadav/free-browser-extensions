<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Droplet</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7S6.5 10.4 6.5 14.5a5.5 5.5 0 0 0 11 0C17.5 10.4 12 2.7 12 2.7z"/></svg>
    <div>
      <h1>Droplet</h1>
      <p class="tag">gamified water intake logger</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>You log your own intake — not medical advice. Set a goal that suits you.</span>
  </div>

  <div class="droplet-wrap">
    <svg class="droplet" viewBox="0 0 120 140">
      <defs>
        <clipPath id="dropclip"><path d="M60 6C60 6 22 62 22 96a38 38 0 0 0 76 0C98 62 60 6 60 6z"/></clipPath>
      </defs>
      <path d="M60 6C60 6 22 62 22 96a38 38 0 0 0 76 0C98 62 60 6 60 6z" class="drop-outline"/>
      <g clip-path="url(#dropclip)">
        <rect id="fill" x="0" y="140" width="120" height="140" class="drop-fill"/>
      </g>
    </svg>
    <div class="droplet-stats">
      <div class="big"><span id="todayMl">0</span><small>ml</small></div>
      <div class="goal">of <span id="goalMl">2000</span> ml</div>
      <div class="pct" id="pct">0%</div>
    </div>
  </div>

  <div class="row">
    <div class="stat"><span class="v" id="streak">0</span><span class="k">day streak</span></div>
    <div class="stat"><span class="v" id="glasses">0</span><span class="k">glasses today</span></div>
    <div class="stat"><span class="v" id="avg">0</span><span class="k">ml avg / 14d</span></div>
  </div>

  <div class="controls">
    <label class="field">Glass size
      <select id="glassSize">
        <option value="200">200 ml</option>
        <option value="250" selected>250 ml</option>
        <option value="350">350 ml</option>
        <option value="500">500 ml</option>
      </select>
    </label>
    <button id="addBtn" class="primary">+ Log a glass</button>
  </div>
  <button id="undoBtn" class="ghost hidden">Undo last glass</button>

  <details class="settings">
    <summary>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </summary>
    <label class="field">Daily goal (ml)
      <input id="goalInput" type="number" min="250" max="10000" step="50">
    </label>
    <button id="saveGoal" class="secondary">Save goal</button>
    <button id="clearToday" class="ghost danger">Clear today's log</button>
  </details>

  <div class="history">
    <h2>Last 14 days</h2>
    <div id="history" class="history-list"></div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
