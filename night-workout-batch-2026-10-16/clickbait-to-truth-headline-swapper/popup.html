<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Headline Calmer</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="brand">
    <svg class="brand-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    <div>
      <h1>Headline Calmer</h1>
      <p class="tagline">Clickbait → neutral rewording</p>
    </div>
  </header>

  <p class="banner" role="note">
    <strong>Rewording aid only.</strong> This does <strong>not</strong> verify truth or fact-check claims — it only calms sensational language. Everything runs locally.
  </p>

  <label class="field-label" for="input">Paste a headline</label>
  <textarea id="input" rows="3" placeholder="SHOCKING! You won't believe what happened next!!!"></textarea>

  <div class="row">
    <button id="grab" class="btn ghost" title="Pull the page's main headline (h1) into the box">Grab page headline</button>
    <button id="calm" class="btn primary">Calm it down</button>
  </div>

  <label class="field-label" for="output">Neutral rewording <span class="hint">(editable — copy when happy)</span></label>
  <textarea id="output" rows="3" placeholder="Your calmed headline appears here…"></textarea>

  <div class="row">
    <button id="copy" class="btn ghost">Copy rewording</button>
    <button id="clear" class="btn ghost">Clear</button>
  </div>

  <section class="changes">
    <h2>What changed</h2>
    <ul id="changes"><li class="empty">No changes yet.</li></ul>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
