<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progressive Overload Logger</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3 9v6"/><path d="M21 9v6"/><path d="M6.5 12h11"/></svg>
    <h1>Overload Logger</h1>
    <button id="unit-toggle" class="unit-btn" title="Toggle kg/lb">kg</button>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>Your personal logbook — <strong>not coaching advice</strong>. Estimates only; lift safely.</span>
  </div>

  <!-- Log-a-set form -->
  <section class="card">
    <h2>Log a set</h2>
    <div class="form-grid">
      <label class="field wide">
        <span>Exercise</span>
        <input id="ex-name" type="text" list="ex-list" placeholder="e.g. Bench Press" autocomplete="off">
        <datalist id="ex-list"></datalist>
      </label>
      <label class="field">
        <span>Weight</span>
        <input id="ex-weight" type="number" min="0" step="0.5" placeholder="60">
      </label>
      <label class="field">
        <span>Reps</span>
        <input id="ex-reps" type="number" min="1" step="1" placeholder="8">
      </label>
      <label class="field wide">
        <span>Date</span>
        <input id="ex-date" type="date">
      </label>
    </div>
    <button id="add-set" class="btn primary">Log set</button>
  </section>

  <!-- Exercise picker + PRs -->
  <section class="card">
    <h2>Exercise</h2>
    <select id="ex-picker"></select>
    <div id="pr-badges" class="badges"></div>
  </section>

  <!-- Volume chart -->
  <section class="card">
    <h2>Volume per session</h2>
    <canvas id="volume-chart" width="348" height="120"></canvas>
    <p id="chart-hint" class="hint">No sessions yet — log some sets to see your volume trend.</p>
  </section>

  <!-- Set history -->
  <section class="card">
    <h2>Set history</h2>
    <div id="history" class="history"></div>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
