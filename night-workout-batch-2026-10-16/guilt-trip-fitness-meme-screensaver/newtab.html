<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<main class="stage">
  <div class="card" id="card">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <p class="kicker" id="kicker">A gentle nudge</p>
    <blockquote id="quote">Loading…</blockquote>
    <p class="prompt" id="prompt"></p>
    <div class="actions">
      <button id="new">New quote</button>
    </div>
  </div>
  <details class="settings">
    <summary>Settings</summary>
    <label class="row"><span>Enable idle motivation</span><input type="checkbox" id="enabled"></label>
    <label class="row"><span>Idle threshold (min)</span><input type="number" id="idleMinutes" min="5" max="120"></label>
  </details>
  <p class="notice">Motivational reminders only — never shaming. Not medical advice.</p>
</main>
<script src="newtab.js"></script>
</body>
</html>
