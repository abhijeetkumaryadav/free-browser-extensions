<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
<title>FOV Matrix</title>
</head>
<body>
<div class="card">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21"/></svg>
    <div>
      <h1>FOV Matrix</h1>
      <p class="sub">Telescope field-of-view calculator</p>
    </div>
  </header>

  <section class="form">
    <h2>Setup</h2>
    <label>Name <input id="name" type="text" placeholder="e.g. 80mm f/6 + DSLR" maxlength="40"></label>
    <div class="two">
      <label>Focal length (mm) <input id="fl" type="number" min="1" max="10000" value="600"></label>
      <label>Aperture (mm, optional) <input id="ap" type="number" min="1" max="2000" placeholder="80"></label>
    </div>
    <div class="two">
      <label>Sensor width (mm) <input id="sw" type="number" min="0.1" step="0.1" value="23.5"></label>
      <label>Sensor height (mm) <input id="sh" type="number" min="0.1" step="0.1" value="15.6"></label>
    </div>
    <label>Eyepiece focal (mm, optional — for magnification) <input id="ep" type="number" min="1" max="100" placeholder="25"></label>
    <div class="results" id="results"></div>
    <button id="save" class="primary">Save setup</button>
  </section>

  <section>
    <h2>Comparison matrix</h2>
    <div id="matrix" class="matrix"></div>
    <button id="clear" class="ghost danger">Clear all setups</button>
  </section>

  <p class="notice">Textbook optics math: FOV = 2·arctan(d / 2f). Idealized — ignores distortion and vignetting.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
