<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab Constellation Map</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="head">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="4" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="8" r="1.4" fill="currentColor" stroke="none"/><circle cx="8" cy="14" r="1.4" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.4" fill="currentColor" stroke="none"/><path d="M6.3 6.6 10.7 4.6M13.3 4.8 17.7 7.4M6.2 7.3l1.3 5.2M17.8 9.3l-1.1 5.2M9.3 14.2l5.3 1.2"/></svg>
    </span>
    <div>
      <h1>Tab Constellation</h1>
      <p class="sub">Your open tabs as a star map</p>
    </div>
    <button id="refresh" class="iconbtn" title="Refresh">⟳</button>
  </header>

  <p class="banner">Cosmetic only — click a star to focus its tab. Tabs are never modified, closed, or rearranged.</p>

  <section class="card">
    <canvas id="sky" width="324" height="300" aria-label="Tab constellation map"></canvas>
    <div class="legend" id="legend"></div>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
