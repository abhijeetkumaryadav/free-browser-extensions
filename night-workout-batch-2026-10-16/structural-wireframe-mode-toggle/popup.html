<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframe Mode</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
    <div>
      <h1>Wireframe Mode</h1>
      <p class="sub">Outlines every element with tag + size labels. Read-only analysis — the page is restored exactly when toggled off.</p>
    </div>
  </header>

  <div class="toggle-row">
    <span>Wireframe this tab</span>
    <button id="toggle" class="switch" role="switch" aria-checked="false"><span class="knob"></span></button>
  </div>

  <label class="check"><input type="checkbox" id="optLabels" checked> Tag-name labels</label>
  <label class="check"><input type="checkbox" id="optDims" checked> Dimension labels (w×h)</label>

  <div class="stat-row">
    <div class="stat"><span class="label">Outlined elements</span><span class="value" id="elCount">–</span></div>
  </div>

  <p class="hint">One injected stylesheet + temporary label badges. Toggle off (or close the tab) removes everything — zero page changes remain.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
