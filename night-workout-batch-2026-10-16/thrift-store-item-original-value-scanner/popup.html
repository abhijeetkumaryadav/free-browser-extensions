<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThriftValue — Thrift Find Logbook</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <div>
        <h1>ThriftValue</h1>
        <p class="tagline">Thrift find logbook</p>
      </div>
    </div>
    <button class="icon-btn" id="export-btn" title="Export CSV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
    </button>
  </header>

  <!-- Honest scope notice -->
  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>Your guesses only — <b>not</b> a live price lookup. "Original value" is the estimate <b>you</b> type in.</span>
  </div>

  <!-- Stats -->
  <section class="stats">
    <div class="stat hero">
      <p class="stat-label">Total saved</p>
      <p class="stat-value" id="stat-saved">$0.00</p>
      <p class="stat-sub" id="stat-saved-sub">0% off retail</p>
    </div>
    <div class="stat-row">
      <div class="stat">
        <p class="stat-label">Paid</p>
        <p class="stat-value sm" id="stat-paid">$0.00</p>
      </div>
      <div class="stat">
        <p class="stat-label">Est. retail</p>
        <p class="stat-value sm" id="stat-retail">$0.00</p>
      </div>
      <div class="stat">
        <p class="stat-label">Finds</p>
        <p class="stat-value sm" id="stat-count">0</p>
      </div>
    </div>
  </section>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="log">Log a find</button>
    <button class="tab" data-tab="collection">Collection</button>
  </div>

  <!-- Log tab -->
  <div class="tab-pane active" id="pane-log">
    <section class="card">
      <label class="field">
        <span>Item name</span>
        <input type="text" id="f-name" placeholder="e.g. Vintage denim jacket" maxlength="80">
      </label>
      <div class="field-grid">
        <label class="field">
          <span>Paid ($)</span>
          <input type="number" id="f-paid" placeholder="8.00" min="0" step="0.01">
        </label>
        <label class="field">
          <span>Your est. original ($)</span>
          <input type="number" id="f-original" placeholder="120.00" min="0" step="0.01">
        </label>
      </div>
      <div class="field-grid">
        <label class="field">
          <span>Category</span>
          <select id="f-category">
            <option>Clothing</option>
            <option>Shoes</option>
            <option>Accessories</option>
            <option>Home goods</option>
            <option>Books & media</option>
            <option>Electronics</option>
            <option>Furniture</option>
            <option>Other</option>
          </select>
        </label>
        <label class="field">
          <span>Store (optional)</span>
          <input type="text" id="f-store" placeholder="Goodwill Elm St" maxlength="60">
        </label>
      </div>
      <label class="field">
        <span>Notes (optional)</span>
        <input type="text" id="f-notes" placeholder="Size M, great condition" maxlength="140">
      </label>
      <div class="live-math" id="live-math">Enter paid + estimated original to see the margin.</div>
      <button class="btn primary full" id="add-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Log this find
      </button>
    </section>
  </div>

  <!-- Collection tab -->
  <div class="tab-pane" id="pane-collection">
    <div class="toolbar">
      <select id="sort-select">
        <option value="newest">Newest first</option>
        <option value="savings">Biggest savings</option>
        <option value="margin">Best margin %</option>
        <option value="paid">Highest paid</option>
      </select>
      <button class="btn ghost sm" id="clear-btn">Clear all</button>
    </div>
    <div id="item-list" class="list"></div>
  </div>

  <footer class="footer">All data stays in this browser · v1.0.0</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
