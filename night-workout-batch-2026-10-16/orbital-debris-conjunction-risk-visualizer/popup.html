<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="notice"><strong>Simplified model.</strong> This is an educational demo of conjunction math — <strong>not</strong> a real collision assessment. Real conjunction analysis uses full covariance propagation.</div>
  <div class="card">
    <h1><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20Z"/><path d="M2 12h20"/></svg> Conjunction Risk</h1>
  </div>
  <div class="card">
    <h2>Encounter parameters</h2>
    <div class="row">
      <div><label for="miss">Miss distance (km)</label><input id="miss" type="number" min="0.001" step="0.1" value="2"></div>
      <div><label for="vel">Rel. velocity (km/s)</label><input id="vel" type="number" min="0.1" step="0.1" value="11"></div>
    </div>
    <div class="row">
      <div><label for="size1">Object 1 size (m)</label><input id="size1" type="number" min="0.01" step="0.1" value="4"></div>
      <div><label for="size2">Object 2 size (m)</label><input id="size2" type="number" min="0.01" step="0.1" value="1"></div>
    </div>
    <button id="calc">Compute risk score</button>
  </div>
  <div class="card" id="resultCard" style="display:none">
    <h2>Result</h2>
    <div class="score" id="score">–</div>
    <div><span class="band" id="band">–</span></div>
    <div class="explain" id="explain"></div>
    <canvas class="viz" id="viz" width="340" height="180"></canvas>
  </div>
  <footer>Conjunction Risk Visualizer v1.0.0 — educational demo, not a real assessment.</footer>
  <script src="popup.js"></script>
</body></html>
