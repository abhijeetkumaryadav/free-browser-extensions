<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signature Formatter</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="7" y1="14" x2="11" y2="14"/></svg>
    </div>
    <div>
      <h1>Signature Formatter</h1>
      <p class="sub">Markdown &amp; plain-text email signatures</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>Markdown / plain text only — not HTML signatures. Everything stays local.</span>
  </div>

  <section class="fields">
    <div class="row">
      <label>Name<input id="fName" type="text" placeholder="Jane Doe"></label>
      <label>Role<input id="fRole" type="text" placeholder="Product Designer"></label>
    </div>
    <div class="row">
      <label>Company<input id="fCompany" type="text" placeholder="Acme Inc."></label>
      <label>Phone<input id="fPhone" type="text" placeholder="+1 555 0100"></label>
    </div>
    <label>Email<input id="fEmail" type="email" placeholder="jane@example.com"></label>
    <label>Website<input id="fSite" type="url" placeholder="https://example.com"></label>
    <label>Socials <span class="hint">(one per line: Label, URL)</span>
      <textarea id="fSocials" rows="3" placeholder="LinkedIn, https://linkedin.com/in/jane&#10;X, https://x.com/jane"></textarea>
    </label>
    <label class="checkline"><input id="fDivider" type="checkbox" checked> <span>Add divider line (<code>--</code>)</span></label>
  </section>

  <section class="tabs">
    <button id="tabMd" class="tab active">Markdown</button>
    <button id="tabTxt" class="tab">Plain text</button>
  </section>

  <section class="preview">
    <pre id="previewOut"></pre>
  </section>

  <section class="actions">
    <button id="copyBtn" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy shown format
    </button>
    <button id="resetBtn" class="btn ghost">Reset</button>
  </section>

  <footer><span id="status">Draft autosaves locally.</span></footer>
</div>
<script src="popup.js"></script>
</body>
</html>
