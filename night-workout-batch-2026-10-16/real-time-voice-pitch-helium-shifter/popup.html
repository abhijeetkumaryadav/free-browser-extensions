<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helium Shifter — Offline Pitch &amp; Speed</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h2l3-8 4 16 3-10 2 2h6"/></svg>
    <div>
      <h1>Helium Shifter</h1>
      <p class="sub">Offline pitch &amp; speed shifter</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span><strong>Offline file processing only.</strong> Not real-time — no mic capture. Your file never leaves this machine.</span>
  </div>

  <label class="filebtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
    <span id="fileLabel">Choose an audio file…</span>
    <input type="file" id="fileInput" accept="audio/*" hidden>
  </label>

  <div class="controls">
    <div class="ctl">
      <div class="ctl-head">
        <label for="pitch">Pitch shift</label>
        <span id="pitchVal">+0.0 st</span>
      </div>
      <input type="range" id="pitch" min="-12" max="12" step="0.5" value="0">
    </div>
    <div class="ctl">
      <div class="ctl-head">
        <label for="rate">Speed</label>
        <span id="rateVal">1.00×</span>
      </div>
      <input type="range" id="rate" min="0.5" max="2" step="0.05" value="1">
    </div>
  </div>

  <div class="row">
    <button id="previewBtn" class="btn ghost" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 4l14 8-14 8z"/></svg>
      Preview
    </button>
    <button id="stopBtn" class="btn ghost" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      Stop
    </button>
  </div>
  <button id="exportBtn" class="btn primary" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    Render &amp; download WAV
  </button>
  <div class="status" id="status">No file loaded.</div>
  <a id="dl" hidden></a>
</div>
<script src="popup.js"></script>
</body>
</html>
