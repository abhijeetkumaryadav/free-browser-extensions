<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="popup.css" />
<title>Frame-by-Frame GIF Converter</title>
</head>
<body>
<div class="card">
  <header class="head">
    <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/></svg></span>
    <div>
      <h1>Frame-by-Frame GIF</h1>
      <p class="sub">Upload a video, scrub it, export a GIF — all on your device.</p>
    </div>
  </header>

  <p class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nicon"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Local toy encoder: 256-color palette, short clips only. Your video never leaves this machine.</span>
  </p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="video/*" hidden />
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    <span>Drop a video here or click to choose</span>
    <small id="fileName">No video loaded</small>
  </label>

  <div class="preview-wrap hidden" id="stageWrap">
    <canvas id="stage" width="336" height="189"></canvas>
    <div class="scrub-row">
      <button class="btn ghost" id="prevFrame" title="Previous frame">◀</button>
      <input type="range" id="scrub" min="0" max="100" step="0.01" value="0" />
      <button class="btn ghost" id="nextFrame" title="Next frame">▶</button>
    </div>
    <div class="time-row"><span id="timeLabel">0.00s / 0.00s</span><span id="frameLabel">frame —</span></div>
  </div>

  <div class="grid">
    <div class="field"><label for="start">Start (s)</label><input type="number" id="start" min="0" step="0.1" value="0" /></div>
    <div class="field"><label for="end">End (s)</label><input type="number" id="end" min="0" step="0.1" value="2" /></div>
    <div class="field"><label for="fps">Frames / sec</label><input type="number" id="fps" min="1" max="20" value="8" /></div>
    <div class="field"><label for="width">Width (px)</label><input type="number" id="width" min="64" max="480" value="240" /></div>
  </div>

  <div class="row">
    <button class="btn primary" id="convert" disabled>Convert to GIF</button>
    <button class="btn ghost" id="previewBtn" disabled>Play preview</button>
  </div>

  <div class="progress hidden" id="progress">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <span id="progressLabel">Encoding…</span>
  </div>

  <a class="btn primary hidden" id="download" download="clip.gif">Download GIF</a>
  <p class="err hidden" id="err"></p>
  <footer>Best kept under ~30 s at 8–10 fps. Quality is limited by design.</footer>
</div>
<video id="video" muted playsinline class="hidden"></video>
<script src="popup.js"></script>
</body>
</html>
