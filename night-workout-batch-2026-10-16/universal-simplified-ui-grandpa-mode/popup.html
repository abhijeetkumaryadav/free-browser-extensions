<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hdr">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7" cy="14" r="4"/>
        <circle cx="17" cy="14" r="4"/>
        <path d="M11 14h2"/>
        <path d="M3 13l-1.5-4M21 13l1.5-4"/>
      </svg>
    </span>
    <div>
      <h1>Grandpa Mode</h1>
      <p class="sub">Simple, comfortable browsing</p>
    </div>
  </header>

  <p id="siteLine" class="site-line">This site: <strong id="siteName">…</strong></p>

  <label class="master">
    <span>Simplify this site</span>
    <button id="masterToggle" class="switch" role="switch" aria-checked="false" aria-label="Simplify this site">
      <span class="knob"></span>
    </button>
  </label>

  <div id="features" class="features" aria-hidden="true">
    <label class="row">
      <span class="row-text"><strong>Larger text</strong><em>25% bigger, roomier lines</em></span>
      <button class="switch sm" data-f="text" role="switch" aria-checked="false"><span class="knob"></span></button>
    </label>
    <label class="row">
      <span class="row-text"><strong>High contrast</strong><em>Warm paper background, dark text</em></span>
      <button class="switch sm" data-f="contrast" role="switch" aria-checked="false"><span class="knob"></span></button>
    </label>
    <label class="row">
      <span class="row-text"><strong>Simplify layout</strong><em>Hide sidebars &amp; ads, narrower page</em></span>
      <button class="switch sm" data-f="simplify" role="switch" aria-checked="false"><span class="knob"></span></button>
    </label>
    <label class="row">
      <span class="row-text"><strong>Bigger buttons</strong><em>44px touch-friendly targets</em></span>
      <button class="switch sm" data-f="targets" role="switch" aria-checked="false"><span class="knob"></span></button>
    </label>
  </div>

  <p class="notice">Comfort aid — changes apply only on sites you enable, and everything is fully reversible.</p>

  <footer class="foot">100% local · nothing leaves your device · no tracking</footer>
  <script src="popup.js"></script>
</body>
</html>
