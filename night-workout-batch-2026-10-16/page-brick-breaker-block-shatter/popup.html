<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brick Breaker</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="8" height="4" rx="1"/><rect x="13" y="10" width="8" height="4" rx="1"/><circle cx="12" cy="19" r="1.6"/></svg>
    <div>
      <h1>Brick Breaker</h1>
      <p class="sub">Page blocks become bricks. The page itself is never touched — shattering is visual only.</p>
    </div>
  </header>

  <div class="stat-row">
    <div class="stat"><span class="label">High score</span><span class="value" id="highScore">0</span></div>
    <div class="stat"><span class="label">Last score</span><span class="value" id="lastScore">0</span></div>
  </div>

  <label class="field">
    <span>Difficulty</span>
    <select id="difficulty">
      <option value="chill">Chill</option>
      <option value="normal" selected>Normal</option>
      <option value="spicy">Spicy</option>
    </select>
  </label>

  <button id="startBtn" class="primary">Start game on this tab</button>
  <p class="hint">Move your mouse to steer the paddle. Press Esc or the exit button to quit anytime — the page is restored exactly.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
