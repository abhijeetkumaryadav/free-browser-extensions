<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Lens</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    <div>
      <h1>Label Lens</h1>
      <p class="sub">Supplement ingredient scanner</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span>Label heuristics only — <strong>NOT purity testing, NOT medical advice</strong>. It cannot detect contamination or potency.</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="paste">Paste label</button>
    <button class="tab" data-tab="scan">Scan active field</button>
    <button class="tab" data-tab="rules">All rules</button>
  </div>

  <section id="tab-paste" class="tabpane active">
    <textarea id="label" rows="6" placeholder="Paste the supplement facts / ingredients text here…"></textarea>
    <button id="analyze" class="primary">Scan label</button>
  </section>

  <section id="tab-scan" class="tabpane">
    <p class="hint">Focus a text field on the page (or select label text), then scan it. Read-only — the page is never modified.</p>
    <button id="grab" class="primary">Scan focused field / selection</button>
  </section>

  <section id="tab-rules" class="tabpane">
    <div id="ruleList"></div>
  </section>

  <div id="verdict" class="verdict hidden"></div>
  <div id="stats" class="stats hidden"></div>
  <div id="results"></div>
</div>
<script src="rules.js"></script>
<script src="popup.js"></script>
</body>
</html>
