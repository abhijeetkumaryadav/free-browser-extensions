<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JWT Session Vault</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="title-block">
      <h1>JWT Vault</h1>
      <p class="subtitle">Decode · verify · store your tokens</p>
    </div>
  </header>

  <div class="notice" role="note">
    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Stores <strong>your</strong> tokens only, in this browser. Nothing is ever transmitted — decoding and HMAC verification run locally via WebCrypto.</span>
  </div>

  <section class="card">
    <label class="field-label" for="tokenInput">JWT</label>
    <textarea id="tokenInput" rows="3" placeholder="Paste a JWT (header.payload.signature)…" spellcheck="false"></textarea>
    <label class="field-label" for="secretInput">HMAC secret <span class="hint">(for signature verification, optional)</span></label>
    <input id="secretInput" type="password" placeholder="Secret for HS256/HS384/HS512" autocomplete="off">
    <div class="row">
      <button id="decodeBtn" class="btn primary">Decode</button>
      <button id="verifyBtn" class="btn">Verify signature</button>
    </div>
    <div id="inspectOut" class="inspect-out hidden"></div>
  </section>

  <section class="card">
    <div class="row-between">
      <h2>Vault</h2>
      <button id="lockToggle" class="btn small">🔒 Lock</button>
    </div>
    <div id="lockPanel" class="lock-panel hidden">
      <input id="passInput" type="password" placeholder="Passphrase (AES-GCM)" autocomplete="off">
      <button id="unlockBtn" class="btn small">Unlock</button>
    </div>
    <div class="row">
      <input id="nameInput" placeholder="Token name (e.g. api-dev)" maxlength="40">
      <button id="saveBtn" class="btn small">Save</button>
    </div>
    <ul id="vaultList" class="vault-list"></ul>
    <p id="vaultEmpty" class="empty">No tokens stored.</p>
  </section>
</div>
<script src="crypto.js"></script>
<script src="popup.js"></script>
</body>
</html>
