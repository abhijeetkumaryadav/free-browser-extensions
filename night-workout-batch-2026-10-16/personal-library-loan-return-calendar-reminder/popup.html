<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Tracker</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </div>
    <div>
      <h1>Loan Tracker</h1>
      <p class="subtitle">Your loan log — manual reminders</p>
    </div>
  </header>

  <div class="banner" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <p>Flags are date math only. This extension sends no emails, push notifications, or calendar events — check the counts yourself.</p>
  </div>

  <section class="stats">
    <div class="stat"><span class="num" id="stat-active">0</span><span class="lbl">Active</span></div>
    <div class="stat warn"><span class="num" id="stat-overdue">0</span><span class="lbl">Overdue</span></div>
    <div class="stat ok"><span class="num" id="stat-returned">0</span><span class="lbl">Returned</span></div>
  </section>

  <section class="card">
    <h2>New loan</h2>
    <input id="f-book" type="text" placeholder="Book title *" maxlength="200">
    <div class="row">
      <input id="f-borrower" type="text" placeholder="Borrower *" maxlength="100">
      <input id="f-due" type="date">
    </div>
    <textarea id="f-note" rows="2" placeholder="Note (optional)" maxlength="1000"></textarea>
    <button id="btn-add" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Record loan
    </button>
    <p class="error" id="form-error" hidden></p>
  </section>

  <section class="card">
    <div class="list-head">
      <h2>Loans</h2>
      <div class="tabs">
        <button class="tab active" data-tab="active">Active</button>
        <button class="tab" data-tab="returned">Returned</button>
      </div>
    </div>
    <input id="search" type="text" placeholder="Search book or borrower…" maxlength="100">
    <div id="list" class="list"></div>
    <p class="empty" id="empty">No loans here.</p>
  </section>

  <footer class="footer">All data stays in your browser. Zero network.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
