<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W&B Envelope</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.5 20 3 8l7.5-4 4.5 6 5-3"/>
      <path d="M3 8l10.5 6.5L21 13"/>
      <circle cx="12" cy="12" r="0.5" fill="currentColor"/>
    </svg>
    <div>
      <h1>W&amp;B Envelope</h1>
      <p class="sub">Weight &amp; balance calculator</p>
    </div>
  </header>

  <div class="notice" id="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Estimates only — always verify against the aircraft POH. Not for flight planning alone.</span>
  </div>

  <section class="card">
    <div class="card-hdr">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-4h6v4"/></svg>
      <h2>Aircraft profile</h2>
    </div>
    <div class="grid2">
      <label>Empty weight (lb)<input id="emptyW" type="number" min="1" step="0.1" placeholder="1560"></label>
      <label>Empty CG (in)<input id="emptyCG" type="number" min="0" step="0.01" placeholder="83.5"></label>
    </div>
    <label class="block">Envelope corners (one "wt,cg" per line, in order)
      <textarea id="envelope" rows="4" placeholder="2200,80&#10;2200,88&#10;1900,92&#10;1600,88&#10;1600,80"></textarea>
    </label>
    <button class="btn ghost" id="loadDefault">Load sample 4-seat envelope</button>
  </section>

  <section class="card">
    <div class="card-hdr">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <h2>Loads (weight lb @ arm in)</h2>
    </div>
    <div class="grid2" id="loads">
      <label>Pilot/front pax W<input id="l0w" type="number" min="0" step="0.5" placeholder="180"></label>
      <label>Pilot/front arm<input id="l0a" type="number" min="0" step="0.5" placeholder="80.5"></label>
      <label>Rear pax W<input id="l1w" type="number" min="0" step="0.5" placeholder="0"></label>
      <label>Rear arm<input id="l1a" type="number" min="0" step="0.5" placeholder="118"></label>
      <label>Fuel W<input id="l2w" type="number" min="0" step="0.5" placeholder="180"></label>
      <label>Fuel arm<input id="l2a" type="number" min="0" step="0.5" placeholder="95"></label>
      <label>Baggage W<input id="l3w" type="number" min="0" step="0.5" placeholder="0"></label>
      <label>Baggage arm<input id="l3a" type="number" min="0" step="0.5" placeholder="142"></label>
    </div>
    <button class="btn" id="calc">Calculate W&amp;B</button>
  </section>

  <section class="card" id="resultCard" hidden>
    <div class="card-hdr">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
      <h2>Result</h2>
    </div>
    <div class="results">
      <div class="stat"><span class="k">Gross weight</span><span class="v" id="rW">—</span></div>
      <div class="stat"><span class="k">CG</span><span class="v" id="rCG">—</span></div>
      <div class="stat"><span class="k">Total moment</span><span class="v" id="rM">—</span></div>
    </div>
    <div class="verdict" id="verdict">—</div>
    <canvas id="plot" width="340" height="220"></canvas>
  </section>

  <footer>Estimates only — verify against the POH.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
