<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
    <div>
      <h1>EXIF Scrubber</h1>
      <p class="sub">Metadata privacy cleaner</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Strips ALL metadata by re-encoding. Your original files are never modified — only new clean copies download.</span>
  </div>

  <label class="drop" id="drop">
    <input type="file" id="files" accept="image/*" multiple hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
    <span>Drop images here or <b>choose files</b></span>
  </label>

  <div class="options">
    <label class="opt">Output
      <select id="format">
        <option value="jpeg">JPEG (smaller)</option>
        <option value="png">PNG (lossless)</option>
      </select>
    </label>
    <label class="opt">Quality
      <input type="range" id="quality" min="0.6" max="1" step="0.01" value="0.92">
    </label>
  </div>

  <ul id="list" class="list"></ul>

  <div class="actions">
    <button id="scrubAll" class="primary" disabled>Scrub &amp; download all</button>
    <button id="clear" class="ghost" disabled>Clear</button>
  </div>
  <p class="foot">100% local — nothing is ever uploaded.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
