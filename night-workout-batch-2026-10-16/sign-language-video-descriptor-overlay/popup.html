<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Practice Cards</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header class="head">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.9-2.3l-3.4-3.85a2 2 0 0 1 3-2.65L7 15"/></svg>
    </div>
    <div>
      <h1>Sign Practice Cards</h1>
      <p class="sub">Your personal sign deck</p>
    </div>
  </header>

  <!-- Honest-scope banner -->
  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
    <span><strong>Your practice cards only.</strong> You write every description — this does <strong>not</strong> recognize signs from video.</span>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="review">Review</button>
    <button class="tab" data-tab="deck">Deck</button>
    <button class="tab" data-tab="add">Add card</button>
  </nav>

  <!-- Review tab -->
  <div id="tab-review" class="panel">
    <div class="row">
      <select id="catFilter" class="text"></select>
      <button id="shuffleBtn" class="btn ghost">Shuffle</button>
    </div>
    <div id="flash" class="flash">
      <div class="flash-inner" id="flashInner">
        <div class="face front">
          <div id="fFront" class="f-front">—</div>
          <div id="fCat" class="f-cat"></div>
          <div class="hint">click to flip</div>
        </div>
        <div class="face back">
          <div class="f-label">How to make it</div>
          <div id="fMotion" class="f-motion"></div>
          <div class="f-label">Notes</div>
          <div id="fNotes" class="f-notes"></div>
          <a id="fLink" class="f-link hidden" href="#" target="_blank" rel="noopener">Watch reference video ↗</a>
        </div>
      </div>
    </div>
    <div class="row spaced">
      <button id="prevBtn" class="btn ghost">‹ Prev</button>
      <div id="progress" class="progress">0 / 0</div>
      <button id="nextBtn" class="btn ghost">Next ›</button>
    </div>
    <div class="row spaced">
      <button id="knownBtn" class="btn accent">✓ I know this</button>
      <button id="resetKnownBtn" class="btn ghost">Reset progress</button>
    </div>
    <div id="mastery" class="mastery"></div>
  </div>

  <!-- Deck tab -->
  <div id="tab-deck" class="panel hidden">
    <div class="row">
      <input id="deckSearch" class="text" type="text" placeholder="Search signs…" maxlength="60">
    </div>
    <div id="deckList" class="deck"><p class="empty">No cards yet — add your first sign.</p></div>
  </div>

  <!-- Add tab -->
  <div id="tab-add" class="panel hidden">
    <label class="lbl">Sign name / word</label>
    <input id="aName" class="text full" type="text" placeholder="e.g. Hello" maxlength="60">
    <label class="lbl">Category</label>
    <div class="row">
      <select id="aCat" class="text grow"></select>
      <input id="aNewCat" class="text grow" type="text" placeholder="New category…" maxlength="30">
    </div>
    <label class="lbl">Hand motion description (your own words)</label>
    <textarea id="aMotion" class="text full area" placeholder="e.g. Flat hand from forehead outward, palm facing away…" maxlength="500"></textarea>
    <label class="lbl">Practice notes</label>
    <textarea id="aNotes" class="text full area" placeholder="e.g. Keep elbow still; common mistakes…" maxlength="500"></textarea>
    <label class="lbl">Reference video link (optional)</label>
    <input id="aLink" class="text full" type="url" placeholder="https://…" maxlength="300">
    <button id="saveBtn" class="btn accent fullbtn">Save card</button>
    <p id="saveMsg" class="msg"></p>
  </div>

  <p class="foot">100% local — your deck never leaves this browser.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
