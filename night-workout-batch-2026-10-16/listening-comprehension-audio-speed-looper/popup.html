<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Listening Looper</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="shell">
  <header class="head">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"/></svg>
    </span>
    <div>
      <h1>Listening Looper</h1>
      <p class="sub">Audio speed &amp; loop — study aid</p>
    </div>
  </header>

  <!-- File loading -->
  <section class="card">
    <label class="filebtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg>
      <span id="fileLabel">Choose an audio file</span>
      <input type="file" id="fileInput" accept="audio/*" hidden>
    </label>
    <p id="trackName" class="track">No file loaded — everything stays local.</p>
  </section>

  <!-- Transport -->
  <section class="card">
    <div class="transport">
      <button id="btnBack10" class="tbtn" title="Back 10 seconds" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
        <span>10</span>
      </button>
      <button id="btnBack5" class="tbtn" title="Back 5 seconds" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
        <span>5</span>
      </button>
      <button id="btnPlay" class="play" title="Play / pause" disabled>
        <svg id="icoPlay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8V4z"/></svg>
        <svg id="icoPause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M7 4h4v16H7z"/><path d="M13 4h4v16h-4z"/></svg>
      </button>
      <button id="btnFwd5" class="tbtn" title="Forward 5 seconds" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/><path d="M12 8v4l3 2"/></svg>
        <span>5</span>
      </button>
      <button id="btnFwd10" class="tbtn" title="Forward 10 seconds" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/><path d="M12 8v4l3 2"/></svg>
        <span>10</span>
      </button>
    </div>
    <div class="timebar">
      <span id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
      <span id="tDur">0:00</span>
    </div>
  </section>

  <!-- Speed -->
  <section class="card">
    <div class="row">
      <h2>Speed</h2>
      <span id="speedVal" class="pill">1.0×</span>
    </div>
    <div class="sliderrow">
      <span class="slabel">0.5×</span>
      <input type="range" id="speed" min="0.5" max="1.5" step="0.05" value="1" aria-label="Playback speed">
      <span class="slabel">1.5×</span>
    </div>
  </section>

  <!-- A/B loop -->
  <section class="card">
    <div class="row">
      <h2>A / B loop</h2>
      <button id="btnLoop" class="chip" disabled>Loop: off</button>
    </div>
    <div class="abrow">
      <button id="btnSetA" class="abtn" disabled>Set A <span id="aVal" class="abval">—</span></button>
      <button id="btnSetB" class="abtn" disabled>Set B <span id="bVal" class="abval">—</span></button>
      <button id="btnClearAB" class="abtn ghost" disabled>Clear</button>
    </div>
    <p class="hint">Set A and B at two points, then turn the loop on to repeat that section.</p>
  </section>

  <footer class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M12 12v4"/></svg>
    <span>Study aid only. Files play locally — nothing is uploaded or stored.</span>
  </footer>
</main>
<script src="popup.js"></script>
</body>
</html>
