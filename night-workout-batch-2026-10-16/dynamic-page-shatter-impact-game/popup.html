<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header class="brand">
    <span class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M12 12l7 9M12 12L5 21M12 12l8-4M12 12L4 8M12 12l-5-8M12 12l5-8"/></svg>
    </span>
    <div>
      <h1>ShatterPlay</h1>
      <p>Impact shatter game</p>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="stat"><span class="label">Best</span><span class="value" id="best">0</span></div>
    <div class="stat"><span class="label">Status</span><span class="value small" id="status">Ready</span></div>
  </div>

  <button id="shatter" class="primary">Shatter this page</button>
  <button id="restore" class="ghost">Restore page</button>

  <p class="hint">Click falling shards mid-air for <b>+10</b> each. The page is never modified — it's a pure canvas overlay. Press <kbd>Esc</kbd> on the page to restore.</p>
  <p class="err" id="err" role="alert"></p>
</div>
<script src="popup.js"></script>
</body>
</html>
