<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Document Index</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>
    <div>
      <h1>Local Document Index</h1>
      <p class="sub">Full-text keyword search over your documents</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Keyword index only — <strong>not RAG</strong>. No AI models, no network. Documents stay on this device.</span>
  </div>

  <div class="row">
    <input type="text" id="inQuery" placeholder="Search your documents…" class="grow">
    <button class="btn primary" id="btnSearch">Search</button>
  </div>
  <p class="hint">Term-frequency ranking — documents with more keyword hits rank higher.</p>

  <ul class="result-list" id="resultList">
    <li class="empty">Import documents below, then search.</li>
  </ul>

  <div class="divider"></div>

  <div class="row between">
    <span class="stat" id="statDocs">0 documents indexed</span>
    <div class="row">
      <label class="btn small ghost file-label">
        Import .txt / .md
        <input type="file" id="fileInput" accept=".txt,.md,.markdown,text/plain,text/markdown" multiple hidden>
      </label>
      <button class="btn small ghost" id="btnClear">Clear index</button>
    </div>
  </div>
  <ul class="doc-list" id="docList"></ul>
</div>
<script src="popup.js"></script>
</body>
</html>
