<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="hdr">
    <svg class="hdr-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
    <div>
      <h1>Hook Analyzer</h1>
      <p class="sub">Short-video script opener</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Heuristic scoring only — not AI. Checks the first non-empty line of your script.</span>
  </div>

  <label class="fld-label" for="script">Paste your script (one beat per line)</label>
  <textarea id="script" rows="5" placeholder="Your opening line goes here...&#10;Rest of the script below it..."></textarea>

  <button id="analyze" class="btn-primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
    Analyze hook
  </button>

  <section id="results" class="results hidden">
    <div class="score-row">
      <svg class="ring" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="34" class="ring-bg"/>
        <circle cx="40" cy="40" r="34" class="ring-fg" id="ringFg"/>
        <text x="40" y="38" text-anchor="middle" class="ring-num" id="scoreNum">0</text>
        <text x="40" y="54" text-anchor="middle" class="ring-cap">/ 100</text>
      </svg>
      <div class="score-meta">
        <div class="verdict" id="verdict">—</div>
        <div class="hook-line" id="hookLine">—</div>
      </div>
    </div>

    <h2 class="sec-title">Factor breakdown</h2>
    <ul class="factors" id="factors"></ul>

    <h2 class="sec-title">Tips</h2>
    <ul class="tips" id="tips"></ul>

    <h2 class="sec-title">Script stats</h2>
    <div class="stats" id="stats"></div>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
