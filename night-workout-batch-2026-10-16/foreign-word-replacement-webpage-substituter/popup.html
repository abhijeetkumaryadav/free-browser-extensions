<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Swap</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <svg class="logo" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      <path d="M8 9h8"/><path d="M8 13h5"/>
    </svg>
    <div>
      <h1>Word Swap</h1>
      <p class="sub">learn vocabulary in context</p>
    </div>
  </header>

  <div class="notice">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>Your pairs &mdash; page view only. Original text is restored when you toggle off.</span>
  </div>

  <section class="card">
    <h2>Add pair</h2>
    <div class="row">
      <input id="wordInput" type="text" placeholder="Word" maxlength="60" aria-label="Word to replace">
      <input id="transInput" type="text" placeholder="Translation" maxlength="60" aria-label="Translation">
      <button id="addBtn" class="btn" type="button">Add</button>
    </div>
  </section>

  <section class="card">
    <h2>Your pairs <span class="count" id="pairCount"></span></h2>
    <ul id="pairList" class="pairs"></ul>
    <p class="empty" id="emptyMsg">No pairs yet &mdash; add your first word above.</p>
  </section>

  <section class="card">
    <h2>This tab</h2>
    <div class="row">
      <button id="applyBtn" class="btn primary" type="button">Apply to this tab</button>
      <button id="restoreBtn" class="btn" type="button">Restore page</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
