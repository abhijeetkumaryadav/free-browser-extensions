<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GeoCities Webring</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
  <div>
    <h1>GeoCities Webring</h1>
    <p class="sub">Your retro-site list — random opener.</p>
  </div>
</header>

<main>
  <button id="surprise" class="cta">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M16 8h.01M12 12h.01M8 16h.01"/></svg>
    Surprise me
  </button>

  <form id="addForm">
    <input id="fName" type="text" maxlength="80" placeholder="Site name (e.g. Pixel Shrine)" required>
    <input id="fUrl" type="url" maxlength="300" placeholder="https://example.com" required>
    <input id="fNote" type="text" maxlength="160" placeholder="Your note (optional)">
    <button type="submit">Add to the webring</button>
  </form>

  <input id="search" type="search" placeholder="Search sites or notes…" aria-label="Search sites">

  <ul id="list" class="list" aria-live="polite"></ul>
  <p id="empty" class="empty">No retro sites yet. Add your first treasure above.</p>
</main>

<script src="popup.js"></script>
</body>
</html>
