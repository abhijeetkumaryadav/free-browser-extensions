<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RPG Gym Logger</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="shell">
  <header class="head">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10"/><path d="M18 7v10"/><path d="M4 9v6"/><path d="M20 9v6"/><path d="M6 12h12"/><path d="M9 5.5 7.5 7 9 8.5"/><path d="M15 5.5 16.5 7 15 8.5"/></svg>
    </span>
    <div>
      <h1>RPG Gym Logger</h1>
      <p class="sub">Gamified workout logbook</p>
    </div>
  </header>

  <!-- Character card -->
  <section class="card char">
    <div class="charrow">
      <div class="avatar" id="avatar">1</div>
      <div class="charmeta">
        <div class="row"><h2 id="charName">Adventurer</h2><span id="lvlPill" class="pill">Lv 1</span></div>
        <div class="xpbar"><div id="xpFill" class="xpfill"></div></div>
        <p id="xpLabel" class="mut">0 / 100 XP</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="sico" style="color:#f87171">STR</span><b id="stStr">1</b></div>
      <div class="stat"><span class="sico" style="color:#34d399">END</span><b id="stEnd">1</b></div>
      <div class="stat"><span class="sico" style="color:#60a5fa">AGI</span><b id="stAgi">1</b></div>
    </div>
  </section>

  <!-- Log a set -->
  <section class="card">
    <h2>Log a set</h2>
    <div class="grid">
      <label>Exercise<input id="inEx" type="text" placeholder="e.g. Squat" maxlength="40"></label>
      <label>Weight (kg)<input id="inW" type="number" min="0" step="0.5" placeholder="60"></label>
      <label>Reps<input id="inR" type="number" min="1" step="1" placeholder="8"></label>
      <label>Boosts stat
        <select id="inStat">
          <option value="STR">STR — strength</option>
          <option value="END">END — endurance</option>
          <option value="AGI">AGI — agility</option>
        </select>
      </label>
    </div>
    <button id="btnLog" class="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      Log set · +XP
    </button>
    <p id="levelMsg" class="lvlmsg" hidden></p>
  </section>

  <!-- Badges -->
  <section class="card">
    <h2>Achievements</h2>
    <div id="badges" class="badges"></div>
  </section>

  <!-- History -->
  <section class="card">
    <div class="row"><h2>History</h2><button id="btnClear" class="link">Clear all</button></div>
    <ul id="hist" class="hist"></ul>
    <p id="emptyHist" class="mut">No sets logged yet. Your legend begins here.</p>
  </section>

  <footer class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M12 12v4"/></svg>
    <span>Gamified logbook — not coaching advice. All data stays in this browser.</span>
  </footer>
</main>
<script src="popup.js"></script>
</body>
</html>
