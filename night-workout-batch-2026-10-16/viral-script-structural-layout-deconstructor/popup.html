<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
    </div>
    <div>
      <h1>Script Deconstructor</h1>
      <div class="sub">Viral layout analyzer</div>
    </div>
  </div>

  <div class="notice">
    Heuristic segmentation — rule-based, <b>not AI</b>. First lines are treated as the Hook by convention.
  </div>

  <textarea id="scriptInput" placeholder="Paste your video script here, one beat per line…"></textarea>

  <div class="btn-row">
    <button id="analyzeBtn" class="primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      Analyze structure
    </button>
    <button id="clearBtn" class="ghost">Clear</button>
  </div>

  <div id="results"></div>
  <script src="popup.js"></script>
</body>
</html>
