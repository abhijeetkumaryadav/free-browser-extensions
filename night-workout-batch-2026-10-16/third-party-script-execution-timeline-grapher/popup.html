<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Third-Party Script Timeline</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h18M3 17a2 2 0 0 1 2-2h2l2-8h6l2 8h2a2 2 0 0 1 2 2"/><circle cx="7.5" cy="19.5" r="1.5"/><circle cx="16.5" cy="19.5" r="1.5"/><path d="M9 11h6"/></svg>
    </div>
    <div>
      <h1>Script Timeline</h1>
      <p class="sub">Third-party scripts on this tab, drawn as a load timeline.</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Load timing only — resource fetch durations, not execution profiling. Nothing runs until you click scan.</span>
  </div>

  <div class="actions">
    <button id="scan" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      Scan this tab
    </button>
    <button id="clear" class="btn ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      Clear
    </button>
  </div>

  <div id="meta" class="meta hidden"></div>
  <div id="timeline" class="timeline hidden"></div>
  <div id="list" class="list"></div>
  <p id="empty" class="empty">Click <strong>Scan this tab</strong> to list third-party scripts and their load times.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
