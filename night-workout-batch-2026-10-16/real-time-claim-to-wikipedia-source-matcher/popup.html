<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Check — Wikipedia Source Matcher</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header class="head">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <div>
      <h1>Claim Check</h1>
      <p class="sub">Wikipedia source matcher</p>
    </div>
  </header>

  <p class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    Your research — not automated fact-checking. This opens a Wikipedia search; <strong>you</strong> decide the verdict.
  </p>

  <label class="field-label" for="claim">Claim to check</label>
  <textarea id="claim" rows="3" maxlength="500" placeholder="e.g. The Eiffel Tower grows taller in summer"></textarea>

  <button id="search" class="primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    Search Wikipedia
  </button>

  <hr>

  <h2 class="section-title">Log your verdict</h2>
  <label class="field-label" for="verdict">Verdict</label>
  <div class="verdict-row" id="verdictRow">
    <button class="chip" data-v="confirmed">Confirmed</button>
    <button class="chip" data-v="unconfirmed">Unconfirmed</button>
    <button class="chip" data-v="disputed">Disputed</button>
    <button class="chip" data-v="false">False</button>
  </div>
  <label class="field-label" for="notes">Notes (optional)</label>
  <textarea id="notes" rows="2" maxlength="500" placeholder="What did the sources say?"></textarea>
  <button id="save" class="ghost">Save verdict</button>

  <hr>

  <h2 class="section-title">Your verdict log <span id="count" class="count"></span></h2>
  <div id="list" class="list"></div>
  <button id="clear" class="danger hidden">Clear all</button>
  <p class="foot">Fully local. Nothing leaves your browser.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
