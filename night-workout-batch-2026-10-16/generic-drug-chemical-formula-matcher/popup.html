<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicine Notes</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="wrap">
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
      </span>
      <div>
        <h1>Medicine Notes</h1>
        <p class="sub">Your personal notebook — not a formula database</p>
      </div>
    </div>
  </header>

  <!-- Mandatory health banner -->
  <div class="banner" role="note">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <span>Not medical advice — talk to your doctor/pharmacist.</span>
  </div>

  <!-- Add form -->
  <section class="card">
    <h2>Add an entry</h2>
    <label class="field">
      <span>Medicine name</span>
      <input id="name" type="text" placeholder="e.g. Paracetamol" autocomplete="off">
    </label>
    <label class="field">
      <span>Chemical / formula name</span>
      <input id="formula" type="text" placeholder="e.g. C8H9NO2" autocomplete="off">
    </label>
    <label class="field">
      <span>Notes</span>
      <textarea id="notes" rows="2" placeholder="Anything you want to remember…"></textarea>
    </label>
    <button id="add" class="btn primary">Add entry</button>
    <p class="hint">Everything you type stays in this browser. The extension never looks up or verifies formulas.</p>
  </section>

  <!-- Search + list -->
  <section class="card">
    <div class="list-head">
      <h2>Your entries <span id="count" class="pill">0</span></h2>
      <div class="list-actions">
        <button id="export" class="btn ghost" title="Download entries as JSON">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
          Export
        </button>
        <button id="clear" class="btn ghost danger" title="Delete all entries">Clear</button>
      </div>
    </div>
    <input id="search" type="search" placeholder="Search name, formula, notes…" autocomplete="off">
    <ul id="entries" class="entries"></ul>
    <p id="empty" class="empty">No entries yet. Add your first one above.</p>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
