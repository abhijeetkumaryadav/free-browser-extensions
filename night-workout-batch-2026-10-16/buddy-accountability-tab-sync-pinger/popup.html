<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buddy Check-In</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">

  <header class="top">
    <div class="brand">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <h1>Buddy Check-In</h1>
    </div>
    <p class="scope">Reminder only — no account, no buddy sync. You check in, then share with your buddy yourself.</p>
  </header>

  <section class="streak-hero">
    <div class="streak-num" id="streakNum">0</div>
    <div class="streak-label">day check-in streak</div>
  </section>

  <div class="grid14" id="dayGrid" aria-label="Last 14 days"></div>

  <button class="btn primary" id="doneBtn" type="button">
    <svg class="icon sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
    Mark today done
  </button>
  <p class="done-note hidden" id="doneNote">Checked in for today. Nice — keep the chain alive.</p>

  <button class="btn ghost" id="copyBtn" type="button">
    <svg class="icon sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    Copy check-in text
  </button>
  <p class="copied hidden" id="copiedNote">Copied — paste it to your buddy.</p>

  <section class="settings">
    <label class="row">
      <span>Daily reminder</span>
      <input type="checkbox" id="reminderToggle" checked>
    </label>
    <label class="row">
      <span>Check-in time</span>
      <input type="time" id="timeInput" value="09:00">
    </label>
  </section>

  <footer class="foot">All data stays in this browser. Nothing is uploaded or synced.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
