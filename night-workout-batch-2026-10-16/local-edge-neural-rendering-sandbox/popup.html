<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Effects Sandbox</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="hdr">
    <!-- Lucide-style image outline icon -->
    <svg class="brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    <div class="titles">
      <h1>Canvas Effects Sandbox</h1>
      <p class="sub">Classic canvas filters on your images</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>Classic <strong>canvas filters</strong> — NOT neural/AI rendering. Everything runs locally.</span>
  </div>

  <div class="drop-row">
    <label class="btn primary file-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Load image</span>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </label>
    <button id="btnExport" class="btn ghost" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Export PNG</span>
    </button>
  </div>

  <section class="preview">
    <canvas id="stage" width="348" height="232"></canvas>
    <p id="status" class="status">No image loaded. Load a local image to begin.</p>
  </section>

  <section class="effects">
    <h2>Effect</h2>
    <div class="fx-grid" id="fxGrid">
      <button class="fx" data-fx="none"><span>None</span></button>
      <button class="fx" data-fx="pixelate"><span>Pixelate</span></button>
      <button class="fx" data-fx="duotone"><span>Duotone</span></button>
      <button class="fx" data-fx="glitch"><span>Glitch</span></button>
      <button class="fx" data-fx="halftone"><span>Halftone</span></button>
      <button class="fx" data-fx="edge"><span>Edge detect</span></button>
    </div>
    <div class="strength">
      <label for="strengthRange">Strength <span id="strengthVal">50</span></label>
      <input type="range" id="strengthRange" min="0" max="100" value="50">
    </div>
  </section>

  <footer class="foot">Your image never leaves the browser. Export saves a PNG locally.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
