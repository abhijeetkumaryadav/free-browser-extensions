<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Page Notes</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header class="head">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <div>
      <h1>My Page Notes</h1>
      <p class="sub">personal annotations</p>
    </div>
  </header>

  <div class="notice"><strong>Your notes</strong> — not community notes. Annotations are private, stored locally, shown only to you.</div>

  <div class="tabbar">
    <button class="tab active" id="tabThis">This page</button>
    <button class="tab" id="tabAll">All notes</button>
  </div>

  <div id="paneThis">
    <p class="pageurl" id="pageUrl">…</p>
    <div class="btnrow">
      <button class="btn primary" id="addSel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Note on selection
      </button>
      <button class="btn" id="addPage">Note on page</button>
    </div>
    <div class="addbox" id="addBox" hidden>
      <p class="sel" id="selText"></p>
      <textarea id="noteText" rows="2" placeholder="Your note…"></textarea>
      <div class="btnrow">
        <button class="btn primary" id="saveNote">Save note</button>
        <button class="btn" id="cancelNote">Cancel</button>
      </div>
    </div>
    <button class="btn wide" id="highlightBtn">Highlight my notes on this page</button>
    <p class="hint" id="hint"></p>
    <ul class="list" id="listThis"></ul>
  </div>

  <div id="paneAll" hidden>
    <input id="q" type="search" placeholder="Search notes…" autocomplete="off">
    <ul class="list" id="listAll"></ul>
    <p class="empty" id="emptyAll" hidden>No notes yet.</p>
  </div>

  <footer class="foot">Fully local — nothing leaves your browser.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
