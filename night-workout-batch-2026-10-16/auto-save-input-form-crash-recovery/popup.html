<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6"/><path d="M9 11h1"/></svg>
    </span>
    <div>
      <h1>Form Saver</h1>
      <p class="sub">Crash recovery for typed forms</p>
    </div>
    <label class="switch" title="Enable Form Saver on this site">
      <input type="checkbox" id="enabledToggle" />
      <span class="knob"></span>
    </label>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>Local snapshots only — clear anytime. <strong>Password fields are never captured.</strong></span>
  </div>

  <section id="snapshotCard" class="card hidden">
    <div class="row">
      <div>
        <p class="label">Saved snapshot</p>
        <p id="snapInfo" class="value">—</p>
      </div>
    </div>
    <div class="actions">
      <button id="restoreBtn" class="primary">Restore fields</button>
      <button id="clearSnapBtn" class="ghost">Discard</button>
    </div>
  </section>

  <section id="emptyCard" class="card">
    <p class="muted">No snapshot found for this page yet. Enable Form Saver above, type something, and it will be saved automatically.</p>
  </section>

  <section class="card">
    <div class="row">
      <div>
        <p class="label">All snapshots</p>
        <p id="countInfo" class="value">—</p>
      </div>
      <button id="clearAllBtn" class="ghost danger">Clear all</button>
    </div>
  </section>

  <p id="status" class="status" role="status"></p>

  <script src="popup.js"></script>
</body>
</html>
