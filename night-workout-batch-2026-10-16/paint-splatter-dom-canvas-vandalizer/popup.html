<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18"/><circle cx="9" cy="10" r="1.2" fill="currentColor"/><circle cx="14" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="14" r="1.3" fill="currentColor"/></svg>
    <div>
      <h1>Paint Splatter</h1>
      <p class="sub">Playful art toy · 100% local</p>
    </div>
  </header>

  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>Harmless paint overlay. The page itself is never modified — one click clears everything.</span>
  </div>

  <label class="field-label">Paint color</label>
  <div class="palette" id="palette"></div>

  <div class="row">
    <div class="field">
      <label>Brush size</label>
      <input type="range" id="size" min="8" max="60" value="24">
    </div>
    <div class="field">
      <label>Splat spread</label>
      <input type="range" id="spread" min="0" max="40" value="14">
    </div>
  </div>

  <div class="actions">
    <button id="start" class="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l-5.5 5.5a2.1 2.1 0 1 0 3-3L12 12"/><path d="M14.5 5.5l4 4L21 7l-4-4z"/><path d="M14.5 5.5L12 8l4 4 2.5-2.5"/></svg>
      Start painting
    </button>
    <button id="clear" class="ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      Clear all
    </button>
  </div>
  <p class="hint">Drag on the page to paint. Press <kbd>Esc</kbd> to stop.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
