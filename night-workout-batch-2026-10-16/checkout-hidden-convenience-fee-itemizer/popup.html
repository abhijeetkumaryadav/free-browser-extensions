<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FeeLens</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.5 8.5c-.6-.8-1.5-1.2-2.5-1.2-1.7 0-3 1.2-3 2.8 0 3.9 6 2.1 6 6 0 1.6-1.3 2.8-3 2.8-1 0-1.9-.4-2.5-1.2"/><line x1="12" y1="5.5" x2="12" y2="7"/><line x1="12" y1="17.5" x2="12" y2="19"/></svg>
      <div><h1>FeeLens</h1><p class="sub">checkout fee itemizer</p></div>
    </div>
  </header>

  <div class="banner" role="note">
    <svg class="icon sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>Heuristic scan of the visible page only. It reads what the checkout shows — it can't verify a merchant's math. Read-only: the page is never changed.</span>
  </div>

  <section class="card">
    <button id="btnScan" class="btn primary">Scan this checkout page</button>
    <p id="scanMsg" class="msg" aria-live="polite"></p>
  </section>

  <section class="card hidden" id="resultsCard">
    <h2>Order summary</h2>
    <div class="totals">
      <div class="total"><span>Subtotal</span><strong id="tSub">—</strong></div>
      <div class="total"><span>Fees found</span><strong id="tFees" class="accent">—</strong></div>
      <div class="total"><span>Taxes</span><strong id="tTax">—</strong></div>
      <div class="total"><span>Total</span><strong id="tTotal">—</strong></div>
    </div>
    <div id="flags"></div>
    <div id="lines" class="lines"></div>
  </section>

  <footer class="foot">100% local · zero network · page never modified</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
