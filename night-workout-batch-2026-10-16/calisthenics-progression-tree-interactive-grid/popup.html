<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calisthenics Progression Tree</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 8 11 16"/><path d="M16.5 8 13 16"/><path d="M8.5 6h7"/></svg>
    <h1>Progression Tree</h1>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>Tracks <strong>your</strong> progress — <strong>not coaching</strong>. Progress at your own pace; consult a qualified coach for form guidance.</span>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <section class="card">
    <div class="path-head">
      <h2 id="path-name"></h2>
      <span id="path-count" class="count"></span>
    </div>
    <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
    <div id="grid" class="grid"></div>
    <button id="reset-path" class="btn ghost">Reset this path</button>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
