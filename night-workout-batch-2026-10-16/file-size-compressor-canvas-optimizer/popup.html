<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Compress</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="hdr">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 14c2.5-1 5-1.5 8-1.5s5.5.5 8 1.5" /><path d="M4 18c2.5-1 5-1.5 8-1.5s5.5.5 8 1.5" /><path d="M7 4h10l4 4v4" /><path d="M17 4v4h4" /></svg></span>
      <div>
        <h1>Compress</h1>
        <p class="sub">Canvas image optimizer</p>
      </div>
    </header>

    <p class="notice">Re-encodes images. Some quality loss is expected — keep originals.</p>

    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*" hidden />
      <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5l5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <span id="drop-label">Drop an image or click to choose</span>
      <span class="hint">JPG · PNG · WebP — processed 100% on-device</span>
    </label>

    <div class="stats hidden" id="stats">
      <div class="stat"><span>Original</span><b id="orig-size">—</b></div>
      <div class="stat"><span>Compressed</span><b id="new-size">—</b></div>
      <div class="stat accent"><span>Saved</span><b id="saved">—</b></div>
    </div>

    <div class="row hidden" id="controls">
      <div class="field">
        <label for="scale">Scale <output id="scale-out">80%</output></label>
        <input type="range" id="scale" min="10" max="100" value="80" />
      </div>
      <div class="field">
        <label for="quality">JPEG quality <output id="quality-out">0.75</output></label>
        <input type="range" id="quality" min="0.1" max="1" step="0.05" value="0.75" />
      </div>
    </div>

    <div class="btns hidden" id="actions">
      <button id="download" class="primary">Download compressed</button>
    </div>

    <p class="err hidden" id="err"></p>
    <p class="foot">100% on-device — nothing is uploaded, ever.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
