<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table Grabber</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="hdr">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="10" y1="4" x2="10" y2="20"/><line x1="16" y1="4" x2="16" y2="20"/></svg>
      </span>
      <div>
        <h1>Table Grabber</h1>
        <p class="sub">Web tables → Excel-ready CSV</p>
      </div>
    </header>

    <div class="scope">Extracts <b>HTML tables</b> from the current page only — it does <b>not</b> read PDF files.</div>

    <button id="scanBtn" class="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      Scan page for tables
    </button>

    <div id="status" class="status" role="status"></div>

    <div id="tableListWrap" class="hidden">
      <label class="lbl">Tables found</label>
      <div id="tableList" class="list"></div>
    </div>

    <div id="previewWrap" class="hidden">
      <label class="lbl">Preview — tick columns to export</label>
      <div class="colbar" id="colBar"></div>
      <div class="preview" id="preview"></div>
      <div class="actions">
        <button id="exportBtn" class="primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>
        <button id="copyBtn" class="ghost">Copy CSV</button>
      </div>
      <p class="hint">CSV opens directly in Excel / Google Sheets (UTF-8 with BOM).</p>
    </div>
  </div>
<script src="popup.js"></script>
</body>
</html>
