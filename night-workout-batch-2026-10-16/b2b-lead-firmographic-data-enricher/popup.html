<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lead Record Keeper</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>
  <h1>Lead Record Keeper</h1>
</header>

<!-- Prominent honest-scope banner -->
<div class="banner">
  Manual records only — <strong>your data, NOT enriched</strong> from any source.
  Everything you see here was typed or imported by you.
</div>

<section class="card">
  <div class="tabs">
    <button class="tab active" data-tab="list">Leads</button>
    <button class="tab" data-tab="add">Add</button>
    <button class="tab" data-tab="io">Import / Export</button>
  </div>

  <div id="tab-list" class="tabpane">
    <input id="search" type="text" placeholder="Search company, contact, industry…" autocomplete="off">
    <ul id="leads"></ul>
  </div>

  <div id="tab-add" class="tabpane hidden">
    <form id="lead-form">
      <label>Company <input name="company" type="text" required autocomplete="off"></label>
      <div class="grid2">
        <label>Size <input name="size" type="text" placeholder="e.g. 51–200" autocomplete="off"></label>
        <label>Industry <input name="industry" type="text" autocomplete="off"></label>
      </div>
      <div class="grid2">
        <label>Revenue <input name="revenue" type="text" placeholder="e.g. $5M ARR" autocomplete="off"></label>
        <label>Location <input name="location" type="text" autocomplete="off"></label>
      </div>
      <div class="grid2">
        <label>Contact name <input name="contactName" type="text" autocomplete="off"></label>
        <label>Contact email <input name="contactEmail" type="email" autocomplete="off"></label>
      </div>
      <label>Notes <textarea name="notes" rows="2"></textarea></label>
      <button type="submit" class="primary full">Save lead</button>
    </form>
  </div>

  <div id="tab-io" class="tabpane hidden">
    <p class="hint">Export your leads as CSV, or import CSV back. Expected headers:
      company,size,industry,revenue,location,contactName,contactEmail,notes</p>
    <div class="row">
      <button id="export-btn" class="primary">Export CSV</button>
      <button id="clear-btn" class="danger">Delete all</button>
    </div>
    <label class="filelabel">Import CSV <input id="import-file" type="file" accept=".csv,text/csv"></label>
    <div id="io-msg" class="msg"></div>
  </div>
</section>

<script src="popup.js"></script>
</body>
</html>
