<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <header>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M22 6l-10 7L2 6"/>
      </svg>
      <div>
        <h1>Neutral Salutations</h1>
        <p>Gender-neutral email salutation checker</p>
      </div>
    </header>

    <div class="notice">
      <strong>Heuristic only — not AI.</strong> Matches salutations against a bundled
      list and suggests neutral alternatives. It cannot understand context, so
      review every flag yourself.
    </div>

    <div class="tabs">
      <button class="tab active" id="tabPaste">Paste text</button>
      <button class="tab" id="tabField">Scan active field</button>
    </div>

    <textarea id="input" rows="6" placeholder="Paste your email draft here…"></textarea>

    <div class="row">
      <button class="btn primary" id="check">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        Check salutations
      </button>
      <button class="btn" id="grab" title="Read the focused field on the active tab">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        Grab field
      </button>
    </div>

    <div class="list" id="results"></div>

    <details class="ref">
      <summary>Reference: bundled salutation list (<span id="ruleCount"></span>)</summary>
      <div id="ruleList"></div>
    </details>
  </div>
  <div class="toast" id="toast"></div>
  <script src="rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
