<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Terrarium</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="panel">
  <div class="terrarium">
    <svg id="plantSvg" viewBox="0 0 200 190" aria-label="Your terrarium plant"></svg>
    <div class="stage-label" id="stageLabel">Seed</div>
    <div class="mood" id="moodLabel"></div>
  </div>

  <div class="meters">
    <label class="meter-row">Water
      <div class="meter"><div class="fill water-fill" id="waterFill"></div></div>
      <span class="meter-num" id="waterNum">0</span>
    </label>
    <label class="meter-row">Growth
      <div class="meter"><div class="fill growth-fill" id="growthFill"></div></div>
      <span class="meter-num" id="growthNum">0</span>
    </label>
  </div>

  <div class="btn-row">
    <button class="btn primary" id="waterBtn">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7 17.7 9a8 8 0 1 1-11.4 0z"/></svg>
      Water
    </button>
    <button class="btn" id="feedBtn">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-8"/><path d="M12 14c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 14c0-4-3-7-8-7 0 4 3 7 8 7z"/></svg>
      Feed
    </button>
    <button class="btn ghost" id="replantBtn">Replant</button>
  </div>
  <div class="toast" id="toast"></div>

  <div class="card stats-card">
    <div class="stats-grid">
      <div class="stat"><span class="stat-num" id="statWaters">0</span><span class="stat-lbl">waterings</span></div>
      <div class="stat"><span class="stat-num" id="statFeeds">0</span><span class="stat-lbl">feedings</span></div>
      <div class="stat"><span class="stat-num" id="statAge">0d</span><span class="stat-lbl">plant age</span></div>
    </div>
    <div class="note">Grows in real time while you browse — even with the panel closed.</div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
