<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Asteroids — Page Overlay Game</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3 8-3 10-3-10z"/><path d="M5 5l2 2M19 5l-2 2"/></svg>
    <div>
      <h1>Retro Asteroids</h1>
      <p class="sub">Page overlay game</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span><strong>Game overlay only.</strong> It never touches page elements — it draws on a removable canvas. Esc removes every trace.</span>
  </div>

  <div class="stats">
    <div class="stat"><span class="k">Best</span><span class="v" id="best">0</span></div>
    <div class="stat"><span class="k">Games</span><span class="v" id="games">0</span></div>
  </div>

  <button id="startBtn" class="btn primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 4l14 8-14 8z"/></svg>
    Blast off on this tab
  </button>
  <button id="stopBtn" class="btn ghost">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    Remove overlay
  </button>

  <div class="keys">
    <div><kbd>←</kbd><kbd>→</kbd> rotate</div>
    <div><kbd>↑</kbd> thrust</div>
    <div><kbd>Space</kbd> shoot</div>
    <div><kbd>Esc</kbd> quit</div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
