<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Check Journal</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="app-header">
  <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
  <div>
    <h1>Image Check</h1>
    <p class="subtitle">Reverse-search journal</p>
  </div>
</header>

<p class="honest-banner">Your journal — <strong>launches searches, doesn't analyze</strong>. You decide the verdict.</p>

<section class="card">
  <label class="field-label" for="desc">What does the image show?</label>
  <textarea id="desc" rows="2" placeholder="e.g. Crowd photo shared as a recent protest…"></textarea>
  <label class="field-label" for="src">Image URL (optional — enables direct search)</label>
  <input id="src" type="url" placeholder="https://…">
  <label class="field-label" for="verdict">Your verdict</label>
  <select id="verdict">
    <option value="Undecided">Undecided</option>
    <option value="Looks real">Looks real</option>
    <option value="Edited / manipulated">Edited / manipulated</option>
    <option value="Misattributed">Misattributed (real image, wrong context)</option>
    <option value="AI-generated">AI-generated</option>
  </select>
  <label class="field-label" for="notes">Your notes</label>
  <textarea id="notes" rows="2" placeholder="What you found, odd details…"></textarea>
  <button id="saveBtn" class="primary-btn" disabled>Save entry</button>
</section>

<section class="card">
  <h2>My image log <span class="count" id="count">0</span></h2>
  <input id="filter" class="filter" type="search" placeholder="Filter entries…">
  <div id="entries" class="entries"><p class="empty">No entries yet.</p></div>
  <button id="clearBtn" class="ghost-btn danger">Clear all</button>
</section>

<script src="popup.js"></script>
</body>
</html>
