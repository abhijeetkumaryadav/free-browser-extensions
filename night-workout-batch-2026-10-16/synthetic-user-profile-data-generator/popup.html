<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Profile Generator</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M17 8l2 2 4-4"/></svg>
    <div class="titles"><h1>Test Profile Generator</h1><p>Dev fake data</p></div>
  </header>

  <div class="banner" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
    <span><strong>TEST DATA ONLY</strong> — obviously fake profiles for form testing. Never usable as real identities. Nothing leaves this device.</span>
  </div>

  <div class="controls">
    <label class="field"><span>Quantity</span>
      <input id="qty" type="number" min="1" max="20" value="3">
    </label>
    <label class="field"><span>Fields</span>
      <div class="checks" id="fields">
        <label><input type="checkbox" data-f="name" checked> Name</label>
        <label><input type="checkbox" data-f="email" checked> Email</label>
        <label><input type="checkbox" data-f="phone" checked> Phone</label>
        <label><input type="checkbox" data-f="address" checked> Address</label>
        <label><input type="checkbox" data-f="company" checked> Company</label>
        <label><input type="checkbox" data-f="dob" checked> DOB</label>
      </div>
    </label>
    <button id="generate" class="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      Generate
    </button>
  </div>

  <section class="results" id="results" aria-live="polite"></section>

  <footer class="foot">
    <button id="copyAll" class="ghost" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy all as JSON
    </button>
    <span id="status" class="status"></span>
  </footer>
</main>
<script src="popup.js"></script>
</body>
</html>
