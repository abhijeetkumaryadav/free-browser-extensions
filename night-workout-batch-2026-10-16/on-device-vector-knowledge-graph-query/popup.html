<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyword Knowledge Graph</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M10.5 7.2 6.8 16.8M13.5 7.2l3.7 9.6M7.5 19h9"/></svg>
    <div>
      <h1>Keyword Graph</h1>
      <p class="sub">Notes + links, searched by keyword</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Keyword graph — <strong>not</strong> vector search. No embeddings, no AI, 100% local.</span>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="graph" role="tab">Graph</button>
    <button class="tab" data-tab="notes" role="tab">Notes</button>
    <button class="tab" data-tab="search" role="tab">Search</button>
  </nav>

  <!-- GRAPH TAB -->
  <section class="pane active" id="pane-graph">
    <canvas id="graphCanvas" width="348" height="240"></canvas>
    <div class="row between">
      <span class="stat" id="statCounts">0 notes · 0 links</span>
      <div class="row">
        <button class="btn small ghost" id="btnShuffle">Shuffle</button>
        <button class="btn small ghost" id="btnClearAll">Clear</button>
      </div>
    </div>
  </section>

  <!-- NOTES TAB -->
  <section class="pane" id="pane-notes">
    <label class="field">
      <span>New note title</span>
      <input type="text" id="inTitle" maxlength="80" placeholder="e.g. Project ideas">
    </label>
    <label class="field">
      <span>Note body</span>
      <textarea id="inBody" rows="3" maxlength="2000" placeholder="Write the note…"></textarea>
    </label>
    <label class="field">
      <span>Link to (hold Ctrl/Cmd to pick many)</span>
      <select id="selLinks" multiple size="4"></select>
    </label>
    <div class="row">
      <button class="btn primary" id="btnAddNote">Add note</button>
      <button class="btn ghost" id="btnResetForm">Reset</button>
    </div>
    <ul class="note-list" id="noteList"></ul>
  </section>

  <!-- SEARCH TAB -->
  <section class="pane" id="pane-search">
    <div class="row">
      <input type="text" id="inQuery" placeholder="Search keywords…" class="grow">
      <button class="btn primary" id="btnSearch">Search</button>
    </div>
    <p class="hint">Ranked by keyword frequency (TF). Title matches weigh 3×.</p>
    <ul class="result-list" id="resultList"></ul>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
