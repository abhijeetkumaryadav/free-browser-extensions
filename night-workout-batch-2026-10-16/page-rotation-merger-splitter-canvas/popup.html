<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Canvas</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    <div>
      <h1>Image Canvas</h1>
      <p class="sub">Rotate &amp; merge images</p>
    </div>
  </header>

  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Images only — not PDF pages. Files stay on your device; nothing is uploaded.</span>
  </div>

  <section class="card">
    <h2>Images</h2>
    <div class="row">
      <label class="btn file">Load images<input id="files" type="file" accept="image/*" multiple hidden></label>
      <button id="clearBtn" class="btn danger">Clear</button>
    </div>
    <div id="thumbs" class="thumbs"><p class="empty">No images loaded.</p></div>
  </section>

  <section class="card">
    <h2>Layout</h2>
    <div class="row">
      <button id="sideBtn" class="btn primary">Side-by-side</button>
      <button id="stackBtn" class="btn">Stacked</button>
    </div>
    <label class="fld"><span>Gap (px)</span><input id="gap" type="number" min="0" max="100" value="8"></label>
    <label class="fld"><span>Background</span><input id="bg" type="color" value="#141419"></label>
  </section>

  <section class="card">
    <h2>Preview</h2>
    <canvas id="canvas"></canvas>
    <div class="row">
      <button id="dlBtn" class="btn primary" disabled>Download PNG</button>
    </div>
  </section>

  <div class="foot"><span class="hint">Rotations persist locally.</span></div>
</div>
<script src="popup.js"></script>
</body>
</html>
