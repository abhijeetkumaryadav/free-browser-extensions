<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
  </div>
  <div>
    <h1>Stretch Break</h1>
    <p class="sub">Custom push notifier</p>
  </div>
</header>

<div class="notice">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
  <span>Your messages — reminders only.</span>
</div>

<section class="card">
  <label class="row switch-row">
    <span>Reminders enabled</span>
    <input type="checkbox" id="enabled" class="switch">
  </label>
  <div class="row">
    <label for="interval">Every</label>
    <span><input type="range" id="interval" min="10" max="180" step="5" value="60"> <b id="intervalVal">60 min</b></span>
  </div>
  <label class="field-label" for="messages">Your reminder messages (one per line)</label>
  <textarea id="messages" rows="5" placeholder="Stand up and stretch&#10;Roll your shoulders&#10;Look away from the screen"></textarea>
  <div class="btn-row">
    <button id="testBtn" class="primary">Send test now</button>
    <button id="saveBtn" class="ghost">Save</button>
  </div>
  <p class="hint" id="saveHint"></p>
</section>

<section class="card">
  <div class="row">
    <h2>Done log</h2>
    <button id="clearLog" class="ghost small">Clear</button>
  </div>
  <ul id="log" class="log"></ul>
  <p class="hint" id="emptyLog">Nothing logged yet — tap "Done" on a notification.</p>
</section>

<footer>r dx marathon · local only</footer>
<script src="popup.js"></script>
</body>
</html>
