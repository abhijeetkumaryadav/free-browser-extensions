<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radiant Point</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10"/><path d="M12 13l-3.5 7"/><path d="M12 13l3.5 7"/><path d="M6 4l2 2"/><path d="M18 4l-2 2"/><circle cx="12" cy="3" r="1.4"/></svg>
    <div>
      <h1>Radiant Point</h1>
      <p class="sub">Which way to face for tonight's meteors</p>
    </div>
  </header>

  <div class="notice">Approximate geometry only — spherical-astronomy math on bundled shower data. Not weather-aware.</div>

  <section class="loc">
    <label>Latitude
      <input id="lat" type="number" step="0.1" min="-90" max="90" placeholder="e.g. 51.5">
    </label>
    <label>Longitude
      <input id="lon" type="number" step="0.1" min="-180" max="180" placeholder="e.g. -0.1">
    </label>
    <button id="useNow" class="btn secondary" type="button">Use now</button>
  </section>

  <div class="rowline">
    <label class="dt">Date &amp; time
      <input id="when" type="datetime-local">
    </label>
  </div>

  <section id="list" class="list"></section>

  <footer>Radiants move across the sky — recheck hourly. Meteors streak <em>away</em> from the radiant.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
