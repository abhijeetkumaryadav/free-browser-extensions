<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signature Stamp Pad</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
    <div>
      <h1>Signature Stamp Pad</h1>
      <p class="sub">Your signature stamps — not legal e-sign</p>
    </div>
  </header>

  <div class="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Draw your own stamp and place it on images. This is not a legal electronic signature and does not work on PDF files.</span>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="draw">Draw</button>
    <button class="tab" data-tab="stamps">Stamps</button>
    <button class="tab" data-tab="place">Place</button>
  </nav>

  <section class="pane active" id="pane-draw">
    <label>Name this stamp
      <input id="stampName" type="text" maxlength="60" placeholder="e.g. Contract signature">
    </label>
    <canvas id="pad" width="336" height="140"></canvas>
    <div class="row">
      <button id="clearPad" class="ghost">Clear</button>
      <button id="saveStamp" class="primary grow">Save stamp</button>
    </div>
    <p class="msg" id="drawMsg"></p>
  </section>

  <section class="pane" id="pane-stamps">
    <p class="count" id="stampCount"></p>
    <div id="stampList"></div>
  </section>

  <section class="pane" id="pane-place">
    <label>Load a local image
      <input id="imgFile" type="file" accept="image/*">
    </label>
    <label>Choose stamp
      <select id="pickStamp"></select>
    </label>
    <label>Stamp size (% of image width)
      <input id="stampSize" type="range" min="5" max="40" value="18">
    </label>
    <canvas id="out"></canvas>
    <div class="row">
      <button id="download" class="primary grow">Download signed image</button>
    </div>
    <p class="msg" id="placeMsg"></p>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
