<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glyph Tetris</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="card">
  <header class="head">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <div>
      <h1>Glyph Tetris</h1>
      <p class="sub">offline game · blocks are text characters</p>
    </div>
  </header>

  <div class="hud">
    <div class="stat"><span class="lbl">Score</span><b id="score">0</b></div>
    <div class="stat"><span class="lbl">Level</span><b id="level">1</b></div>
    <div class="stat"><span class="lbl">Lines</span><b id="lines">0</b></div>
    <div class="stat"><span class="lbl">Best</span><b id="best">0</b></div>
  </div>

  <div class="play">
    <canvas id="board" width="200" height="400"></canvas>
    <div class="side">
      <p class="lbl">Next</p>
      <canvas id="next" width="80" height="80"></canvas>
      <button id="startBtn" class="btn">Start / Restart</button>
      <button id="pauseBtn" class="btn ghost">Pause</button>
    </div>
  </div>

  <details class="cfg">
    <summary>Character sets</summary>
    <label>Glyphs (blocks are drawn with these, cycling)
      <input id="glyphs" type="text" maxlength="40" value="█▓▒░#@$%&*+?">
    </label>
    <p class="hint">Keys: ← → move · ↓ soft drop · ↑ rotate · Space hard drop · P pause</p>
  </details>
</div>
<script src="popup.js"></script>
</body>
</html>
