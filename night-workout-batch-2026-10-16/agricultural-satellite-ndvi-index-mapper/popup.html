<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDVI Grid — Field Health Mapper</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="hdr">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4-3 8-7.5 8-12a8 8 0 1 0-16 0c0 4.5 4 9 8 12z"/><path d="M12 22V12"/><path d="M12 12c0-3 2-5 5-5"/></svg>
    <div>
      <h1>NDVI Grid</h1>
      <p class="sub">Field health mapper</p>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="calc">Calculator</button>
    <button class="tab" data-tab="grid">Field Grid</button>
    <button class="tab" data-tab="bands">Bands</button>
  </nav>

  <!-- Calculator tab -->
  <section class="panel active" id="tab-calc">
    <div class="field-row">
      <label>NIR reflectance (0–1)
        <input type="number" id="nir" min="0" max="1" step="0.01" value="0.55" placeholder="0.00 – 1.00">
      </label>
      <label>Red reflectance (0–1)
        <input type="number" id="red" min="0" max="1" step="0.01" value="0.08" placeholder="0.00 – 1.00">
      </label>
    </div>
    <div class="sample-row">
      <span class="lbl">Samples:</span>
      <div class="chips" id="samples"></div>
    </div>
    <button class="btn primary" id="calcBtn">Compute NDVI</button>
    <div class="result-card" id="resultCard" hidden>
      <div class="ndvi-big" id="ndviVal">—</div>
      <div class="ndvi-band" id="ndviBand">—</div>
      <p class="formula">NDVI = (NIR − Red) / (NIR + Red)</p>
    </div>
  </section>

  <!-- Field grid tab -->
  <section class="panel" id="tab-grid">
    <div class="brush-row">
      <span class="lbl">Paint value</span>
      <input type="range" id="brushVal" min="-1" max="1" step="0.05" value="0.6">
      <span class="brush-num" id="brushNum">0.60</span>
    </div>
    <div class="presets" id="presets"></div>
    <div class="grid-wrap">
      <div class="grid" id="fieldGrid"></div>
    </div>
    <div class="grid-stats">
      <div class="stat"><span class="k">Avg NDVI</span><span class="v" id="avgNdvi">—</span></div>
      <div class="stat"><span class="k">Painted cells</span><span class="v" id="cellCount">0 / 64</span></div>
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="importBtn">Import CSV</button>
      <button class="btn ghost" id="exportBtn">Export CSV</button>
      <button class="btn danger" id="clearBtn">Clear</button>
    </div>
    <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
  </section>

  <!-- Bands reference tab -->
  <section class="panel" id="tab-bands">
    <div class="band-list" id="bandList"></div>
  </section>

  <footer class="foot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>Educational estimates computed locally. Not live satellite data — always verify in the field.</span>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
