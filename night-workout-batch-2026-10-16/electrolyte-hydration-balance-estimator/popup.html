<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydration Drink Logger</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="head">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7s6.5 7 6.5 11.3a6.5 6.5 0 1 1-13 0C5.5 9.7 12 2.7 12 2.7z"/></svg>
    <div>
      <h1>Hydration Logger</h1>
      <p class="sub">Water + electrolyte drinks</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span><strong>You log — not a balance estimate, not medical advice.</strong> This only tracks what you tell it.</span>
  </div>

  <section class="totals">
    <div class="total-card">
      <span class="big" id="waterTotal">0 ml</span>
      <span class="lbl">Water today</span>
    </div>
    <div class="total-card">
      <span class="big" id="electroTotal">0 ml</span>
      <span class="lbl">Electrolyte drinks</span>
    </div>
  </section>

  <section class="add">
    <div class="seg" id="typeSeg">
      <button data-type="water" class="on">Water</button>
      <button data-type="electrolyte">Electrolyte</button>
    </div>
    <div class="row">
      <input type="number" id="amount" min="1" max="5000" step="10" value="250" aria-label="Amount in milliliters">
      <span class="unit">ml</span>
      <button id="logBtn" class="primary">Log</button>
    </div>
    <div class="quick">
      <button data-amt="250">250</button>
      <button data-amt="500">500</button>
      <button data-amt="750">750</button>
      <button data-amt="1000">1L</button>
    </div>
  </section>

  <section class="log">
    <h2>Today's entries <span id="count"></span></h2>
    <ul id="entryList"></ul>
    <div class="row-between">
      <button id="undoBtn" class="ghost small">Undo last</button>
      <button id="clearBtn" class="ghost small">Clear today</button>
    </div>
    <h2>Last 7 days</h2>
    <div id="history" class="history"></div>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
