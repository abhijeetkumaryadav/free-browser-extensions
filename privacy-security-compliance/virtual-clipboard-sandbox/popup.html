<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Clipboard Sandbox</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header glass">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <!-- Lucide-style clipboard icon (stroke) -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>
        </span>
        <div class="brand-text">
          <h1>Clipboard Sandbox</h1>
          <p class="subtitle"><span id="clipCount">0</span> clips stored · on-device only</p>
        </div>
      </div>
      <button id="clearAllBtn" class="btn btn-danger btn-sm" title="Delete all clips">Clear</button>
    </header>

    <!-- Search -->
    <div class="search-wrap glass">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search clips…" autocomplete="off" spellcheck="false">
    </div>

    <!-- Quick actions -->
    <div class="actions">
      <button id="captureBtn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        Capture selection
      </button>
      <label class="toggle">
        <input type="checkbox" id="autoCaptureToggle" checked>
        <span class="track"><span class="thumb"></span></span>
        Auto-capture copies
      </label>
    </div>

    <!-- Clip list -->
    <main id="clipList" class="clip-list"></main>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state glass hidden">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      <p>No clips yet.<br>Copy some text, or hit “Capture selection”.</p>
    </div>

    <footer class="footer">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Private by design — clips never leave this device
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
