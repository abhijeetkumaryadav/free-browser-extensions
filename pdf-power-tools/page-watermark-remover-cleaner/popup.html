<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanSweep — PDF Annotation Cleaner</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg></div>
    <div>
      <h1>CleanSweep</h1>
      <p class="subtitle">PDF annotation cleaner</p>
    </div>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>Removes <strong>annotations, stamps &amp; comments</strong> from your own PDFs.
    It <strong>cannot</strong> remove baked-in image watermarks or text printed into the page content.</span>
  </div>

  <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Choose a PDF file">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="11"/><polyline points="9 14 12 11 15 14"/></svg>
    <div><strong>Drop a PDF here</strong> or click to choose</div>
    <div class="hint">Processed 100% on-device · original never modified</div>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
  </div>

  <div id="docSection" class="hidden">
    <div class="doc-bar glass">
      <div class="doc-info">
        <div class="doc-name" id="docName">—</div>
        <div class="doc-meta" id="docMeta">—</div>
      </div>
      <button class="btn ghost" id="closeBtn">Close</button>
    </div>
    <div id="pageList" class="page-list"></div>
    <div class="actions">
      <button class="btn danger" id="removeSelectedBtn" disabled>Remove selected (0)</button>
      <button class="btn ghost" id="removeAllBtn" disabled>Remove all</button>
    </div>
    <button class="btn primary wide" id="downloadBtn" disabled>Download cleaned PDF</button>
  </div>

  <div id="status" class="status"></div>
</div>
<script src="vendor/pdf-lib.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
