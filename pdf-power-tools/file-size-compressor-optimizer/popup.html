<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="topbar">
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
  <div>
    <h1>ShrinkLab</h1>
    <p class="sub">Compress images on-device — nothing is uploaded</p>
  </div>
</header>

<label class="filebtn" id="dropzone">
  <input type="file" id="files" accept="image/*" multiple hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
  <span>Drop images here or click to choose</span>
</label>

<div class="settings panel">
  <label class="field">Max dimension (px)
    <select id="maxdim">
      <option value="0">No resize</option>
      <option value="800">800</option>
      <option value="1200">1200</option>
      <option value="1600" selected>1600</option>
      <option value="2048">2048</option>
    </select>
  </label>
  <label class="field">Format
    <select id="format">
      <option value="image/jpeg">JPEG</option>
      <option value="image/webp" selected>WebP</option>
      <option value="image/png">PNG (lossless)</option>
    </select>
  </label>
  <label class="field">Quality <span id="qval" class="rangeval">80</span>
    <input id="quality" type="range" min="10" max="100" value="80">
  </label>
  <p class="hint">Lower quality = smaller files. JPEG/WebP are lossy; PNG ignores quality. Images only — no video/PDF.</p>
</div>

<div id="summary" class="summary hidden"></div>
<div id="list" class="list"></div>
<button id="downloadall" class="primary wide hidden">Download all compressed</button>

<script src="popup.js"></script>
</body>
</html>
