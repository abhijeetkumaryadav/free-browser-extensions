<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="topbar">
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
  <div>
    <h1>SignStamp</h1>
    <p class="sub">Draw a signature, stamp it onto your own PDFs</p>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="sign">Signature</button>
  <button class="tab" data-tab="stamp">Stamp PDF</button>
</nav>

<section id="tab-sign" class="panel">
  <div class="seg">
    <button class="segbtn active" id="mode-draw">Draw</button>
    <button class="segbtn" id="mode-type">Type</button>
  </div>
  <canvas id="pad" width="332" height="140"></canvas>
  <div id="typewrap" class="hidden">
    <input id="typename" type="text" placeholder="Type your name" maxlength="40">
    <select id="typefont">
      <option value="'Segoe Script', 'Brush Script MT', cursive">Script</option>
      <option value="Georgia, serif">Serif</option>
      <option value="'Courier New', monospace">Mono</option>
    </select>
  </div>
  <div class="row">
    <button id="clearpad" class="ghost">Clear</button>
    <button id="savepreset" class="primary">Save signature</button>
  </div>
  <h2>Saved signatures</h2>
  <div id="presets" class="presets"></div>
</section>

<section id="tab-stamp" class="panel hidden">
  <label class="filebtn">
    <input type="file" id="pdffile" accept="application/pdf" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
    <span id="pdfname">Choose a PDF</span>
  </label>
  <p id="pdfinfo" class="hint"></p>
  <label class="field">Pages (e.g. 1, 3 or "all")
    <input id="pages" type="text" placeholder="all" value="all">
  </label>
  <p class="hint">Click on the page preview to place the signature</p>
  <div id="pagepreview" class="pagepreview"><div id="sigmark" class="hidden">✒</div></div>
  <label class="field">Signature width (pts)
    <input id="sigwidth" type="range" min="40" max="220" value="120">
    <span id="sigwidthval" class="rangeval">120</span>
  </label>
  <label class="field">Active signature
    <select id="activesig"></select>
  </label>
  <button id="stampbtn" class="primary wide" disabled>Stamp &amp; download PDF</button>
  <p class="disclaimer">Image stamp only — not a cryptographic digital signature. It does not certify document integrity or identity.</p>
</section>

<script src="vendor/pdf-lib.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
