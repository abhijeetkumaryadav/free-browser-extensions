<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
<title>DraftVault</title>
</head>
<body>
<div class="app">
  <header class="app-header">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    <div>
      <h1>DraftVault</h1>
      <p class="subtitle">Autosaving drafts &middot; local only</p>
    </div>
    <span id="saveStatus" class="status idle">idle</span>
  </header>

  <section class="panel editor-panel">
    <input id="draftTitle" class="title-input" type="text" maxlength="80" placeholder="Draft title&hellip;" spellcheck="false">
    <textarea id="draftBody" class="editor" spellcheck="true" placeholder="Start writing&hellip; everything is autosaved as you type."></textarea>
    <div class="row meta-row">
      <span id="wordCount" class="meta">0 words</span>
      <span id="lastSaved" class="meta">Not saved yet</span>
    </div>
    <div class="row">
      <button id="newDraftBtn" class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New draft
      </button>
      <button id="exportBtn" class="btn ghost">Export .txt</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title row-between">Drafts <button id="clearAllBtn" class="link-btn">delete all</button></div>
    <div id="draftList" class="draft-list"></div>
    <p id="draftEmpty" class="empty">No drafts yet — your writing autosaves here.</p>
  </section>

  <p class="foot">100% local. Nothing is uploaded anywhere.</p>
  <div id="toast" class="toast" role="status"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
