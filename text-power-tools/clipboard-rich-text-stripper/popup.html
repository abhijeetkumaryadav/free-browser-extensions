<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
<title>PlainStrip</title>
</head>
<body>
<div class="app">
  <header class="app-header">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
    <div>
      <h1>PlainStrip</h1>
      <p class="subtitle">Rich text &rarr; clean plain text</p>
    </div>
  </header>

  <section class="panel">
    <div class="panel-title">Input</div>
    <div id="pasteArea" class="paste-area" contenteditable="true" spellcheck="false"
         data-placeholder="Paste rich/formatted text here&#10;(Ctrl+V)&hellip;"></div>
    <div class="row">
      <button id="stripClipboardBtn" class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        Strip clipboard
      </button>
      <button id="clearInputBtn" class="btn ghost">Clear</button>
    </div>
    <p class="hint">Clipboard is read only when you click &ldquo;Strip clipboard&rdquo;.</p>

    <div class="options">
      <label class="opt"><input type="checkbox" id="optLineBreaks" checked><span>Keep line breaks</span></label>
      <label class="opt"><input type="checkbox" id="optTrimLines" checked><span>Trim each line</span></label>
      <label class="opt"><input type="checkbox" id="optCollapseBlanks" checked><span>Collapse blank lines</span></label>
      <label class="opt"><input type="checkbox" id="optCollapseSpaces" checked><span>Collapse spaces</span></label>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">Output <span id="charCount" class="count"></span></div>
    <textarea id="outputArea" class="output" readonly spellcheck="false" placeholder="Stripped plain text appears here&hellip;"></textarea>
    <div class="row">
      <button id="copyBtn" class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy result
      </button>
      <button id="saveBtn" class="btn ghost">Save to history</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title row-between">History <button id="clearHistoryBtn" class="link-btn">clear all</button></div>
    <div id="historyList" class="history"></div>
    <p id="historyEmpty" class="empty">No stripped texts yet.</p>
  </section>

  <div id="toast" class="toast" role="status"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
