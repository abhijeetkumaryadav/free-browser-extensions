<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero-Stock Alert</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="glass">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    <div><h1>Stock Alert</h1><p id="pageHost">—</p></div>
    <button id="watch" class="primary">Watch page</button>
  </header>
  <main>
    <section id="currentCard" class="glass card" hidden>
      <h2>This page</h2>
      <div class="prod-title" id="cTitle">—</div>
      <div class="cmp">
        <div><span>Saved</span><b id="cSaved">—</b></div>
        <div><span>Now</span><b id="cNow">—</b></div>
      </div>
      <div id="badges"></div>
      <button id="rebase" class="ghost">Update baseline to current</button>
    </section>
    <div id="notWatched" class="empty">This page isn’t watched. Hit <b>Watch page</b> on a product to track its price and availability.</div>
    <section class="glass card" id="listCard" hidden>
      <h2>Watchlist</h2>
      <div id="list"></div>
    </section>
  </main>
<script src="popup.js"></script>
</body>
</html>
