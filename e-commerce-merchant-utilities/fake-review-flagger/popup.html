<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 15h.01"/></svg>
      </span>
      <div>
        <h1>Fake Review Flagger</h1>
        <p class="subtitle">Trust-score this page's reviews</p>
      </div>
    </div>
    <button id="scanBtn" class="scan-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      <span>Scan page</span>
    </button>
  </header>

  <main>
    <section id="verdictCard" class="card verdict hidden" aria-live="polite">
      <div class="verdict-top">
        <div class="score-ring" id="scoreRing"><span id="scoreNum">–</span></div>
        <div class="verdict-text">
          <p class="verdict-label" id="verdictLabel">Not scanned</p>
          <p class="verdict-host" id="verdictHost"></p>
        </div>
      </div>
      <ul id="flagList" class="flags"></ul>
    </section>

    <section id="emptyState" class="card empty">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <p>Open a product page, then hit <strong>Scan page</strong> to flag suspicious review patterns.</p>
    </section>

    <section class="card history">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        Recent scans
      </h2>
      <ul id="historyList" class="history-list"></ul>
      <p id="historyEmpty" class="muted">No scans yet.</p>
    </section>
  </main>

  <footer>
    <p class="privacy">All analysis runs on-device. Nothing leaves your browser.</p>
  </footer>

<script src="popup.js"></script>
</body>
</html>
