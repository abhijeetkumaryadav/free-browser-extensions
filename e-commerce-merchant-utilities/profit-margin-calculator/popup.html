<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profit Margin Calculator</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="glass">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
    <div><h1>Margin Calculator</h1><p>Net profit · Breakeven ROAS</p></div>
  </header>
  <main>
    <section class="glass card">
      <h2>Inputs</h2>
      <div class="grid2">
        <label>Unit cost<input id="cost" type="number" min="0" step="0.01" placeholder="0.00"></label>
        <label>Sell price<input id="price" type="number" min="0" step="0.01" placeholder="0.00"></label>
        <label>Marketplace fee %<input id="fee" type="number" min="0" max="100" step="0.1" value="15"></label>
        <label>Ad spend / unit<input id="ads" type="number" min="0" step="0.01" value="0"></label>
        <label>Shipping / unit<input id="ship" type="number" min="0" step="0.01" value="0"></label>
        <label>Scenario name<input id="sname" type="text" maxlength="40" placeholder="e.g. Yoga mat"></label>
      </div>
      <div id="result" class="result" hidden>
        <div class="rrow"><span>Net profit / unit</span><b id="rProfit">—</b></div>
        <div class="rrow"><span>Net margin</span><b id="rMargin">—</b></div>
        <div class="rrow"><span>Breakeven ROAS</span><b id="rRoas">—</b></div>
        <div class="rrow"><span>Max ad spend / unit</span><b id="rMaxAd">—</b></div>
        <div id="verdict" class="verdict">—</div>
      </div>
      <button id="saveBtn" class="ghost">Save scenario</button>
    </section>
    <section class="glass card" id="histCard" hidden>
      <h2>Saved scenarios</h2>
      <div id="history"></div>
    </section>
  </main>
<script src="popup.js"></script>
</body>
</html>
