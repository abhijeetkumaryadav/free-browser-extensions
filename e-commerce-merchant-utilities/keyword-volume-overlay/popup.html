<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyword Volume Overlay</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="glass">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="2" y1="21" x2="22" y2="21"/></svg>
    <div>
      <h1>Keyword Volume</h1>
      <p id="pageHost">—</p>
    </div>
    <button id="analyze" class="primary">Analyze</button>
  </header>

  <main>
    <section id="results" class="glass card" hidden>
      <div class="sec-head">
        <h2>Top keywords</h2>
        <span id="wordCount" class="muted"></span>
      </div>
      <div id="kwList"></div>
      <p class="note">Volumes are heuristic on-device estimates for prioritization — not live search data.</p>
    </section>

    <section class="glass card" id="histCard" hidden>
      <h2>Recent analyses</h2>
      <div id="history"></div>
    </section>

    <div id="empty" class="empty">Hit <b>Analyze</b> on any page to extract its top keywords.</div>
  </main>
<script src="popup.js"></script>
</body>
</html>
