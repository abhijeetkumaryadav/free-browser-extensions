<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
    </span>
    <div>
      <h1>Heading Outline</h1>
      <p>Page structure navigator</p>
    </div>
  </header>

  <section class="card">
    <div class="btn-row">
      <button id="buildBtn" class="primary">Build outline</button>
    </div>
    <div id="stats" class="stats" aria-live="polite"></div>
    <div id="outline" class="outline" aria-live="polite"></div>
  </section>

  <footer class="disclaimer">
    Reads headings (h1–h6) on the active tab only. Nothing leaves your device.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
