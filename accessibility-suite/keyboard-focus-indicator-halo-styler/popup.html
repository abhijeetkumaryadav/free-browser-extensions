<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Halo</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="head">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/></svg>
    </span>
    <div>
      <h1>Focus Halo</h1>
      <p class="sub">Keyboard focus indicator styler</p>
    </div>
    <label class="switch" title="Enable / disable the halo">
      <input type="checkbox" id="enabled" checked>
      <span class="track"><span class="thumb"></span></span>
    </label>
  </header>

  <span class="lbl">Halo style</span>
  <div class="presets" id="presets">
    <button class="preset" data-style="ring" title="Solid ring">
      <svg viewBox="0 0 40 28"><rect x="6" y="5" width="28" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="3"/></svg>
      <span>Ring</span>
    </button>
    <button class="preset" data-style="glow" title="Glow">
      <svg viewBox="0 0 40 28"><rect x="6" y="5" width="28" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="3" opacity=".45"/><rect x="6" y="5" width="28" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="6" opacity=".2"/></svg>
      <span>Glow</span>
    </button>
    <button class="preset" data-style="underline" title="Underline">
      <svg viewBox="0 0 40 28"><rect x="6" y="5" width="28" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/><line x1="6" y1="23" x2="34" y2="23" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      <span>Under&shy;line</span>
    </button>
    <button class="preset" data-style="dashed" title="Dashed ring">
      <svg viewBox="0 0 40 28"><rect x="6" y="5" width="28" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="5 4"/></svg>
      <span>Dashed</span>
    </button>
  </div>

  <span class="lbl">Color</span>
  <div class="swatches" id="swatches">
    <button class="sw" data-color="#a3e635" style="--c:#a3e635" title="Lime"></button>
    <button class="sw" data-color="#22d3ee" style="--c:#22d3ee" title="Cyan"></button>
    <button class="sw" data-color="#f472b6" style="--c:#f472b6" title="Pink"></button>
    <button class="sw" data-color="#fbbf24" style="--c:#fbbf24" title="Amber"></button>
    <button class="sw" data-color="#a78bfa" style="--c:#a78bfa" title="Violet"></button>
    <button class="sw" data-color="#f87171" style="--c:#f87171" title="Red"></button>
    <label class="sw custom" title="Custom color">
      <input type="color" id="customColor" value="#a3e635">
      <span>+</span>
    </label>
  </div>

  <div class="ctl">
    <label for="thickness">Thickness <span id="thVal">3px</span></label>
    <input type="range" id="thickness" min="1" max="8" step="1" value="3">
  </div>

  <div class="toggles">
    <label class="check"><input type="checkbox" id="pulse" checked><span>Pulse animation</span></label>
    <label class="check"><input type="checkbox" id="keyboardOnly" checked><span>Keyboard focus only <em>(ignore mouse clicks)</em></span></label>
  </div>

  <div class="demo">
    <span class="lbl">Live preview — press <kbd>Tab</kbd> here</span>
    <div class="demo-row">
      <button class="demo-btn">Button</button>
      <a class="demo-btn" href="#">Link</a>
      <input class="demo-btn" placeholder="Input">
    </div>
  </div>

  <p class="note">The halo is a pure CSS overlay. No browsing data is read, stored, or sent anywhere. Content scripts can't run on <code>chrome://</code> pages.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
