<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alt Text Gap Finder</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="panel">
  <header class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
    <div>
      <h1>Alt Text Gap Finder</h1>
      <p class="sub">Spot images missing alt text</p>
    </div>
  </header>

  <div class="actions">
    <button id="scanBtn" class="btn primary">Scan page</button>
    <button id="clearBtn" class="btn ghost">Clear badges</button>
  </div>

  <div id="status" class="status">Click “Scan page” to audit the active tab.</div>

  <div id="summary" class="summary hidden">
    <div class="stat"><span id="countMissing" class="stat-num">0</span><span class="stat-label">missing alt</span></div>
    <div class="stat"><span id="countTotal" class="stat-num">0</span><span class="stat-label">images total</span></div>
    <div class="stat"><span id="countEmpty" class="stat-num">0</span><span class="stat-label">empty alt</span></div>
  </div>

  <ul id="issueList" class="issues"></ul>

  <div class="footer">
    <button id="exportBtn" class="btn ghost small hidden">Export report (JSON)</button>
    <p class="note">Suggestions are filename heuristics, <strong>not AI vision</strong> — always review before using.</p>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
