<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="glass">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="m13 18 2 2-2 2"/></svg>
        <h1>Tab Switcher</h1>
      </div>
      <span class="count" id="tabCount">0</span>
    </header>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search tabs by title or URL…" autocomplete="off" spellcheck="false">
      <kbd class="hint-kbd">↑↓ · ⏎ · esc</kbd>
    </div>

    <ul id="list" class="list"></ul>

    <footer class="glass footer">
      <span class="kbd-row">
        <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>⏎</kbd> jump · <kbd>⌫</kbd> close · <kbd>esc</kbd> dismiss
      </span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
