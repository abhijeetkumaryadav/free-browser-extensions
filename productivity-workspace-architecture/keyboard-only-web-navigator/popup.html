<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard-Only Web Navigator</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="glass">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"/></svg>
    <div>
      <h1>Keyboard Navigator</h1>
      <p>Vim-style browsing, no mouse needed</p>
    </div>
    <label class="switch" title="Enable or disable shortcuts">
      <input type="checkbox" id="enabled" checked>
      <span></span>
    </label>
  </header>
  <main>
    <section class="glass card">
      <h2>Scroll step</h2>
      <div class="row">
        <input id="step" type="number" min="20" max="600" step="10" value="120">
        <span class="unit">px per j / k press</span>
      </div>
    </section>
    <section class="glass card">
      <h2>Cheatsheet</h2>
      <div id="cheat" class="cheat"></div>
      <p class="note">Shortcuts are ignored while you type in inputs, text areas, or editors. Press <kbd>?</kbd> on any page to show this list as an overlay.</p>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
