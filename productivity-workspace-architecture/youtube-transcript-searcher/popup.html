<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <span class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="3"/>
        <path d="M6 12h4M6 15.5h7M14 12h4"/>
      </svg>
    </span>
    <div class="brand-text">
      <h1>Transcript Searcher</h1>
      <p id="video-title" class="sub">YouTube video transcript</p>
    </div>
  </header>

  <main>
    <!-- Status / error panel -->
    <div id="notice" class="notice hidden"></div>

    <!-- Track picker (populated by content script) -->
    <div id="track-row" class="track-row hidden">
      <label for="track-select">Captions</label>
      <select id="track-select"></select>
    </div>

    <!-- Search -->
    <div id="search-row" class="search-row hidden">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
      </span>
      <input id="search" type="text" placeholder="Search transcript…" autocomplete="off">
      <span id="match-count" class="match-count"></span>
    </div>

    <!-- Transcript lines -->
    <div id="lines" class="lines" role="list"></div>

    <div id="empty" class="empty hidden">
      <p>No transcript available for this video.</p>
      <p class="hint">The video needs published or auto-generated captions.</p>
    </div>
  </main>

  <footer class="foot">
    <span id="cue-count"></span>
    <span class="dot">·</span>
    <span>Click a line to jump the video</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
