<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Speed &amp; Pitch Controller</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="glass">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"/></svg>
    <div><h1>Speed Control</h1><p id="pageHost">—</p></div>
    <button id="reset" class="ghost-btn" title="Reset to normal speed">1x</button>
  </header>
  <main>
    <section class="glass card hero">
      <div class="speed"><b id="rateLabel">1.00x</b><span>playback speed</span></div>
      <input type="range" id="rate" min="0.25" max="4" step="0.25" value="1" aria-label="Playback speed">
      <div class="ticks"><span>0.25x</span><span>4x</span></div>
      <div class="presets">
        <button data-rate="0.5">0.5x</button>
        <button data-rate="1">1x</button>
        <button data-rate="1.25">1.25x</button>
        <button data-rate="1.5">1.5x</button>
        <button data-rate="2">2x</button>
      </div>
    </section>
    <section class="glass card">
      <label class="switch-row"><span>Preserve pitch</span><input type="checkbox" id="pitch" checked></label>
      <p class="note">Keeps voices sounding natural at higher speeds.</p>
    </section>
    <section class="glass card">
      <div class="stats">
        <div><span>Media found</span><b id="stCount">—</b></div>
        <div><span>Current rate</span><b id="stRate">—</b></div>
      </div>
      <p id="msg" class="note"></p>
    </section>
    <section class="glass card">
      <div class="site-row">
        <div class="site-info"><b id="siteName">This site</b><span id="siteNote" class="note">No saved speed</span></div>
        <button id="remember" class="primary-sm">Remember</button>
        <button id="forget" class="ghost-sm" hidden>Forget</button>
      </div>
    </section>
  </main>
<script src="popup.js"></script>
</body>
</html>
