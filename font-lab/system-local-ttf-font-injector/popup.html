<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FontStack</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
      <div>
        <h1>FontStack</h1>
        <p class="sub">System font stacks for this page</p>
      </div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Ready</span></div>
  </header>

  <div class="hint" id="honestNote">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>System fonts only — extensions can't browse or upload your local TTF files. Everything renders with fonts already on your device.</span>
  </div>

  <div class="groups" id="groups"></div>

  <footer class="actions">
    <button id="restore" class="btn ghost" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      Restore original fonts
    </button>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
