<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FontForce</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="panel">
  <header class="head">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 8 4l4 16"/><path d="M6 14h4"/><path d="M16 20V8"/><path d="M16 4c-2.5 0-4 2-4 4s1.5 4 4 4"/></svg>
    <div>
      <h1>FontForce</h1>
      <p class="sub">Force a readable font on any page</p>
    </div>
    <span class="status" id="status">idle</span>
  </header>

  <label class="field-label" for="font">Font family</label>
  <select id="font" class="select"></select>
  <p class="hint" id="fontDesc"></p>

  <label class="field-label" for="strength">Strength <span class="val" id="strengthVal"></span></label>
  <input type="range" id="strength" min="0" max="1" step="1" value="0">
  <div class="ticks"><span>Body + text</span><span>Everything</span></div>

  <div class="row">
    <button id="apply" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
      Apply to page
    </button>
    <button id="restore" class="btn ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Restore
    </button>
  </div>

  <p class="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    Accessibility helper. Applies only when you click, only to the current tab.
    Restore removes every change. Code blocks keep a monospace font.
  </p>
</div>
<script src="popup.js"></script>
</body>
</html>
