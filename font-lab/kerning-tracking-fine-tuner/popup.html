<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KernTune</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="brand">
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/>
  </svg>
  <div>
    <h1>KernTune</h1>
    <p>Letter-spacing fine tuner</p>
  </div>
</header>

<main>
  <section class="panel">
    <div class="row">
      <label class="switch">
        <input type="checkbox" id="enabled">
        <span class="track"><span class="thumb"></span></span>
      </label>
      <span class="label">Apply to this tab</span>
      <span class="host" id="host">—</span>
    </div>

    <div class="slider-block">
      <div class="slider-head">
        <label for="tracking">Tracking (letter-spacing)</label>
        <output id="trackingVal">0.0 px</output>
      </div>
      <input type="range" id="tracking" min="-2" max="10" step="0.1" value="0">
      <div class="ticks"><span>-2</span><span>0</span><span>+10 px</span></div>
    </div>

    <div class="preview panel-inset" id="preview" aria-hidden="true">Ag</div>

    <div class="btn-row">
      <button id="restore" class="ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Restore original
      </button>
    </div>
  </section>

  <p class="hint">Typography tweak only — nothing is permanently changed. Restore or reload the page to revert.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
