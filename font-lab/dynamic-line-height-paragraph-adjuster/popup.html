<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LineEase</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="panel">
  <header class="head">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/><path d="M18 15v6M15.5 18.5 18 21l2.5-2.5"/></svg>
    <div>
      <h1>LineEase</h1>
      <p class="sub">Paragraph line-height adjuster</p>
    </div>
    <span class="status" id="status">idle</span>
  </header>

  <div class="toggle-row">
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="track"><span class="thumb"></span></span>
    </label>
    <span class="toggle-label">Apply to this page</span>
  </div>

  <label class="field-label" for="height">Line height <span class="val" id="heightVal">1.50</span></label>
  <input type="range" id="height" min="1" max="2.5" step="0.05" value="1.5">
  <div class="ticks"><span>1.0 tight</span><span>1.5 default</span><span>2.5 airy</span></div>

  <div class="preview" aria-hidden="true">
    <p class="preview-text" id="previewText">The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs.</p>
  </div>

  <button id="restore" class="btn ghost">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    Restore original
  </button>

  <p class="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    Accessibility helper. Applies only when you toggle it on, only to the
    current tab. Restore removes every change.
  </p>
</div>
<script src="popup.js"></script>
</body>
</html>
