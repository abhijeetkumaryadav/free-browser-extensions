<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReadEase</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
      <div>
        <h1>ReadEase</h1>
        <p class="sub">Dyslexia-friendly reading</p>
      </div>
    </div>
    <button id="toggle" class="switch" aria-label="Toggle ReadEase" aria-pressed="false"><span class="knob"></span></button>
  </header>

  <div class="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>An accessibility aid, not medical advice. Uses fonts already on your device; reversible any time.</span>
  </div>

  <label class="field-label">Friendly font</label>
  <div class="stacks" id="stacks"></div>

  <div class="sliders">
    <div class="slider-row">
      <div class="slider-head"><span>Letter spacing</span><span class="val" id="letterVal">0.06em</span></div>
      <input type="range" id="letter" min="0" max="15" step="1" value="6">
    </div>
    <div class="slider-row">
      <div class="slider-head"><span>Word spacing</span><span class="val" id="wordVal">0.16em</span></div>
      <input type="range" id="word" min="0" max="40" step="1" value="16">
    </div>
    <div class="slider-row">
      <div class="slider-head"><span>Line height</span><span class="val" id="lineVal">1.6</span></div>
      <input type="range" id="line" min="130" max="200" step="5" value="160">
    </div>
  </div>

  <footer class="actions">
    <button id="restore" class="btn ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      Restore page
    </button>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
