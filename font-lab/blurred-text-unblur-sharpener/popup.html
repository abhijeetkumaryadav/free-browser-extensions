<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="brand">
    <span class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    </span>
    <div>
      <h1>SharpView</h1>
      <p class="sub">Unblur &amp; contrast booster</p>
    </div>
    <span id="stateBadge" class="badge idle">Idle</span>
  </header>

  <div class="panel">
    <button id="sharpenBtn" class="primary">Sharpen this page</button>
    <button id="restoreBtn" class="ghost" disabled>Restore original</button>
  </div>

  <div class="panel">
    <div class="row">
      <label for="contrast">Contrast <span id="contrastVal" class="val">100%</span></label>
    </div>
    <input id="contrast" type="range" min="50" max="150" value="100" step="5">
    <div class="row">
      <label for="brightness">Brightness <span id="brightnessVal" class="val">100%</span></label>
    </div>
    <input id="brightness" type="range" min="50" max="150" value="100" step="5">
  </div>

  <div class="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <p>Only removes <code>blur()</code> applied by the page's own CSS. It cannot recover text blurred into images, video, or canvas by the site itself.</p>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
