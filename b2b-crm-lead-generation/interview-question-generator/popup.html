<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Question Generator</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="glass">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <div><h1>Interview Q Generator</h1><p>Template-based · works offline</p></div>
  </header>
  <main>
    <section class="glass card">
      <label class="fld">Job description
        <textarea id="jd" rows="6" placeholder="Paste the job description here…"></textarea>
      </label>
      <button id="gen" class="primary">Generate question bank</button>
      <div id="meta" class="meta" hidden>
        <div class="meta-row"><span>Role</span><b id="mRole">—</b></div>
        <div class="meta-row"><span>Experience</span><b id="mExp">—</b></div>
        <div class="chips" id="mSkills"></div>
      </div>
    </section>
    <div id="bank"></div>
    <div class="foot-row" id="footRow" hidden>
      <button id="copyAll" class="ghost">Copy all as Markdown</button>
      <p class="note">Template-based generator — no AI service, everything stays on your device.</p>
    </div>
  </main>
<script src="popup.js"></script>
</body>
</html>
