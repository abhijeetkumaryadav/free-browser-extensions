<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component Class Extractor</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </div>
    <div class="title">
      <h1>Component Class Extractor</h1>
      <p>Pick an element, get a component snippet</p>
    </div>
  </header>

  <main>
    <div class="panel">
      <button id="pickBtn" class="primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
        Pick element on page
      </button>
      <p class="hint">Hover to highlight · click to select · <kbd>Esc</kbd> to cancel</p>

      <div class="row">
        <span class="label">Depth</span>
        <div class="segment" role="group" aria-label="Extraction depth">
          <button id="depthEl" class="seg active">Element only</button>
          <button id="depthTree" class="seg">With children</button>
        </div>
      </div>
    </div>

    <div id="empty" class="panel empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <p>No element picked yet.</p>
      <span>Click “Pick element on page”, then click any element.</span>
    </div>

    <div id="result" class="panel hidden">
      <div class="meta">
        <span id="tagBadge" class="badge">&lt;div&gt;</span>
        <span id="classCount" class="count"></span>
      </div>
      <div class="tabs">
        <button id="tabHtml" class="tab active">HTML</button>
        <button id="tabCss" class="tab">CSS</button>
        <button id="tabTree" class="tab hidden">Tree</button>
      </div>
      <pre id="code" class="code"></pre>
      <div class="actions">
        <button id="copyBtn" class="primary sm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy snippet
        </button>
        <span id="copied" class="copied hidden">Copied ✓</span>
      </div>
    </div>

    <p id="err" class="err hidden"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
