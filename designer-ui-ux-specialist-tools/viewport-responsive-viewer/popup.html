<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewport Responsive Viewer</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header glass">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <div class="title-wrap">
        <h1>Viewport Viewer</h1>
        <p class="subtitle" id="pageHost">—</p>
      </div>
      <button class="icon-btn" id="openFull" title="Open full side-by-side comparison">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </button>
    </header>

    <!-- Live viewport readout -->
    <section class="glass panel">
      <div class="panel-label">Current tab viewport</div>
      <div class="viewport-readout">
        <div class="vp-dim"><span id="vpW">—</span><small>width</small></div>
        <span class="vp-x">×</span>
        <div class="vp-dim"><span id="vpH">—</span><small>height</small></div>
        <span class="vp-x">·</span>
        <div class="vp-dim"><span id="vpDpr">—</span><small>dpr</small></div>
      </div>
      <div class="breakpoint-bar" id="bpBar">
        <div class="bp" data-max="480" style="left:0;width:12%"><span>XS</span></div>
        <div class="bp" data-max="768" style="left:12%;width:14%"><span>SM</span></div>
        <div class="bp" data-max="1024" style="left:26%;width:14%"><span>MD</span></div>
        <div class="bp" data-max="1440" style="left:40%;width:20%"><span>LG</span></div>
        <div class="bp" style="left:60%;width:40%"><span>XL</span></div>
        <div class="bp-marker" id="bpMarker"></div>
      </div>
      <div class="bp-caption" id="bpCaption">Measuring…</div>
    </section>

    <!-- Device presets -->
    <section class="glass panel">
      <div class="panel-label">Device preview</div>
      <div class="device-row" id="deviceRow">
        <button class="device-btn" data-w="375" data-h="812" data-name="iPhone SE">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
          <span>375</span><small>Mobile</small>
        </button>
        <button class="device-btn" data-w="768" data-h="1024" data-name="iPad">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
          <span>768</span><small>Tablet</small>
        </button>
        <button class="device-btn" data-w="1024" data-h="768" data-name="Laptop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
          <span>1024</span><small>Laptop</small>
        </button>
        <button class="device-btn" data-w="1440" data-h="900" data-name="Desktop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <span>1440</span><small>Desktop</small>
        </button>
      </div>
      <div class="custom-row">
        <input type="number" id="customW" min="200" max="2560" placeholder="Width">
        <span class="vp-x">×</span>
        <input type="number" id="customH" min="200" max="2560" placeholder="Height">
        <button class="btn" id="customGo">Preview</button>
      </div>
    </section>

    <!-- Preview frame -->
    <section class="glass panel preview-panel">
      <div class="panel-label row-between">
        <span id="previewLabel">No preview</span>
        <span class="scale-badge" id="scaleBadge"></span>
      </div>
      <div class="preview-scroll" id="previewScroll">
        <div class="preview-stage" id="previewStage">
          <div class="preview-empty" id="previewEmpty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <p>Pick a device above to preview this page at that width.</p>
          </div>
        </div>
      </div>
      <p class="hint" id="frameHint" hidden>Some sites block framing (X-Frame-Options) — the preview may appear blank for those.</p>
    </section>
  </div>
<script src="popup.js"></script>
</body>
</html>
