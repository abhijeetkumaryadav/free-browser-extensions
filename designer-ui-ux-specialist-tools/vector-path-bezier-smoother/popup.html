<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="app-header">
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c4-1 5-8 9-9s8-2 7-7"/><circle cx="4" cy="20" r="1.6"/><circle cx="20" cy="4" r="1.6"/></svg>
  <div>
    <h1>Bezier Smoother</h1>
    <p class="subtitle">Chaikin corner smoothing for SVG paths</p>
  </div>
</header>

<main>
  <section class="panel">
    <label class="field-label" for="pathInput">SVG path data</label>
    <textarea id="pathInput" rows="3" placeholder="M10,80 C40,10 65,10 95,80 S150,150 180,80 …" spellcheck="false"></textarea>
    <div class="row">
      <button id="sampleBtn" class="btn-ghost">Load sample</button>
      <button id="clearBtn" class="btn-ghost">Clear</button>
    </div>
  </section>

  <section class="panel">
    <label class="field-label" for="iterRange">Smoothing iterations: <strong id="iterVal">2</strong></label>
    <input type="range" id="iterRange" min="0" max="5" step="1" value="2">
    <div class="stats-row">
      <div class="stat"><span class="stat-num" id="ptsBefore">0</span><span class="stat-label">points in</span></div>
      <div class="stat"><span class="stat-num" id="ptsAfter">0</span><span class="stat-label">points out</span></div>
    </div>
  </section>

  <section class="panel preview-panel">
    <div class="legend">
      <span><i class="swatch orig"></i>original</span>
      <span><i class="swatch smooth"></i>smoothed</span>
    </div>
    <canvas id="preview" width="332" height="170"></canvas>
  </section>

  <section class="panel">
    <label class="field-label">Smoothed path output</label>
    <textarea id="pathOutput" rows="3" readonly spellcheck="false" placeholder="Smoothed path appears here…"></textarea>
    <button id="copyBtn" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy smoothed path
    </button>
    <p class="hint" id="status"></p>
  </section>
</main>

<script src="popup.js"></script>
</body>
</html>
