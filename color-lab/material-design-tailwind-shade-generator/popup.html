<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadeForge</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7 6.7 8.6a7 7 0 1 0 10.6 0L12 2.7z"/><circle cx="12" cy="14" r="2.6"/></svg>
    </div>
    <div>
      <h1>ShadeForge</h1>
      <p class="sub">Tailwind shade generator</p>
    </div>
  </header>

  <section class="panel">
    <label class="field-label" for="base">Base color</label>
    <div class="base-row">
      <input type="color" id="base" value="#3b82f6" title="Pick a base color">
      <input type="text" id="hex" value="#3b82f6" maxlength="7" spellcheck="false" placeholder="#3b82f6">
      <button id="random" class="btn ghost" title="Random color">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.4"/><circle cx="15" cy="15" r="1.4"/><circle cx="15" cy="9" r="1.4"/><circle cx="9" cy="15" r="1.4"/></svg>
      </button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span class="field-label">Shade scale · 50–900</span>
      <span class="badge">local · offline</span>
    </div>
    <div id="swatches" class="swatches"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span class="field-label">Export</span>
      <div class="seg">
        <button class="seg-btn active" data-mode="tailwind">Tailwind</button>
        <button class="seg-btn" data-mode="css">CSS vars</button>
        <button class="seg-btn" data-mode="json">JSON</button>
      </div>
    </div>
    <pre id="code" class="code"></pre>
    <div class="actions">
      <input type="text" id="name" value="brand" maxlength="24" spellcheck="false" placeholder="color name">
      <button id="copy" class="btn primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
    </div>
  </section>

  <p class="note">Click a swatch to copy its hex. Scale is generated locally with HSL lightness interpolation — an approximation, not the official Material/Tailwind palettes.</p>
  <div id="toast" class="toast" aria-live="polite"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
