<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChromaShift — Color Format Converter</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18c-1.5 0-2-1-1.3-2.2.8-1.4.2-2.8-1.2-2.8H7a4 4 0 0 1-4-4c0-4 4-9 9-9z"/><circle cx="8.5" cy="10.5" r=".8" fill="currentColor"/><circle cx="12" cy="8" r=".8" fill="currentColor"/><circle cx="15" cy="11" r=".8" fill="currentColor"/></svg>
    <div>
      <h1>ChromaShift</h1>
      <p class="tagline">HEX ⇄ RGB ⇄ HSL ⇄ HSV</p>
    </div>
  </header>

  <section class="card">
    <div class="preview" id="preview">
      <input type="color" id="nativePicker" value="#8b5cf6" title="Open system color picker">
    </div>
    <div class="field">
      <label for="inHex">HEX</label>
      <div class="input-row">
        <input id="inHex" class="mono" value="#8B5CF6" spellcheck="false" maxlength="7">
        <button class="copy" data-copy="hex" title="Copy HEX">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
    </div>
    <div class="field">
      <label>RGB</label>
      <div class="triple">
        <input id="inR" class="mono num" type="number" min="0" max="255" value="139">
        <input id="inG" class="mono num" type="number" min="0" max="255" value="92">
        <input id="inB" class="mono num" type="number" min="0" max="255" value="246">
        <button class="copy" data-copy="rgb" title="Copy rgb()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
    </div>
    <div class="field">
      <label>HSL</label>
      <div class="triple">
        <input id="inH" class="mono num" type="number" min="0" max="360" value="258">
        <input id="inS" class="mono num" type="number" min="0" max="100" value="90">
        <input id="inL" class="mono num" type="number" min="0" max="100" value="66">
        <button class="copy" data-copy="hsl" title="Copy hsl()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
    </div>
    <div class="field">
      <label>HSV</label>
      <div class="triple">
        <input id="inHv" class="mono num" type="number" min="0" max="360" value="258">
        <input id="inSv" class="mono num" type="number" min="0" max="100" value="63">
        <input id="inV" class="mono num" type="number" min="0" max="100" value="96">
        <button class="copy" data-copy="hsv" title="Copy hsv()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
    </div>
    <p class="err" id="err" hidden>Invalid value — check the format and try again.</p>
  </section>

  <section class="card">
    <div class="history-head">
      <p class="card-title">Recent colors</p>
      <button class="link" id="btnClear">Clear</button>
    </div>
    <div class="history" id="history"><span class="empty">Convert a color and it will appear here.</span></div>
  </section>

  <footer class="foot"><span id="status">All conversions happen locally</span></footer>
</div>
<script src="popup.js"></script>
</body>
</html>
