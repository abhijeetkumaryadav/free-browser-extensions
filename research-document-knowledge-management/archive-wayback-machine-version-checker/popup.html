<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayback Lens</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
      </svg>
    </div>
    <div>
      <h1>Wayback Lens</h1>
      <p class="subtitle">Archive version checker</p>
    </div>
  </header>

  <section class="panel">
    <p id="pageUrl" class="url">—</p>
    <button id="checkBtn" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
      </svg>
      Check Wayback Machine
    </button>
    <p id="status" class="status" role="status"></p>
  </section>

  <section id="results" class="panel hidden">
    <div class="snapshot-hero">
      <div>
        <p class="label">Closest snapshot</p>
        <p id="snapshotDate" class="snapshot-date">—</p>
        <p id="snapshotMeta" class="meta">—</p>
      </div>
      <button id="openBtn" class="btn-accent">Open</button>
    </div>
    <div class="count-row">
      <span class="label">Archived snapshots</span>
      <span id="snapshotCount" class="count">—</span>
    </div>
    <h3>Recent snapshots</h3>
    <ul id="timeline" class="timeline"></ul>
  </section>

  <footer class="footer">Read-only lookup via the public Wayback Machine API. No data stored.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
