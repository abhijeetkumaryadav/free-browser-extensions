<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="popup.css">
<title>WikiClean</title>
</head>
<body>
<div class="shell">
  <header class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h20"/><path d="M4 4v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4"/><path d="M8 9h8"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
    </span>
    <div>
      <h1>WikiClean</h1>
      <p class="sub">Modern reading layer for Wikipedia</p>
    </div>
    <label class="switch master" title="Toggle reading mode">
      <input type="checkbox" id="enabled">
      <span class="track"><span class="thumb"></span></span>
    </label>
  </header>

  <div id="notWiki" class="notice hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <p>Open a <strong>wikipedia.org</strong> page to style it.</p>
  </div>

  <main id="controls">
    <section class="card">
      <h2>Theme</h2>
      <div class="themes" role="radiogroup" aria-label="Theme">
        <button class="theme light" data-theme="light" title="Light"><span class="dot"></span>Light</button>
        <button class="theme dark" data-theme="dark" title="Dark"><span class="dot"></span>Dark</button>
        <button class="theme sepia" data-theme="sepia" title="Sepia"><span class="dot"></span>Sepia</button>
      </div>
    </section>

    <section class="card">
      <h2>Typography</h2>
      <div class="row">
        <label for="fontSize">Font size <span id="fontSizeVal" class="val">18px</span></label>
        <input type="range" id="fontSize" min="14" max="24" step="1" value="18">
      </div>
    </section>

    <section class="card">
      <h2>Layout</h2>
      <div class="row toggle">
        <span>Hide sidebar</span>
        <label class="switch"><input type="checkbox" id="hideSidebar" checked><span class="track"><span class="thumb"></span></span></label>
      </div>
      <div class="row toggle">
        <span>Hide table of contents</span>
        <label class="switch"><input type="checkbox" id="hideToc" checked><span class="track"><span class="thumb"></span></span></label>
      </div>
      <div class="row toggle">
        <span>Hide top header</span>
        <label class="switch"><input type="checkbox" id="hideHeader" checked><span class="track"><span class="thumb"></span></span></label>
      </div>
    </section>

    <p class="foot">Preferences are saved per wiki (e.g. en.wikipedia.org). CSS-only — disable anytime to restore the original page.</p>
  </main>
</div>
<script src="popup.js"></script>
</body>
</html>
