<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TableSnatch</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
      <div>
        <h1>TableSnatch</h1>
        <p class="subtitle">Table → CSV converter</p>
      </div>
    </div>
    <div class="count-badge" id="countBadge">0</div>
  </header>

  <main>
    <button class="btn primary" id="scanBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      Scan page for tables
    </button>

    <div class="options">
      <label class="opt">
        Delimiter
        <select id="delimiter">
          <option value=",">Comma (,)</option>
          <option value=";">Semicolon (;)</option>
          <option value="&#9;">Tab</option>
          <option value="|">Pipe (|)</option>
        </select>
      </label>
      <label class="opt check">
        <input type="checkbox" id="headerRow" checked>
        Treat first row as header
      </label>
    </div>

    <div class="section-title">Tables found</div>
    <div class="table-list" id="tableList"></div>
    <div class="empty" id="emptyState">No scan yet — click "Scan page for tables".</div>
  </main>

<script src="popup.js"></script>
</body>
</html>
