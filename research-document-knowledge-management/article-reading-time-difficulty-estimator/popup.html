<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadingLens</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    </div>
    <div>
      <h1>ReadingLens</h1>
      <p class="subtitle">Reading time &amp; difficulty</p>
    </div>
  </header>

  <section class="panel">
    <button id="analyzeBtn" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      Analyze this page
    </button>
    <div class="wpm-row">
      <label for="wpm">Reading speed</label>
      <input type="range" id="wpm" min="150" max="350" step="10" value="200">
      <span id="wpmVal">200 wpm</span>
    </div>
    <p id="status" class="status" role="status"></p>
  </section>

  <section id="results" class="panel hidden">
    <h2 id="pageTitle"></h2>
    <div class="verdict-row">
      <span id="verdict" class="verdict">—</span>
      <span id="ease" class="ease">—</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat-label">Words</span><span id="words" class="stat-value">—</span></div>
      <div class="stat"><span class="stat-label">Reading time</span><span id="minutes" class="stat-value">—</span></div>
      <div class="stat"><span class="stat-label">Grade level</span><span id="grade" class="stat-value">—</span></div>
      <div class="stat"><span class="stat-label">Sentences</span><span id="sentences" class="stat-value">—</span></div>
    </div>
    <h3>Top keywords</h3>
    <div id="keywords" class="chips"></div>
  </section>

  <footer class="footer">Computed on-device. No data leaves your browser.</footer>
</div>
<script src="popup.js"></script>
</body>
</html>
